<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

    <style>
        /* ==========================================================================
           1. STRICT FONT FACE DEFINITIONS (Root Directory)
           ========================================================================== 
           These fonts control every single letter in the UI. 
           E1 = English Main, E2 = English Header
           B1 = Bangla Header, B2 = Bangla Main
        */
        
        @font-face {
            font-family: 'EnglishMain';
            src: url('/E1.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        
        @font-face {
            font-family: 'EnglishMain-Bold';
            src: url('/E1.ttf') format('truetype'); /* Fallback to standard if bold missing */
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'EnglishHeader';
            src: url('/E2.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaHeader';
            src: url('/B1.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaMain';
            src: url('/B2.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        
        @font-face {
            font-family: 'BanglaMain-Bold';
            src: url('/B2.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        /* ==========================================================================
           2. CSS VARIABLES (DESIGN TOKENS)
           ========================================================================== */
        :root {
            /* Color Palette - Minimalist Pure Article */
            --color-bg-primary: #ffffff;
            --color-bg-secondary: #f9fafb;
            --color-bg-overlay: rgba(0, 0, 0, 0.6);
            --color-bg-toast: #1a1a1a;
            
            --color-text-primary: #111827;
            --color-text-secondary: #4b5563;
            --color-text-muted: #6b7280;
            --color-text-inverse: #ffffff;
            
            --color-border-light: #e5e7eb;
            --color-border-dark: #d1d5db;
            
            --color-brand-primary: #000000;
            --color-brand-hover: #333333;
            --color-brand-active: #111111;
            
            --color-focus-ring: rgba(0, 0, 0, 0.2);

            /* Spacing Scale */
            --space-0: 0px;
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-5: 1.25rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-10: 2.5rem;
            --space-12: 3rem;
            --space-16: 4rem;
            --space-20: 5rem;
            --space-24: 6rem;

            /* Typography Scale */
            --text-xs: 0.75rem;
            --text-sm: 0.875rem;
            --text-base: 1.125rem; /* Highly readable base size */
            --text-lg: 1.25rem;
            --text-xl: 1.5rem;
            --text-2xl: 1.875rem;
            --text-3xl: 2.25rem;
            --text-4xl: 3rem;
            
            --line-height-tight: 1.25;
            --line-height-snug: 1.375;
            --line-height-normal: 1.5;
            --line-height-relaxed: 1.75;
            --line-height-loose: 2;

            /* Layout Constraints */
            --layout-max-width: 800px;
            --layout-header-height: 72px;
            
            /* Border Radius */
            --radius-sm: 0.25rem;
            --radius-md: 0.375rem;
            --radius-lg: 0.5rem;
            --radius-full: 9999px;
            
            /* Z-Index Scale */
            --z-below: -1;
            --z-base: 0;
            --z-above: 10;
            --z-header: 100;
            --z-modal: 1000;
            --z-toast: 2000;
            
            /* Transitions */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 300ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 500ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* STRICT LANGUAGE FONT BINDINGS 
           These variables swap based on the <html> lang attribute.
        */
        html[lang="en"] {
            --font-primary: 'EnglishMain', sans-serif;
            --font-heading: 'EnglishHeader', sans-serif;
            --font-bold: 'EnglishMain-Bold', sans-serif;
        }

        html[lang="bn"] {
            --font-primary: 'BanglaMain', sans-serif;
            --font-heading: 'BanglaHeader', sans-serif;
            --font-bold: 'BanglaMain-Bold', sans-serif;
        }

        /* ==========================================================================
           3. CSS RESET (Comprehensive)
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* ENFORCING FONT CONTROL ON EVERY SINGLE LETTER */
            font-family: var(--font-primary) !important; 
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--color-bg-primary);
            color: var(--color-text-primary);
            line-height: var(--line-height-relaxed);
            font-size: var(--text-base);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-top: var(--layout-header-height);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Heading overrides for strict header fonts */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading) !important;
            color: var(--color-text-primary);
            line-height: var(--line-height-tight);
            margin-top: var(--space-8);
            margin-bottom: var(--space-4);
            font-weight: 700;
        }

        strong, b {
            font-family: var(--font-bold) !important;
            font-weight: 700;
        }

        button, input, textarea, select {
            font-family: var(--font-primary) !important;
            border: none;
            background: none;
            cursor: pointer;
            outline: none;
            color: inherit;
        }

        button:focus-visible, a:focus-visible {
            box-shadow: 0 0 0 3px var(--color-focus-ring);
            border-radius: var(--radius-sm);
        }

        ul, ol {
            padding-left: var(--space-6);
            margin-bottom: var(--space-6);
        }

        li {
            margin-bottom: var(--space-2);
        }

        p {
            margin-bottom: var(--space-6);
        }

        img, picture, video, canvas, svg {
            display: block;
            max-width: 100%;
            height: auto;
        }

        svg {
            fill: currentColor;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        hr {
            border: none;
            border-top: 1px solid var(--color-border-light);
            margin: var(--space-10) 0;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: var(--space-6);
        }

        /* ==========================================================================
           4. GLOBAL UTILITY CLASSES
           ========================================================================== */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .text-right { text-align: right; }
        .text-justify { text-align: justify; }
        
        .mt-0 { margin-top: var(--space-0); }
        .mt-4 { margin-top: var(--space-4); }
        .mt-8 { margin-top: var(--space-8); }
        
        .mb-0 { margin-bottom: var(--space-0); }
        .mb-4 { margin-bottom: var(--space-4); }
        .mb-8 { margin-bottom: var(--space-8); }

        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: var(--space-2); }
        .gap-4 { gap: var(--space-4); }
        
        .w-full { width: 100%; }
        .h-full { height: 100%; }

        /* ==========================================================================
           5. HEADER STYLES (Fixed Navigation)
           ========================================================================== */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--layout-header-height);
            background-color: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid var(--color-border-light);
            z-index: var(--z-header);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-4);
            transition: transform var(--transition-normal);
        }

        .site-header.hide-on-scroll {
            transform: translateY(-100%);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            text-decoration: none;
        }

        .site-logo {
            height: 48px;
            width: 48px;
            object-fit: contain;
            /* Rule: BW first, then show. */
            filter: grayscale(100%) contrast(1.1);
            transition: filter var(--transition-normal);
        }

        .site-title {
            font-family: var(--font-heading) !important;
            font-size: var(--text-base);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-brand-primary);
            display: none; /* Hidden on very small mobile */
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            border: 1px solid var(--color-border-dark);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-family: var(--font-primary) !important;
            font-weight: 700;
            transition: all var(--transition-fast);
            background-color: var(--color-bg-primary);
            color: var(--color-text-primary);
            user-select: none;
        }

        .btn:hover {
            background-color: var(--color-bg-secondary);
            border-color: var(--color-text-primary);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background-color: var(--color-brand-primary);
            color: var(--color-text-inverse);
            border-color: var(--color-brand-primary);
        }

        .btn-primary:hover {
            background-color: var(--color-brand-hover);
            color: var(--color-text-inverse);
            border-color: var(--color-brand-hover);
        }
        
        .btn-primary svg {
            fill: var(--color-text-inverse);
        }

        .btn-icon-only {
            padding: var(--space-2);
        }

        /* Mobile Menu Toggle */
        .menu-toggle {
            display: flex;
            padding: var(--space-2);
            background: none;
            border: none;
            color: var(--color-text-primary);
            cursor: pointer;
        }

        /* ==========================================================================
           6. MAIN LAYOUT & ARTICLE STRUCTURE
           ========================================================================== */
        .main-content {
            flex: 1;
            width: 100%;
            max-width: var(--layout-max-width);
            margin: 0 auto;
            padding: var(--space-6) var(--space-4);
        }

        /* Hero Section */
        .hero-section {
            margin-bottom: var(--space-8);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--color-border-light);
            background-color: var(--color-bg-secondary);
        }

        .hero-image {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }
        
        /* Action Bar (Share/Download) */
        .action-bar {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: var(--space-3);
            padding-bottom: var(--space-6);
            margin-bottom: var(--space-8);
            border-bottom: 1px solid var(--color-border-light);
            flex-wrap: wrap;
        }

        /* Typography within the article */
        .article-body {
            position: relative;
        }

        .article-title {
            font-size: var(--text-2xl);
            margin-top: 0;
            margin-bottom: var(--space-6);
            color: var(--color-brand-primary);
        }

        .article-body h2 {
            font-size: var(--text-xl);
            margin-top: var(--space-12);
            padding-bottom: var(--space-2);
            border-bottom: 2px solid var(--color-border-light);
        }
        
        .article-body h3 {
            font-size: var(--text-lg);
            margin-top: var(--space-8);
        }

        .article-body p {
            color: var(--color-text-secondary);
            text-align: justify;
        }

        .article-body li {
            color: var(--color-text-secondary);
            padding-left: var(--space-2);
        }
        
        .article-body ul li::marker,
        .article-body ol li::marker {
            color: var(--color-brand-primary);
            font-weight: bold;
        }

        /* Strict Rule: Links must be text, not hyperlinked.
           Styling them to look like code blocks/raw text to distinguish them.
        */
        .raw-link {
            display: inline-block;
            word-break: break-all;
            color: var(--color-text-muted);
            font-size: 0.9em;
            background-color: var(--color-bg-secondary);
            padding: 0.1rem 0.4rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border-light);
            font-family: monospace !important; /* The only exception for URLs to prevent misreading, but can be overridden by global */
            margin-top: var(--space-1);
        }

        /* ==========================================================================
           7. MODALS & TOAST NOTIFICATIONS
           ========================================================================== */
        
        /* Print Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--color-bg-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: var(--z-modal);
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-normal), visibility var(--transition-normal);
            backdrop-filter: blur(4px);
        }

        .modal-overlay.is-active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--color-bg-primary);
            padding: var(--space-6);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: scale(0.95) translateY(20px);
            transition: transform var(--transition-normal);
        }

        .modal-overlay.is-active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-6);
            padding-bottom: var(--space-4);
            border-bottom: 1px solid var(--color-border-light);
        }

        .modal-title {
            margin: 0;
            font-size: var(--text-lg);
        }

        .modal-close-btn {
            background: none;
            border: none;
            padding: var(--space-1);
            color: var(--color-text-muted);
            border-radius: var(--radius-sm);
            transition: background var(--transition-fast);
        }
        
        .modal-close-btn:hover {
            background: var(--color-bg-secondary);
            color: var(--color-text-primary);
        }

        .print-options-grid {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .print-btn-choice {
            width: 100%;
            justify-content: flex-start;
            padding: var(--space-3) var(--space-4);
            font-size: var(--text-base);
            text-align: left;
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            bottom: var(--space-8);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--color-bg-toast);
            color: var(--color-text-inverse);
            padding: var(--space-3) var(--space-6);
            border-radius: var(--radius-full);
            font-size: var(--text-sm);
            font-weight: 700;
            z-index: var(--z-toast);
            opacity: 0;
            visibility: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .toast-container.is-visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }
        
        .toast-container svg {
            fill: var(--color-text-inverse);
            width: 18px;
            height: 18px;
        }

        /* ==========================================================================
           8. RESPONSIVE BREAKPOINTS (Mobile First)
           ========================================================================== */
        
        /* Tablet & Up */
        @media (min-width: 640px) {
            .site-title {
                display: block;
                font-size: var(--text-lg);
            }
            .article-title {
                font-size: var(--text-3xl);
            }
            .btn-lang-text {
                display: inline;
            }
            .main-content {
                padding: var(--space-10) var(--space-8);
            }
        }

        /* Desktop & Up */
        @media (min-width: 1024px) {
            .article-title {
                font-size: var(--text-4xl);
            }
            .menu-toggle {
                display: none; /* Hide hamburger on desktop */
            }
        }

        /* ==========================================================================
           9. ADVANCED PRINT MEDIA QUERIES (Strict Rules)
           ========================================================================== */
        @media print {
            /* 1. Reset everything to basic for ink saving */
            @page {
                margin: 2cm;
                size: A4 portrait;
            }

            html, body {
                background: #ffffff !important;
                color: #000000 !important;
                font-size: 11pt !important; /* Optimal print reading size */
                line-height: 1.5 !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            /* 2. Hide all UI elements non-essential to reading */
            .site-header, 
            .action-bar, 
            .modal-overlay, 
            .toast-container,
            button,
            .menu-toggle {
                display: none !important;
            }

            /* 3. Layout constraints removal */
            .main-content {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* 4. Image Handling - All pics in print, grayscale for ink saving */
            .hero-section {
                border: none !important;
                margin-bottom: 2cm !important;
                page-break-inside: avoid;
                background: none !important;
            }

            .hero-image {
                max-height: 350px !important;
                object-fit: contain !important;
                filter: grayscale(100%) !important;
                width: auto !important;
                margin: 0 auto !important;
            }

            /* 5. Typography strict black and formatting */
            h1, h2, h3, h4, h5, h6, p, li, span, strong {
                color: #000000 !important;
                page-break-inside: avoid;
            }

            h1 {
                font-size: 24pt !important;
                margin-bottom: 12pt !important;
                page-break-after: avoid;
            }

            h2 {
                font-size: 16pt !important;
                border-bottom: 1pt solid #000000 !important;
                padding-bottom: 4pt !important;
                margin-top: 24pt !important;
                page-break-after: avoid;
            }

            p {
                margin-bottom: 12pt !important;
                text-align: justify !important;
                orphans: 3; /* Prevent dangling lines */
                widows: 3;
            }

            /* 6. Links as text handling in print */
            .raw-link {
                background: transparent !important;
                border: none !important;
                padding: 0 !important;
                color: #333333 !important;
                font-size: 9pt !important;
                display: inline !important;
            }
            .raw-link::before { content: " ("; }
            .raw-link::after { content: ") "; }

            /* 7. Videos must be removed in print (Future proofing) */
            video, iframe, .video-wrapper {
                display: none !important;
            }
        }
        
        /* Bilingual Print Container Classes 
           Injected virtually when "Print Both" is selected.
        */
        .bilingual-print-layout {
            display: flex;
            width: 100%;
            gap: 2cm;
            align-items: flex-start;
        }
        
        .bilingual-print-column {
            flex: 1;
            width: 50%;
        }

        .bilingual-print-header {
            text-align: center;
            font-size: 20pt;
            margin-bottom: 1cm;
            border-bottom: 2pt solid #000;
            padding-bottom: 0.5cm;
        }
    </style>
</head>

    <!-- ==========================================================================
         HEADER COMPONENT (Fixed)
         ========================================================================== -->
    <header class="site-header" id="js-header">
        <a href="/" class="header-left" aria-label="Go to Homepage">

            <img src="/home.png" alt="Site Logo" class="site-logo" onerror="this.style.display='none';">
            <span class="site-title">ISTIACK'S JULY CORNER</span>
        </a>
        
        <div class="header-right">
            <!-- Language Toggle Button: Strict adherence to font rules -->
            <button class="btn" id="js-lang-toggle" aria-label="Toggle Language" title="Change Language">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                        "উইকিপিডিয়া আন্দোলনের সময়রেখার ওভারভিউ: <span class='raw-link'>https://en.wikipedia.org/wiki/2024_Bangladesh_quota_reform_movement</span>"
                    ]},

                    { type: 'p', content: "<small>[১] <span class='raw-link'>https://www.isas.nus.edu.sg</span><br>[২] <span class='raw-link'>https://www.isas.nus.edu.sg</span><br>[৩] <span class='raw-link'>https://www.thedailystar.net</span><br>[৪] <span class='raw-link'>https://www.thedailystar.net</span><br>[৫] <span class='raw-link'>https://www.bssnews.net</span><br>[৬] <span class='raw-link'>https://www.bssnews.net</span><br>[৭] <span class='raw-link'>https://www.thedailystar.net</span><br>[৮] <span class='raw-link'>https://www.thehindu.com</span><br>[৯] <span class='raw-link'>https://www.thedailystar.net</span></small>" }
                ]
            }
        };

        /**
         * Global Application State
         */
        const AppState = {
            currentLang: 'en',
            isModalOpen: false,
            lastScrollY: window.scrollY
        };

        /**
         * DOM Node References Cache
         */
        const DOM = {
            html: document.documentElement,
            articleContainer: document.getElementById('js-article-container'),
            langToggleBtn: document.getElementById('js-lang-toggle'),
            uiLangText: document.getElementById('js-ui-lang-text'),
            shareBtn: document.getElementById('js-share-btn'),
            uiShareText: document.getElementById('js-ui-share-text'),
            printTriggerBtn: document.getElementById('js-print-trigger'),
            uiPrintText: document.getElementById('js-ui-print-text'),
            printModal: document.getElementById('js-print-modal'),
            closeModalBtn: document.getElementById('js-close-modal'),
            modalTitle: document.getElementById('modal-title'),
            printChoices: document.querySelectorAll('.print-btn-choice'),
            toast: document.getElementById('js-toast'),
            toastMsg: document.getElementById('js-toast-msg'),
            header: document.getElementById('js-header')
        };

        /**
         * Core Engine: Node Generator
         * Takes a JSON block and strictly generates safe HTML DOM elements.
         * Prevents direct innerHTML on the main container where possible.
         */
        function constructDOMNode(block) {
            let el = null;
            
            try {
                switch(block.type) {
                    case 'title':
                        el = document.createElement('h1');
                        el.className = 'article-title';
                        el.innerHTML = block.content;
                        break;
                    case 'h2':
                        el = document.createElement('h2');
                        el.innerHTML = block.content;
                        break;
                    case 'h3':
                        el = document.createElement('h3');
                        el.innerHTML = block.content;
                        break;
                    case 'p':
                        el = document.createElement('p');
                        el.innerHTML = block.content;
                        break;
                    case 'hr':
                        el = document.createElement('hr');
                        break;
                    case 'list':
                        el = document.createElement('ul');
                        if (Array.isArray(block.items)) {
                            block.items.forEach(itemStr => {
                                const li = document.createElement('li');
                                li.innerHTML = itemStr;
                                el.appendChild(li);
                            });
                        }
                        break;
                    default:
                        console.warn('Unknown block type skipped:', block.type);
                }
            } catch (err) {
                console.error('Error constructing DOM node:', err);
            }
            
            return el;
        }

        /**
         * Render Controller
         * Clears the article container and pipes the JSON content through the node generator.
         * Updates global UI text (buttons, modals) based on language state.
         * * @param {string} langCode - 'en' or 'bn'
         */
        function renderArticle(langCode) {
            if (!AppDatabase.content[langCode]) return;
            
            // 1. Clear existing content securely
            DOM.articleContainer.innerHTML = '';
            
            // 2. Fetch specific language array
            const dataBlocks = AppDatabase.content[langCode];
            
            // 3. Construct and append Document Fragment for performance
            const fragment = document.createDocumentFragment();
            dataBlocks.forEach(block => {
                const node = constructDOMNode(block);
                if (node) fragment.appendChild(node);
            });
            DOM.articleContainer.appendChild(fragment);

            // 4. Update UI Chrome strings
            const uiStrings = AppDatabase.ui[langCode];
            DOM.uiLangText.textContent = uiStrings.langBtnText;
            DOM.uiShareText.textContent = uiStrings.shareText;
            DOM.uiPrintText.textContent = uiStrings.printText;
            DOM.modalTitle.textContent = uiStrings.modalTitle;
            
            // 5. CRITICAL: Swap HTML lang attribute. 
            // This triggers the CSS :root variables to swap font families system-wide!
            DOM.html.setAttribute('lang', langCode);
            
            // Ensure aria-labels are updated for screen readers
            DOM.langToggleBtn.setAttribute('aria-label', `Switch to ${langCode === 'en' ? 'Bangla' : 'English'}`);
        }

        /**
         * Action: Toggle Language State
         */
        function handleLanguageToggle() {
            AppState.currentLang = AppState.currentLang === 'en' ? 'bn' : 'en';
            renderArticle(AppState.currentLang);
        }

        /**
         * Action: Share URL to Clipboard (Fallback robustly handled)
         */
        function handleShare() {
            const copyUrl = AppDatabase.config.copyUrl;
            const toastStr = AppDatabase.ui[AppState.currentLang].toastMsg;
            
            if (navigator.clipboard && window.isSecureContext) {
                // Modern Async Clipboard API
                navigator.clipboard.writeText(copyUrl).then(() => {
                    displayToast(toastStr);
                }).catch(err => {
                    console.error("Clipboard API failed, using fallback.", err);
                    executeFallbackCopy(copyUrl, toastStr);
                });
            } else {
                // Fallback for older browsers or non-HTTPS
                executeFallbackCopy(copyUrl, toastStr);
            }
        }

        function executeFallbackCopy(text, successMsg) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "-99999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                displayToast(successMsg);
            } catch (err) {
                console.error('Fallback execCommand failed.', err);
                alert("Failed to copy link. URL: " + text);
            } finally {
                document.body.removeChild(textArea);
            }
        }

        /**
         * UI Component: Toast Notification
         */
        let toastTimeout = null;
        function displayToast(msg) {
            if (toastTimeout) clearTimeout(toastTimeout);
            
            DOM.toastMsg.textContent = msg;
            DOM.toast.classList.add('is-visible');
            
            toastTimeout = setTimeout(() => {
                DOM.toast.classList.remove('is-visible');
            }, 3500);
        }

        /**
         * Print Modal Visibility Controllers
         */
        function showPrintModal() {
            AppState.isModalOpen = true;
            DOM.printModal.classList.add('is-active');
            DOM.printModal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function hidePrintModal() {
            AppState.isModalOpen = false;
            DOM.printModal.classList.remove('is-active');
            DOM.printModal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        /**
         * Advanced Print Execution Engine
         * Handles the complex logic of constructing a virtual DOM for "Both" languages,
         * temporarily swapping it in, triggering the OS print dialog, and gracefully reverting.
         * * @param {string} targetLang - 'en', 'bn', or 'both'
         */
        function executePrintJob(targetLang) {
            hidePrintModal();
            
            // Cache current state so we can restore it exactly after the user prints
            const cachedLang = AppState.currentLang;
            
            if (targetLang === 'en' || targetLang === 'bn') {
                // Simple Flow: Single Language Print
                renderArticle(targetLang);
                
                // Allow DOM to paint font changes before triggering print dialog
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        window.print();
                        // Revert to user's original language immediately after print completes
                        if (targetLang !== cachedLang) {
                            renderArticle(cachedLang);
                        }
                    }, 200);
                });
                
            } else if (targetLang === 'both') {
                // Complex Flow: Bilingual Print Execution
                const originalContainerHTML = DOM.articleContainer.innerHTML;
                DOM.articleContainer.innerHTML = ''; 
                
                // Construct the Bilingual Print Container wrapper
                const bilingualWrapper = document.createElement('div');
                bilingualWrapper.className = 'bilingual-print-layout';
                
                // Create English Column
                const colEn = document.createElement('div');
                colEn.className = 'bilingual-print-column';
                colEn.setAttribute('lang', 'en'); // Force English Fonts
                
                // Create Bangla Column
                const colBn = document.createElement('div');
                colBn.className = 'bilingual-print-column';
                colBn.setAttribute('lang', 'bn'); // Force Bangla Fonts

                // Header for Bilingual Document
                const dualHeader = document.createElement('h1');
                dualHeader.className = 'bilingual-print-header';
                dualHeader.innerHTML = "Bilingual Document Record<br>দ্বিভাষিক নথিপত্র";
                DOM.articleContainer.appendChild(dualHeader);

                // Populate English Column
                AppDatabase.content.en.forEach(block => {
                    const node = constructDOMNode(block);
                    if(node) {
                        // Hardcode font styles inline specifically for the print render to guarantee separation
                        node.style.fontFamily = "var(--font-primary, 'EnglishMain', sans-serif)";
                        colEn.appendChild(node);
                    }
                });

                // Populate Bangla Column
                AppDatabase.content.bn.forEach(block => {
                    const node = constructDOMNode(block);
                    if(node) {
                        node.style.fontFamily = "var(--font-primary, 'BanglaMain', sans-serif)";
                        colBn.appendChild(node);
                    }
                });

                bilingualWrapper.appendChild(colEn);
                bilingualWrapper.appendChild(colBn);
                DOM.articleContainer.appendChild(bilingualWrapper);

                // Execute Print and Revert
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        window.print();
                        // DOM Revert
                        DOM.articleContainer.innerHTML = originalContainerHTML;
                        renderArticle(cachedLang); 
                    }, 400); // Slightly longer delay for heavy DOM construction
                });
            }
        }

        /**
         * Scroll Controller for Smart Header
         * Hides header on scroll down, shows on scroll up for reading focus.
         */
        function handleScroll() {
            const currentScrollY = window.scrollY;
            if (currentScrollY > 100) {
                if (currentScrollY > AppState.lastScrollY) {
                    DOM.header.classList.add('hide-on-scroll');
                } else {
                    DOM.header.classList.remove('hide-on-scroll');
                }
            } else {
                DOM.header.classList.remove('hide-on-scroll');
            }
            AppState.lastScrollY = currentScrollY;
        }

        /**
         * Event Listener Binding Initialization
         */
        function initEventListeners() {
            // Main Actions
            DOM.langToggleBtn.addEventListener('click', handleLanguageToggle);
            DOM.shareBtn.addEventListener('click', handleShare);
            DOM.printTriggerBtn.addEventListener('click', showPrintModal);
            
            // Modal Actions
            DOM.closeModalBtn.addEventListener('click', hidePrintModal);
            DOM.printModal.addEventListener('click', (e) => {
                if (e.target === DOM.printModal) hidePrintModal(); // Click outside to close
            });
            
            // Escape key support for accessibility
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && AppState.isModalOpen) hidePrintModal();
            });

            // Print Choice Actions (Delegation mapped via dataset)
            DOM.printChoices.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Prevent bubbling issues by getting closest button
                    const targetBtn = e.target.closest('.print-btn-choice');
                    const selectedLang = targetBtn.getAttribute('data-lang');
                    if (selectedLang) {
                        executePrintJob(selectedLang);
                    }
                });
            });

            // Passive scroll listener for performance
            window.addEventListener('scroll', handleScroll, { passive: true });
        }

        /**
         * Application Bootstrapper
         */
        function bootstrapApp() {
            initEventListeners();
            // Start the application in English by default
            renderArticle(AppState.currentLang);
        }

        // Initialize App once DOM is fully parsed
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootstrapApp);
        } else {
            bootstrapApp();
        }

    </script>
</body>
