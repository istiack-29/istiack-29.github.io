    <style>
        /* ==========================================================================
           1. FONTS & TYPOGRAPHY CONFIGURATION (STRICT CONTROL)
           ========================================================================== 
           These fonts are strictly loaded from the root directory as requested.
           Every single element is forced to inherit these based on the active language class.
        */
        
        @font-face {
            font-family: 'EnglishMain';
            src: url('/E1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'EnglishHeader';
            src: url('/E2.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaHeader';
            src: url('/B1.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaMain';
            src: url('/B2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* * Strict enforcement of typography rules. 
         * The `!important` tags guarantee that NO browser stylesheet or external 
         * interference can override the typography of this document.
         */
         
        /* ENGLISH TYPOGRAPHY */
        body.lang-en, body.lang-en *, body.lang-en button, body.lang-en input, body.lang-en textarea {
            font-family: 'EnglishMain', sans-serif !important;
        }
        body.lang-en h1, body.lang-en h2, body.lang-en h3, 
        body.lang-en h4, body.lang-en h5, body.lang-en h6,
        body.lang-en .site-title, body.lang-en .btn-text,
        body.lang-en strong, body.lang-en b, body.lang-en th {
            font-family: 'EnglishHeader', sans-serif !important;
        }

        /* BANGLA TYPOGRAPHY */
        body.lang-bn, body.lang-bn *, body.lang-bn button, body.lang-bn input, body.lang-bn textarea {
            font-family: 'BanglaMain', sans-serif !important;
        }
        body.lang-bn h1, body.lang-bn h2, body.lang-bn h3, 
        body.lang-bn h4, body.lang-bn h5, body.lang-bn h6,
        body.lang-bn .site-title, body.lang-bn .btn-text,
        body.lang-bn strong, body.lang-bn b, body.lang-bn th {
            font-family: 'BanglaHeader', sans-serif !important;
        }

        /* ==========================================================================
           2. CSS VARIABLES (DESIGN TOKENS)
           ========================================================================== 
           "Pure Article" Aesthetic - High contrast, minimalist, clean, grayscale dominance.
        */
        :root {
            /* Color Palette */
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --bg-tertiary: #f3f4f6;
            
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-tertiary: #6b7280;
            
            --border-light: #e5e7eb;
            --border-medium: #d1d5db;
            --border-dark: #9ca3af;
            
            --accent-black: #000000;
            --accent-white: #ffffff;
            
            --warning-red: #dc2626;
            --warning-bg: #fef2f2;
            
            --modal-overlay: rgba(0, 0, 0, 0.75);
            
            /* Typography Scales */
            --text-xs: 0.75rem;
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-lg: 1.125rem;
            --text-xl: 1.25rem;
            --text-2xl: 1.5rem;
            --text-3xl: 1.875rem;
            --text-4xl: 2.25rem;
            
            /* Layout & Spacing */
            --header-height: 72px;
            --content-max-width: 800px;
            
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-12: 3rem;
            --space-16: 4rem;
            
            /* Borders & Shadows */
            --radius-sm: 0.25rem;
            --radius-md: 0.375rem;
            --radius-lg: 0.5rem;
            --radius-full: 9999px;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            
            /* Animation */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           3. BASE RESET & GLOBAL STYLES (MOBILE-FIRST)
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            padding-top: var(--header-height);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Media constraints */
        img, video, canvas, svg {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Clean List Styles */
        ul, ol {
            padding-left: var(--space-6);
            margin-bottom: var(--space-6);
        }

        li {
            margin-bottom: var(--space-2);
        }

        /* Button Reset */
        button {
            background: none;
            border: none;
            cursor: pointer;
            color: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            appearance: none;
            -webkit-appearance: none;
        }

        button:focus-visible {
            outline: 2px solid var(--accent-black);
            outline-offset: 2px;
        }

        /* Default SVG Setup */
        svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Utilities */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        /* ==========================================================================
           4. LAYOUT COMPONENTS
           ========================================================================== */
        
        /* --------------------------------------------------------------------------
           4.1 Header (Fixed, Responsive, Minimalist)
           -------------------------------------------------------------------------- */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-light);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-4);
            box-shadow: var(--shadow-sm);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }

        .site-logo {
            height: 40px;
            width: auto;
            /* Logo strictly forced to Black and White as per requirements */
            filter: grayscale(100%) contrast(120%);
        }

        .site-title {
            font-size: var(--text-lg);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }

        /* Language Toggle Button */
        .lang-toggle-btn {
            border: 1px solid var(--border-medium);
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            gap: var(--space-2);
            background-color: var(--bg-primary);
        }

        .lang-toggle-btn:hover {
            background-color: var(--accent-black);
            color: var(--accent-white);
            border-color: var(--accent-black);
        }
        
        .lang-toggle-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Mobile Hamburger Menu Trigger */
        .mobile-menu-trigger {
            display: none;
            padding: var(--space-2);
            color: var(--text-primary);
        }

        /* --------------------------------------------------------------------------
           4.2 Main Content Wrapper
           -------------------------------------------------------------------------- */
        .main-content {
            flex-grow: 1;
            width: 100%;
            max-width: var(--content-max-width);
            margin: 0 auto;
            padding: var(--space-6) var(--space-4) var(--space-12);
        }

        /* --------------------------------------------------------------------------
           4.3 Hero Section & Actions
           -------------------------------------------------------------------------- */
        .hero-section {
            margin-bottom: var(--space-6);
            width: 100%;
        }

        .hero-image {
            width: 100%;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            background-color: var(--bg-tertiary);
            /* Ensure maintaining aspect ratio */
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .action-bar {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            margin-bottom: var(--space-8);
            padding-bottom: var(--space-4);
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            background-color: var(--bg-secondary);
            font-weight: 600;
        }

        .action-btn:hover {
            background-color: var(--border-medium);
            border-color: var(--border-dark);
        }
        
        .action-btn svg {
            width: 18px;
            height: 18px;
        }

        /* --------------------------------------------------------------------------
           4.4 Article Typography & Formatting
           -------------------------------------------------------------------------- */
        .article-body {
            position: relative;
        }

        .article-title {
            font-size: var(--text-3xl);
            line-height: 1.2;
            margin-bottom: var(--space-2);
            color: var(--text-primary);
        }

        .article-meta {
            color: var(--text-secondary);
            font-size: var(--text-sm);
            margin-bottom: var(--space-8);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .article-meta svg {
            width: 16px;
            height: 16px;
        }

        .article-body h2 {
            font-size: var(--text-2xl);
            margin-top: var(--space-12);
            margin-bottom: var(--space-4);
            border-bottom: 2px solid var(--accent-black);
            padding-bottom: var(--space-2);
            color: var(--text-primary);
            display: inline-block;
        }

        .article-body h3 {
            font-size: var(--text-xl);
            margin-top: var(--space-8);
            margin-bottom: var(--space-3);
            color: var(--text-primary);
        }

        .article-body p {
            margin-bottom: var(--space-6);
            font-size: var(--text-base);
            text-align: justify;
            color: var(--text-secondary);
        }

        .article-body strong, .article-body b {
            color: var(--text-primary);
        }

        /* Links formatted strictly as plain text, wrapping correctly */
        .link-text {
            color: var(--text-tertiary);
            word-break: break-all;
            background-color: var(--bg-secondary);
            padding: 0 var(--space-1);
            border-radius: var(--radius-sm);
            font-family: 'EnglishMain', monospace !important; /* Forces monospace for URL parts if needed, overridden by global strictness though */
            font-size: 0.9em;
        }

        /* Inline Images (No captions as per strict requirements) */
        .article-image {
            width: 100%;
            margin: var(--space-8) 0;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }

        /* Divider */
        .divider {
            height: 1px;
            background-color: var(--border-light);
            margin: var(--space-12) 0;
            width: 100%;
        }

        /* References / Source Lists */
        .references-list {
            list-style: none;
            padding-left: 0;
            font-size: var(--text-sm);
            color: var(--text-tertiary);
        }
        
        .references-list li {
            margin-bottom: var(--space-3);
            word-break: break-all;
            position: relative;
            padding-left: var(--space-4);
        }
        
        .references-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--border-dark);
        }

        /* --------------------------------------------------------------------------
           4.5 Custom Video Warning Component
           -------------------------------------------------------------------------- */
        .video-container {
            margin: var(--space-8) 0;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            overflow: hidden;
            background-color: var(--bg-secondary);
        }

        .content-warning {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-8) var(--space-4);
            text-align: center;
            background-color: var(--warning-bg);
            border: 1px solid rgba(220, 38, 38, 0.2);
        }

        .warning-icon {
            color: var(--warning-red);
            width: 48px;
            height: 48px;
            margin-bottom: var(--space-4);
        }

        .warning-text {
            color: var(--warning-red);
            font-size: var(--text-lg);
            margin-bottom: var(--space-2);
        }
        
        .warning-subtext {
            color: var(--text-secondary);
            font-size: var(--text-sm);
            margin-bottom: var(--space-6);
        }

        .reveal-btn {
            background-color: var(--warning-red);
            color: var(--accent-white);
            padding: var(--space-2) var(--space-6);
            border-radius: var(--radius-full);
            font-size: var(--text-sm);
            font-weight: bold;
            box-shadow: var(--shadow-sm);
        }

        .reveal-btn:hover {
            background-color: #b91c1c; /* Darker red */
        }

        .hidden-video {
            display: none;
            width: 100%;
            background-color: var(--accent-black);
        }

        .hidden-video.revealed {
            display: block;
        }

        .content-warning.hidden {
            display: none;
        }

        /* ==========================================================================
           5. MODALS, TOASTS & OVERLAYS
           ========================================================================== */
        
        /* Modal Backdrop */
        .modal-overlay {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-color: var(--modal-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-normal), visibility var(--transition-normal);
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Modal Box */
        .modal-content {
            background-color: var(--bg-primary);
            padding: var(--space-8);
            border-radius: var(--radius-lg);
            max-width: 400px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            position: relative;
            transform: scale(0.95) translateY(20px);
            transition: transform var(--transition-normal);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        /* Close Button */
        .modal-close {
            position: absolute;
            top: var(--space-4);
            right: var(--space-4);
            padding: var(--space-1);
            color: var(--text-tertiary);
            border-radius: var(--radius-sm);
        }

        .modal-close:hover {
            color: var(--text-primary);
            background-color: var(--bg-secondary);
        }

        .modal-title {
            margin-bottom: var(--space-6);
            text-align: center;
            font-size: var(--text-xl);
            color: var(--text-primary);
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .modal-btn {
            padding: var(--space-3) var(--space-4);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            font-size: var(--text-base);
            text-align: center;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-weight: 600;
        }

        .modal-btn:hover {
            background-color: var(--accent-black);
            color: var(--accent-white);
            border-color: var(--accent-black);
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            bottom: var(--space-8);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--accent-black);
            color: var(--accent-white);
            padding: var(--space-3) var(--space-6);
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-lg);
            z-index: 3000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--text-sm);
        }

        .toast-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ==========================================================================
           6. RESPONSIVE MEDIA QUERIES (MOBILE-FIRST UPWARDS)
           ========================================================================== */
        
        /* Tablet & Up */
        @media (min-width: 640px) {
            .article-title { font-size: var(--text-4xl); }
            .article-body p { font-size: 1.125rem; }
            .action-bar { gap: var(--space-6); }
        }

        /* Small Mobile Adjustments */
        @media (max-width: 480px) {
            :root {
                --header-height: 60px;
            }
            .site-logo { height: 32px; }
            .site-title { font-size: var(--text-base); }
            
            /* Hide the long text in toggle, just show icon/short version */
            .header-right .btn-text-long { display: none; }
            .lang-toggle-btn { padding: var(--space-2); }
            
            .article-title { font-size: var(--text-2xl); }
        }

        /* Very Small Screens */
        @media (max-width: 360px) {
            .site-title { display: none; /* Make room for toggle on tiny screens */ }
        }

        /* ==========================================================================
           7. ADVANCED PRINT STYLES (STRICT BLACK & WHITE, NO UI)
           ========================================================================== 
           This block strictly forces a pure document aesthetic for printers.
        */
        @media print {
            /* Reset root colors for pure B&W */
            :root {
                --bg-primary: #fff;
                --text-primary: #000;
                --text-secondary: #333;
                --border-light: #000;
                --border-medium: #000;
                --accent-black: #000;
            }

            /* Absolute reset of body margins */
            html, body {
                background: #fff !important;
                color: #000 !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                height: auto !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Hide ALL UI elements unequivocally */
            .site-header, 
            .action-bar, 
            .modal-overlay, 
            .toast-container,
            .print-hidden,
            .video-container {
                display: none !important;
            }

            /* Main Layout Adjustments for Paper */
            .main-content {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* Typography adjustments specifically for printed paper readability */
            .article-title {
                font-size: 26pt !important;
                margin-top: 0 !important;
                page-break-after: avoid;
                color: #000 !important;
            }
            
            .article-meta {
                font-size: 11pt !important;
                color: #444 !important;
                margin-bottom: 24pt !important;
                page-break-after: avoid;
                border-bottom: 1px solid #000;
                padding-bottom: 5pt;
            }

            .article-body h2 {
                font-size: 18pt !important;
                border-bottom: 1.5pt solid #000 !important;
                page-break-after: avoid;
                page-break-before: auto;
                margin-top: 24pt !important;
            }

            .article-body h3 {
                font-size: 14pt !important;
                page-break-after: avoid;
                margin-top: 18pt !important;
            }

            .article-body p {
                font-size: 12pt !important;
                line-height: 1.6 !important;
                orphans: 3;
                widows: 3;
                color: #000 !important;
                text-align: left !important; /* Better for print than justify */
            }

            /* Image handling in Print - Ensures they fit and don't break pages badly */
            img {
                max-width: 100% !important;
                max-height: 400px !important; /* Prevent massive images dominating pages */
                object-fit: contain !important;
                page-break-inside: avoid;
                margin: 15pt 0 !important;
                border: 1px solid #ccc !important;
            }

            /* Dual Print Container Logic */
            #print-container {
                display: block !important;
                width: 100% !important;
            }

            .print-section-divider {
                page-break-before: always;
                border: none !important;
                height: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* Links are rendered as text in JS, but ensure a tags just in case */
            a {
                text-decoration: none !important;
                color: #000 !important;
            }
            
            /* Remove dividers that look bad on print */
            .divider {
                border-top: 1px solid #000 !important;
                height: 0 !important;
                margin: 20pt 0 !important;
                background: transparent !important;
            }
        }

        /* Generic Utility classes */
        .hidden-utility {
            display: none !important;
        }
    </style>
</head>

<!-- Body dynamically receives .lang-en or .lang-bn -->
<body class="lang-en">

    <!-- ==========================================================================
         HEADER (FIXED TOP NAVIGATION)
         ========================================================================== -->

                                "অসঙ্গতি: স্বাধীন পর্যবেক্ষক এবং মানবাধিকার গোষ্ঠীগুলো এই পরিসংখ্যানকে চ্যালেঞ্জ করে, নিহতের সংখ্যা উল্লেখযোগ্যভাবে বেশি বলে ইঙ্গিত দেয়।",
                                "সূত্র: https://today.thefinancialexpress.com.bd/first-page/mourning-day-today-1722274194",
                                "সূত্র: https://newsonair.gov.in/bangladesh-to-observe-countrywide-mourning-tuesday-over-quota-protest-deaths/ [৬, ১১, ১৪, ১৫, ১৬]"
                            ]
                        }
                    ],
                    visualContext: {
                        title: "প্রস্তাবিত ভিজ্যুয়াল প্রেক্ষাপট ও মিডিয়া রেফারেন্স",
                        desc: "৩০ জুলাই, ২০২৪-এর মূল চিত্রগুলোতে ব্যাপক ডিজিটাল এবং শারীরিক প্রতিরোধের দৃশ্য অন্তর্ভুক্ত রয়েছে:",
                        points: [
                            "লাল ফেসবুক ফিড গ্রিড: ব্যাপক সামাজিক মিডিয়া সংহতির ভিজ্যুয়াল।",
                            "পুলিশ কর্তৃক ভাইরাল আন্দোলনকারীদের হত্যার দৃশ্য (ভিডিও আর্কাইভ নিচে দেওয়া হলো)।"
                        ],
                        videoMedia: {
                            src: "./v.mp4"
                        },
                        closingQ: "আপনি কি ৩১ জুলাই, ২০২৪-এর নাটকীয় বিবরণ পর্যালোচনা করতে চান, যখন \"মার্চ ফর জাস্টিস\" কার্যকরভাবে আদালত প্রাঙ্গণগুলোকে বিশাল প্রতিবাদের যুদ্ধক্ষেত্রে পরিণত করেছিল? [৪, ৭]"
                    },
                    references: [
                        "[১] https://thediplomat.com/2024/07/a-majority-of-bangladeshi-netizens-shows-red-card-to-governments-mourning-decision/",
                        "[২] https://www.thedailystar.net/the-july-rocked-bangladesh",
                        "[৩] https://www.bbc.com/bengali/extra/aimee860o7/36-days-of-july-revolution-in-bangladesh",
                        "[৪] https://en.wikipedia.org/wiki/2024_Bangladesh_quota_reform_movement",
                        "[৫] https://www.bssnews.net/news-flash/201716",
                        "[৬] https://en.somoynews.tv/news/2024-07-30/MQuYFMQL",
                        "[৭] https://banglainstitute.com/2024/08/18/2024-bangladesh-non-cooperation-movement/",
                        "[৮] https://www.thedailystar.net/entertainment/tv-film/news/entertainment-world-adorned-red-against-injustice-3666166",
                        "[৯] https://en.wikipedia.org/wiki/2024_Bangladesh_quota_reform_movement",
                        "[১০] https://www.alamy.com/... (ইমেজ আইডি: 615280393)",

                        "[১২] https://www.asiapacific.ca/publication/explainer-whats-behind-bangladeshs-deadly-protests",
                        "[১৩] https://journals.sagepub.com/doi/10.1177/13582291261424344",
                        "[১৪] https://today.thefinancialexpress.com.bd/first-page/mourning-day-today-1722274194",
                        "[১৫] https://newsonair.gov.in/bangladesh-to-observe-countrywide-mourning-tuesday-over-quota-protest-deaths/",
                        "[১৬] https://reliefweb.int/report/bangladesh/what-happening-quota-reform-protests-bangladesh"
                    ]
                }
            }
        };

        /**
         * ==========================================
         * 2. STATE MANAGEMENT & DOM SELECTION
         * ==========================================
         */
        let currentLang = 'en'; 
        const bodyEl = document.body;
        const canonicalURL = "https://istiack.ami.bd/july-corner/30-july/"; // Hardcoded constraint
        
        // UI Nodes
        const nodes = {
            newspaperName: document.getElementById('ui-newspaper-name'),
            langText: document.getElementById('ui-lang-text'),
            shareText: document.getElementById('ui-share-text'),
            printText: document.getElementById('ui-print-text'),
            modalTitle: document.getElementById('ui-modal-title'),
            articleContainer: document.getElementById('article-content'),
            toast: document.getElementById('toast'),
            toastMsg: document.getElementById('toast-message'),
            printModal: document.getElementById('printModal'),
            printContainer: document.getElementById('print-container'),
            mainContent: document.getElementById('standard-view')
        };

        /**
         * ==========================================
         * 3. RENDER ENGINE & DATA PARSING
         * ==========================================
         */

        /**
         * Parses raw text strings to format URLs explicitly as text.
         * Ensures no actual `<a>` tags are generated as per strict requirement.
         * @param {string} text - Raw text containing markdown-like URLs.
         * @returns {string} - Formatted HTML string with URLs as span text.
         */
        function parseUrlsToPlainText(text) {
            // Find http/https links and wrap them in a styled span, never an anchor tag.
            // Also handles Markdown syntax [Text](Url) -> Text (Url)
            let parsed = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '$1 (<span class="link-text">$2</span>)');
            // Catch raw loose URLs not in markdown format
            parsed = parsed.replace(/(?<!\()https?:\/\/[^\s<]+(?!\))/g, match => {
                return `<span class="link-text">${match}</span>`;
            });
            return parsed;
        }

        /**
         * Generates the entire Article HTML structure dynamically based on JSON state.
         * Includes bespoke handling for print-hidden videos and images without captions.
         * @param {Object} dataObj - The article node from the language JSON.
         * @param {Object} uiData - The ui node from the language JSON (for warnings).
         * @returns {string} - Complete HTML string for insertion.
         */
        function buildArticleHTML(dataObj, uiData) {
            let html = `
                <h1 class="article-title">${dataObj.title}</h1>
                <div class="article-meta">
                    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>${dataObj.meta}</span>
                </div>
                <p><strong>${dataObj.intro}</strong></p>
                <div class="divider"></div>
            `;

            // Process main sections
            dataObj.sections.forEach(sec => {
                html += `<h2>${sec.title}</h2>`;
                
                sec.paragraphs.forEach(p => {
                    html += `<p>${parseUrlsToPlainText(p)}</p>`;
                });

                // Strict handling: image injection without any caption wrapper
                if (sec.media && sec.media.type === 'image') {
                    html += `<img src="${sec.media.src}" alt="" class="article-image">`;
                }
            });

            html += `<div class="divider"></div>`;
            
            // Process Context & Visual section
            html += `<h3>${dataObj.visualContext.title}</h3>`;
            html += `<p>${dataObj.visualContext.desc}</p>`;
            html += `<ul>`;
            dataObj.visualContext.points.forEach(pt => {
                html += `<li>${parseUrlsToPlainText(pt)}</li>`;
            });
            html += `</ul>`;

            // Specific Video Warning Component (Print Hidden)
            if (dataObj.visualContext.videoMedia) {
                html += `
                <div class="video-container print-hidden">
                    <div class="content-warning js-warning-box">
                        <svg class="warning-icon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                        <h4 class="warning-text">${uiData.warningTitle}</h4>
                        <p class="warning-subtext">${uiData.warningSub}</p>
                        <button class="reveal-btn js-reveal-btn">${uiData.showVideoBtn}</button>
                    </div>
                    <video class="hidden-video js-hidden-video" controls preload="none">
                        <source src="${dataObj.visualContext.videoMedia.src}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                `;
            }

            if(dataObj.visualContext.closingQ) {
                html += `<p><strong>${dataObj.visualContext.closingQ}</strong></p>`;
            }

            html += `<div class="divider"></div>`;
            
            // Process References List
            html += `<ul class="references-list">`;
            dataObj.references.forEach(ref => {
                // Ensure references are sanitized as plain text
                const safeRef = ref.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                html += `<li>${parseUrlsToPlainText(safeRef)}</li>`;
            });
            html += `</ul>`;

            return html;
        }

        /**
         * Main execution function to update the DOM based on active language.
         */
        function renderView() {
            const data = contentData[currentLang];
            
            // 1. Strict Font Control: Swap body class to immediately enforce global @font-face change
            bodyEl.className = currentLang === 'en' ? 'lang-en' : 'lang-bn';

            // 2. Update Static UI Texts
            nodes.newspaperName.textContent = data.ui.newspaperName;
            nodes.langText.textContent = data.ui.langToggleText;
            nodes.shareText.textContent = data.ui.shareText;
            nodes.printText.textContent = data.ui.printText;
            nodes.modalTitle.textContent = data.ui.modalTitle;

            // 3. Render HTML Content
            nodes.articleContainer.innerHTML = buildArticleHTML(data.article, data.ui);

            // 4. Re-attach dynamic event listeners (like the video reveal button)
            attachDynamicListeners();
        }

        /**
         * Attaches event listeners to elements generated dynamically inside the article.
         */
        function attachDynamicListeners() {
            const warningBox = document.querySelector('.js-warning-box');
            const revealBtn = document.querySelector('.js-reveal-btn');
            const hiddenVideo = document.querySelector('.js-hidden-video');

            if (revealBtn && warningBox && hiddenVideo) {
                revealBtn.addEventListener('click', () => {
                    warningBox.classList.add('hidden');
                    hiddenVideo.classList.add('revealed');
                    hiddenVideo.play().catch(e => console.log("Autoplay prevented:", e));
                });
            }
        }

        // Boot the application on load
        renderView();

        /**
         * ==========================================
         * 4. INTERACTION & EVENT LISTENERS
         * ==========================================
         */

        // --- 4.1 Language Toggle ---
        document.getElementById('langToggleBtn').addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'bn' : 'en';
            renderView();
        });

        // --- 4.2 Toast Notification Logic ---
        function triggerToast(message) {
            nodes.toastMsg.textContent = message;
            nodes.toast.classList.add('show');
            setTimeout(() => {
                nodes.toast.classList.remove('show');
            }, 3500);
        }

        // --- 4.3 Share Functionality & Clipboard Restriction ---
        
        // Trigger manual share copy
        document.getElementById('shareBtn').addEventListener('click', () => {
            const successMsg = contentData[currentLang].ui.toastCopied;
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(canonicalURL).then(() => {
                    triggerToast(successMsg);
                });
            } else {
                // Legacy fallback for non-HTTPS or older browsers
                const tempInput = document.createElement("textarea");
                tempInput.value = canonicalURL;
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand("copy");
                    triggerToast(successMsg);
                } catch (err) {
                    console.error("Fallback copy failed");
                }
                document.body.removeChild(tempInput);
            }
        });

        // STRICT MANDATE: Intercept global copy events.
        // User MUST only copy the exact canonical URL, regardless of what they highlight.
        document.addEventListener('copy', (e) => {
            e.preventDefault(); // Stop standard copy
            
            if (e.clipboardData) {
                e.clipboardData.setData('text/plain', canonicalURL);
            } else if (window.clipboardData) {
                window.clipboardData.setData('Text', canonicalURL);
            }
            
            triggerToast(contentData[currentLang].ui.toastCopied);
        });

        // --- 4.4 Advanced Print Logic (Bilingual Support) ---
        
        // Open Modal
        document.getElementById('printTriggerBtn').addEventListener('click', () => {
            nodes.printModal.classList.add('active');
        });

        // Close Modal
        document.getElementById('closePrintModalBtn').addEventListener('click', () => {
            nodes.printModal.classList.remove('active');
        });

        // Handle Print Selection
        document.querySelectorAll('.modal-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const mode = e.target.getAttribute('data-print-lang');
                nodes.printModal.classList.remove('active');
                processPrintRequest(mode);
            });
        });

        /**
         * Processes the complex logic for printing in one or both languages.
         * For 'both', it builds a temporary invisible DOM, triggers print, then restores.
         * @param {string} mode - 'en', 'bn', or 'both'
         */
        function processPrintRequest(mode) {
            const originalLang = currentLang;

            if (mode === 'en' || mode === 'bn') {
                // Single language print setup
                currentLang = mode;
                renderView();
                
                // Timeout allows browser paint to finish before thread lock
                setTimeout(() => {
                    window.print();
                    // Restore state immediately after print dialog closes
                    currentLang = originalLang;
                    renderView();
                }, 200);
            } 
            else if (mode === 'both') {
                // Dual language print setup
                
                // 1. Hide Standard View
                nodes.mainContent.classList.add('hidden-utility');
                
                // 2. Build Dual View Structure strictly binding fonts inline to bypass body class
                let dualHTML = `
                    <div class="print-block lang-en" style="font-family: 'EnglishMain', sans-serif;">
                        ${buildArticleHTML(contentData.en.article, contentData.en.ui)}
                    </div>
                `;
                
                // Page Break between languages
                dualHTML += `<hr class="print-section-divider">`;
                
                dualHTML += `
                    <div class="print-block lang-bn" style="font-family: 'BanglaMain', sans-serif;">
                        ${buildArticleHTML(contentData.bn.article, contentData.bn.ui)}
                    </div>
                `;

                nodes.printContainer.innerHTML = dualHTML;
                nodes.printContainer.classList.remove('hidden-utility');

                // 3. Trigger Print
                setTimeout(() => {
                    window.print();
                    
                    // 4. Cleanup and Restore View
                    nodes.printContainer.innerHTML = '';
                    nodes.printContainer.classList.add('hidden-utility');
                    nodes.mainContent.classList.remove('hidden-utility');
                }, 200);
            }
        }
    </script>
