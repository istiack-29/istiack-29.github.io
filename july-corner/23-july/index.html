<html lang="en" id="html-root" class="lang-en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

    <meta name="description" content="Detailed breakdown of the events, administrative crackdowns, human tolls, and strategic maneuvers that occurred on July 23, 2024.">

    <meta property="og:image" content="./t.png">
    <meta property="og:url" content="https://istiack.ami.bd/july-corner/23-july/">
    <meta property="og:type" content="article">

    <style>
        /* ==========================================================================
           1. STRICT FONT FACE DEFINITIONS (ROOT DIRECTORY AS REQUESTED)
           ========================================================================== */
        @font-face {
            font-family: 'EnMain';
            src: url('/E1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'EnHead';
            src: url('/E2.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'BnHead';
            src: url('/B1.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'BnMain';
            src: url('/B2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ==========================================================================
           2. CSS VARIABLES (DESIGN TOKENS)
           ========================================================================== */
        :root {
            /* Minimalist Color Palette */
            --bg-color: #ffffff;
            --text-primary: #111111;
            --text-secondary: #333333;
            --border-color: #dddddd;
            --accent-color: #000000;
            --btn-hover: #f5f5f5;
            --white: #ffffff;
            --overlay-bg: rgba(0, 0, 0, 0.75);
            --link-box-bg: #f0f0f0;

            /* Spacing Scale */
            --space-xs: 0.5rem;
            --space-sm: 1rem;
            --space-md: 1.5rem;
            --space-lg: 2.5rem;
            --space-xl: 4rem;

            /* Layout constraints */
            --max-width: 760px; /* Optimal reading width */
            --header-height: 70px;
            
            /* Typography Scaling */
            --text-base: 1.125rem; /* 18px for great readability */
            --line-height-base: 1.75;
        }

        /* ==========================================================================
           3. RESET & STRICT GLOBAL TYPOGRAPHY ENFORCEMENT
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* CRITICAL: Enforce font inheritance to ensure EVERY letter is controlled */
            font-family: inherit;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-size: var(--text-base);
            line-height: var(--line-height-base);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            padding-top: var(--header-height);
        }

        /* ==========================================================================
           4. BILINGUAL FONT CONTROLLERS
           These classes are applied to the <html> tag. They cascade down and 
           overpower every element to ensure strict adherence to the loaded fonts.
           ========================================================================== */
        
        /* ENGLISH STATE */
        .lang-en, .lang-en * {
            font-family: 'EnMain', sans-serif !important;
        }
        .lang-en h1, .lang-en h2, .lang-en h3, .lang-en h4, .lang-en h5, .lang-en h6, 
        .lang-en .title-font, .lang-en .newspaper-name, .lang-en strong {
            font-family: 'EnHead', serif !important;
        }

        /* BANGLA STATE */
        .lang-bn, .lang-bn * {
            font-family: 'BnMain', sans-serif !important;
        }
        .lang-bn h1, .lang-bn h2, .lang-bn h3, .lang-bn h4, .lang-bn h5, .lang-bn h6, 
        .lang-bn .title-font, .lang-bn .newspaper-name, .lang-bn strong {
            font-family: 'BnHead', serif !important;
        }

        /* Base element styling */
        ul, ol {
            padding-left: var(--space-lg);
            margin-bottom: var(--space-md);
        }

        li {
            margin-bottom: var(--space-xs);
            text-align: justify;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 2px;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: var(--space-lg) 0;
        }

        /* Enforce inline SVGs over Emojis */
        svg {
            fill: currentColor;
            width: 22px;
            height: 22px;
            display: inline-block;
        }

        /* ==========================================================================
           5. LAYOUT: FIXED HEADER
           ========================================================================== */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background-color: var(--white);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-sm);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        /* Logo set to grayscale as requested */
        .site-logo {
            height: 38px;
            width: auto;
            filter: grayscale(100%);
        }

        .newspaper-name {
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        /* Lang Toggle Styling */
        .lang-toggle-btn {
            padding: 8px 16px;
            border: 2px solid var(--text-primary);
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: bold;
            background-color: var(--white);
            color: var(--text-primary);
        }
        
        .lang-toggle-btn:hover {
            background-color: var(--text-primary);
            color: var(--white);
        }

        .mobile-menu-toggle {
            display: none;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        /* Mobile Overlay Menu */
        .mobile-nav-overlay {
            position: fixed;
            top: var(--header-height);
            left: 0;
            width: 100%;
            height: calc(100vh - var(--header-height));
            background-color: var(--white);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: var(--space-xl);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mobile-nav-overlay.active {
            transform: translateX(0);
        }

        /* ==========================================================================
           6. LAYOUT: MAIN ARTICLE CONTENT
           ========================================================================== */
        .main-container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--space-md) var(--space-sm) var(--space-xl) var(--space-sm);
        }

        /* Hero Image Container (Strictly ./t.png) */
        .hero-image-container {
            margin-bottom: var(--space-md);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .hero-image-container img {
            width: 100%;
            object-fit: cover;
            /* Explicitly no captions as requested */
        }

        /* Action Bar for Share and Print */
        .action-bar {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: var(--space-lg);
            padding: var(--space-sm) 0;
            border-bottom: 2px solid var(--text-primary);
            margin-bottom: var(--space-lg);
        }

        .action-btn {
            font-size: 1rem;
            color: var(--text-primary);
            font-weight: bold;
            padding: 8px 12px;
            border: 1px solid transparent;
            border-radius: 4px;
        }

        .action-btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--border-color);
        }

        /* Body Typography */
        .article-body h1 {
            font-size: 2.4rem;
            line-height: 1.25;
            margin-bottom: var(--space-md);
            color: var(--text-primary);
        }

        .article-body h2 {
            font-size: 1.6rem;
            margin-top: var(--space-xl);
            margin-bottom: var(--space-sm);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .article-body p {
            margin-bottom: var(--space-md);
            text-align: justify;
        }

        /* Secondary Article Images (like the patrol image) */
        .article-image {
            margin: var(--space-lg) 0;
            border: 1px solid var(--border-color);
        }

        /* Plain Text Links Strategy (No Hyperlinks) */
        .plain-link {
            color: var(--text-secondary);
            font-weight: normal;
            word-break: break-all;
            background-color: var(--link-box-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            display: inline-block;
            margin: 0 4px;
            border: 1px dashed #aaa;
        }

        /* Video / Iframe Containers */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            margin: var(--space-lg) 0;
            border-radius: 4px;
            background-color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* ==========================================================================
           7. MODALS & NOTIFICATIONS
           ========================================================================== */
        
        /* Share Toast Notification */
        .toast {
            position: fixed;
            bottom: var(--space-lg);
            left: 50%;
            transform: translateX(-50%) translateY(150px);
            background-color: var(--text-primary);
            color: var(--white);
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Print Options Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: var(--white);
            padding: var(--space-xl);
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 1.4rem;
            margin-bottom: var(--space-md);
            border-bottom: 2px solid var(--text-primary);
            padding-bottom: var(--space-xs);
            display: inline-block;
        }

        .modal-options {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            margin-top: var(--space-sm);
        }

        .modal-btn {
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            font-size: 1.1rem;
            background-color: var(--white);
            color: var(--text-primary);
        }

        .modal-btn:hover {
            border-color: var(--text-primary);
            background-color: var(--text-primary);
            color: var(--white);
        }

        .modal-cancel {
            margin-top: var(--space-md);
            color: #d32f2f;
            font-size: 1rem;
            font-weight: bold;
            padding: 8px;
        }

        /* Print Staging Area - Exists purely in DOM for dual language print generation */
        #print-staging-area {
            display: none;
        }

        /* ==========================================================================
           8. RESPONSIVE DESIGN (MEDIA QUERIES)
           ========================================================================== */
        @media (max-width: 768px) {
            .header-right .lang-toggle-btn {
                display: none; /* Hide desktop toggle */
            }
            .mobile-menu-toggle {
                display: flex; /* Show mobile hamburger */
            }
            .newspaper-name {
                font-size: 1rem;
            }
            .article-body h1 {
                font-size: 1.9rem;
            }
            .action-bar {
                justify-content: space-between;
                gap: 0;
            }
            .action-btn {
                font-size: 0.9rem;
                padding: 8px;
            }
            :root {
                --space-lg: 1.5rem;
                --space-xl: 2rem;
            }
        }

        @media (min-width: 769px) {
            .site-header {
                padding: 0 var(--space-lg);
            }
            .newspaper-name {
                font-size: 1.3rem;
            }
            .modal-btn {
                font-size: 1.2rem;
            }
        }

        /* ==========================================================================
           9. ADVANCED PRINT MEDIA CSS
           ========================================================================== */
        @media print {
            /* 1. Global Reset for Printer */
            body {
                background: #ffffff !important;
                color: #000000 !important;
                padding-top: 0 !important;
                margin: 0 !important;
            }

            /* 2. Hide all interactive and unnecessary UI elements */
            .site-header, 
            .action-bar, 
            .mobile-nav-overlay, 
            .toast, 
            .modal-overlay,
            .video-container {
                display: none !important; /* Videos removed from print as requested */
            }

            /* 3. Re-format Layout */
            .main-container {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* 4. Optimize Images for Paper (Grayscale & Sizing) */
            img {
                filter: grayscale(100%) !important;
                max-height: 400px !important;
                object-fit: contain !important;
                page-break-inside: avoid;
                margin: 0 auto 1cm auto !important;
            }

            /* 5. Force all structural styles to be pure black/white */
            * {
                color: #000000 !important;
                background: transparent !important;
                box-shadow: none !important;
                text-shadow: none !important;
                border-color: #000000 !important;
            }

            /* 6. ENFORCE STRICT FONT USAGE ON PAPER */
            .lang-en, .lang-en * { font-family: 'EnMain', sans-serif !important; }
            .lang-en h1, .lang-en h2, .lang-en h3, .lang-en .title-font, .lang-en strong { font-family: 'EnHead', serif !important; }
            
            .lang-bn, .lang-bn * { font-family: 'BnMain', sans-serif !important; }
            .lang-bn h1, .lang-bn h2, .lang-bn h3, .lang-bn .title-font, .lang-bn strong { font-family: 'BnHead', serif !important; }

            /* 7. Pagination and Orphans/Widows */
            h1, h2, h3 {
                page-break-after: avoid;
            }
            
            p, h2, h3, li {
                orphans: 3;
                widows: 3;
            }

            ul, ol, p {
                page-break-inside: avoid;
            }

            /* 8. Format Links explicitly for reading on paper */
            .plain-link {
                border: 1px solid #666 !important;
                padding: 2px 4px !important;
                font-family: monospace !important;
                font-size: 0.85em !important;
            }

            @page {
                margin: 2cm;
                size: A4 portrait;
            }

            /* 9. Dual Language Print Logic Support */
            body.printing-dual #default-view {
                display: none !important;
            }
            body.printing-dual #print-staging-area {
                display: block !important;
            }
            .page-break {
                page-break-before: always;
                clear: both;
            }
        }
    </style>
</head>

    <!-- =======================================================================
         MAIN ARTICLE CONTAINER
         ======================================================================= -->
    <main class="main-container" id="default-view">
        
        <!-- Hero Image (Strictly ./t.png) -->
        <div class="hero-image-container">
            <img src="./t.png" alt="July 23 Uprising Graphic">

         INTERACTIVE UI OVERLAYS (Modals / Toasts)

    <!-- Print Options Modal -->
    <div class="modal-overlay" id="print-modal">

    <!-- =======================================================================
         APPLICATION LOGIC (VANILLA JAVASCRIPT)
         ======================================================================= -->
    <script>
        /**
         * ---------------------------------------------------------------------
         * 1. CORE DATA STORE (BILINGUAL JSON)
         * All text content is managed centrally here. This satisfies the requirement
         * for a JSON-like object within the JS for easy text updates. 
         * ---------------------------------------------------------------------
         */
        const articleData = {
            config: {
                // Strict rule: user can only copy this exact URL structure.
                shareUrl: "https://istiack.ami.bd/july-corner/23-july/"
            },
            en: {
                ui: {
                    newspaperName: "ISTIACK'S JULY CORNER",
                    langToggleText: "বাংলায় পড়ুন (Read in Bangla)", // English UI prompts switch to Bangla
                    shareText: "Share Link",
                    printText: "Download / Print",
                    modalTitle: "Select Print Format",
                    printEn: "English Only",
                    printBn: "Bangla Only",
                    printBoth: "Both Languages",
                    cancel: "Cancel",
                    toastMsg: "Canonical Link Copied!"

                        "গার্মেন্টস শিল্পে আতঙ্ক: প্রধান রপ্তানি সংস্থাগুলোর নেতারা প্রধানমন্ত্রী শেখ হাসিনার সাথে দেখা করেন এবং সমুদ্রবন্দরের জন্য নির্ধারিত আটকে পড়া রপ্তানি চালানগুলো সুরক্ষিত করতে ঢাকা-চট্টগ্রাম মহাসড়কে জরুরি ভিত্তিতে নিরাপদ পরিবহন ব্যবস্থা চালুর অনুরোধ করেন। [৭]"
                    ]},
                    { type: "divider" },
                    { type: "heading", text: "কারফিউ এবং ব্ল্যাকআউট ভিডিও রিপোর্ট" },
                    { type: "paragraph", text: "কঠোর সামরিক রাস্তা অবরোধ, জনশূন্য বাজার এবং এই তারিখের নিরাপত্তা পদক্ষেপের বিষয়ে আন্তর্জাতিক উদ্বেগ তুলে ধরে একটি ভিজ্যুয়াল সম্প্রচার।" },
                    { type: "video", src: "https://www.youtube.com/embed/zL-p_UGu1Zw" },
                    { type: "divider" },
                    { type: "heading", text: "টেক্সট ভিত্তিক তথ্যসূত্র" },
                    { type: "paragraph", text: "এই দিনের ঘটনাগুলোর সত্যতা যাচাই করতে বা আরও বিস্তারিত পড়তে, আপনি আপনার ব্রাউজারের সার্চ বারে নিচের লিংকগুলো হুবহু কপি-পেস্ট করতে পারেন:" },
                    { type: "list", items: [
                        "দ্য ডেইলি স্টার: [Link: https://www.thedailystar.net/july-rocked-bangladesh/news/july-23-2024-mass-arrests-and-crackdown-continue-3945611]",
                        "প্রথম আলো ইংরেজি: [Link: https://en.prothomalo.com/bangladesh/5jvl0xye5l]",
                        "আল জাজিরা ইংরেজি: [Link: https://www.aljazeera.com/news/2024/7/23/bangladesh-curfews-internet-blackout-batter-economy-amid-quota-protests]",
                        "অ্যামনেস্টি ইন্টারন্যাশনাল: [Link: https://www.amnesty.org/en/latest/news/2024/07/what-is-happening-at-the-quota-reform-protests-in-bangladesh/]"
                    ]}
                ]
            }
        };

        /**
         * ---------------------------------------------------------------------
         * 2. STATE AND PARSER LOGIC
         * ---------------------------------------------------------------------
         */
        let currentLang = 'en';

        // STRICT LINK PARSER: Converts raw URLs into plain, un-clickable text spans
        function formatTextWithLinks(text) {
            // Target pattern: [Link: https://...] and convert to plain span
            const linkRegex = /\[Link:\s*(https?:\/\/[^\]]+)\]/g;
            return text.replace(linkRegex, '<span class="plain-link">$1</span>');
        }

        // HTML Generator based on JSON array
        function renderArticleHTML(articleBlocks) {
            let htmlOutput = '';
            
            articleBlocks.forEach(block => {
                switch(block.type) {
                    case 'title':
                        htmlOutput += `<h1 class="title-font">${formatTextWithLinks(block.text)}</h1>`;
                        break;
                    case 'heading':
                        htmlOutput += `<h2 class="title-font">${formatTextWithLinks(block.text)}</h2>`;
                        break;
                    case 'paragraph':
                        htmlOutput += `<p>${formatTextWithLinks(block.text)}</p>`;
                        break;
                    case 'image':
                        // Specifically leaving out captions as requested
                        htmlOutput += `<img src="${block.src}" alt="Article supplementary visual" class="article-image">`;
                        break;
                    case 'list':
                        htmlOutput += `<ul>`;
                        block.items.forEach(item => {
                            htmlOutput += `<li>${formatTextWithLinks(item)}</li>`;
                        });
                        htmlOutput += `</ul>`;
                        break;
                    case 'video':
                        htmlOutput += `
                        <div class="video-container">
                            <iframe src="${block.src}" title="Video content" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>`;
                        break;
                    case 'divider':
                        htmlOutput += `<hr>`;
                        break;
                }
            });

            return htmlOutput;
        }

        /**
         * ---------------------------------------------------------------------
         * 3. DOM UPDATER (Bilingual Switcher)
         * ---------------------------------------------------------------------
         */
        function updateDOMForLanguage(lang) {
            currentLang = lang;
            const content = articleData[lang];

            // 1. Force the HTML root class to strictly apply the correct @font-faces globally
            const htmlRoot = document.getElementById('html-root');
            htmlRoot.className = `lang-${lang}`;

            // 2. Inject static UI Strings
            document.getElementById('ui-newspaper-name').textContent = content.ui.newspaperName;
            document.getElementById('ui-desktop-lang-text').textContent = content.ui.langToggleText;
            document.getElementById('ui-mobile-lang-text').textContent = content.ui.langToggleText;
            document.getElementById('ui-share-text').textContent = content.ui.shareText;
            document.getElementById('ui-print-text').textContent = content.ui.printText;
            
            document.getElementById('ui-modal-title').textContent = content.ui.modalTitle;
            document.getElementById('print-opt-en').textContent = content.ui.printEn;
            document.getElementById('print-opt-bn').textContent = content.ui.printBn;
            document.getElementById('print-opt-both').textContent = content.ui.printBoth;
            document.getElementById('print-modal-close').textContent = content.ui.cancel;
            document.getElementById('ui-toast-text').textContent = content.ui.toastMsg;

            // 3. Inject Dynamic Article Content
            const container = document.getElementById('article-dynamic-container');
            container.innerHTML = renderArticleHTML(content.article);
        }

        /**
         * ---------------------------------------------------------------------
         * 4. USER INTERACTION & EVENT LISTENERS
         * ---------------------------------------------------------------------
         */

        // Language Toggle Action
        function executeLanguageToggle() {
            const nextLang = currentLang === 'en' ? 'bn' : 'en';
            updateDOMForLanguage(nextLang);
            // Close mobile nav automatically if it is open
            document.getElementById('mobile-nav').classList.remove('active');
        }

        document.getElementById('desktop-lang-toggle').addEventListener('click', executeLanguageToggle);
        document.getElementById('mobile-lang-toggle').addEventListener('click', executeLanguageToggle);

        // Mobile Menu Operation
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('mobile-nav').classList.toggle('active');
        });

        // Strict Share Link Feature (Copies exact URL)
        document.getElementById('share-btn').addEventListener('click', () => {
            const strictUrl = articleData.config.shareUrl; // Enforcing rule
            
            // Reliable fallback copy method to bypass iframe restrictions
            const hiddenTextarea = document.createElement("textarea");
            hiddenTextarea.value = strictUrl;
            hiddenTextarea.style.position = "fixed"; 
            hiddenTextarea.style.opacity = "0";
            document.body.appendChild(hiddenTextarea);
            hiddenTextarea.select();
            
            try {
                document.execCommand('copy');
                triggerToast();
            } catch (err) {
                console.error('Clipboard copy failed.', err);
            }
            
            document.body.removeChild(hiddenTextarea);
        });

        function triggerToast() {
            const toast = document.getElementById('toast-msg');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        /**
         * ---------------------------------------------------------------------
         * 5. ADVANCED PRINT HANDLER
         * Modifies the DOM dynamically right before calling window.print()
         * ---------------------------------------------------------------------
         */
        const modal = document.getElementById('print-modal');
        
        document.getElementById('print-init-btn').addEventListener('click', () => {
            modal.classList.add('active');
        });

        document.getElementById('print-modal-close').addEventListener('click', () => {
            modal.classList.remove('active');
        });

        function processPrintCommand(format) {
            modal.classList.remove('active');
            const userPreviousLang = currentLang;

            if (format === 'en' || format === 'bn') {
                // Render the requested language
                updateDOMForLanguage(format);
                // Allow DOM a moment to paint, then print, then restore previous state
                setTimeout(() => {
                    window.print();
                    updateDOMForLanguage(userPreviousLang); 
                }, 250);
            } 
            else if (format === 'both') {
                // Generate a combined layout for both languages
                const staticEng = `
                    <div class="lang-en" style="margin-bottom: 3cm;">
                        <h1 style="text-align:center; font-family:'EnHead', serif; margin-bottom:1cm;">ISTIACK'S JULY CORNER</h1>
                        <img src="./t.png" style="width:100%; max-height:400px; object-fit:contain; filter:grayscale(100%); margin-bottom: 30px;">
                        ${renderArticleHTML(articleData.en.article)}
                    </div>
                `;
                
                const staticBng = `
                    <div class="lang-bn page-break">
                        <h1 style="text-align:center; font-family:'BnHead', serif; margin-bottom:1cm;">ইশতিয়াকের জুলাই কর্নার</h1>
                        <img src="./t.png" style="width:100%; max-height:400px; object-fit:contain; filter:grayscale(100%); margin-bottom: 30px;">
                        ${renderArticleHTML(articleData.bn.article)}
                    </div>
                `;

                const stagingNode = document.getElementById('print-staging-area');
                stagingNode.innerHTML = staticEng + staticBng;
                
                // Add class to hide primary view and show staging view in print mode
                document.body.classList.add('printing-dual');

                setTimeout(() => {
                    window.print();
                    // Cleanup post-print
                    document.body.classList.remove('printing-dual');
                    stagingNode.innerHTML = '';
                }, 250);
            }
        }

        document.getElementById('print-opt-en').addEventListener('click', () => processPrintCommand('en'));
        document.getElementById('print-opt-bn').addEventListener('click', () => processPrintCommand('bn'));
        document.getElementById('print-opt-both').addEventListener('click', () => processPrintCommand('both'));

        /**
         * ---------------------------------------------------------------------
         * 6. INITIAL BOOTSTRAP
         * ---------------------------------------------------------------------
         */
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize with English layout
            updateDOMForLanguage('en');
        });
    </script>
</body>
</html>
