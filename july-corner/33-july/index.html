<html lang="en">
<head>

    <!-- 
      ======================================================================
      CSS ARCHITECTURE & STYLING
      ======================================================================
      - Mobile-First Philosophy
      - Strict Font Declarations (E1, E2, B1, B2)
      - Advanced Print Media Queries
      - Minimalist "Pure Article" UI (Black & White Theme)
    -->
    <style>
        /* ==========================================================================
           1. CSS VARIABLES & THEME TOKENS
           ========================================================================== */
        :root {
            /* Colors - Pure Article Aesthetic (Minimalist, High Contrast) */
            --bg-color: #ffffff;
            --text-main: #111111;
            --text-muted: #555555;
            --text-light: #888888;
            --border-color: #eaeaea;
            --accent-color: #000000;
            --bg-muted: #f7f7f7;
            --overlay-bg: rgba(0, 0, 0, 0.85);
            --header-bg: rgba(255, 255, 255, 0.98);
            
            /* Typography Fallbacks */
            --font-fallback-en: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-fallback-bn: 'Kalpurush', 'Siyam Rupali', Arial, sans-serif;
            
            /* Spacing Scale */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 1rem;
            --space-4: 1.5rem;
            --space-5: 2rem;
            --space-6: 3rem;
            --space-8: 4rem;
            --space-12: 6rem;
            
            /* Layout & Z-Index */
            --max-width: 768px;
            --header-height: 70px;
            --z-header: 100;
            --z-mobile-menu: 90;
            --z-modal: 1000;
            --z-toast: 2000;
            
            /* Transitions */
            --trans-fast: 150ms ease;
            --trans-normal: 300ms ease-in-out;
            --trans-slow: 500ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           2. STRICT FONT DECLARATIONS (@font-face)
           ========================================================================== 
           Requirements: Fonts MUST be pulled from root directory.
        */
        @font-face {
            font-family: 'EnglishMain';
            src: url('/E1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        
        @font-face {
            font-family: 'EnglishHeader';
            src: url('/E2.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaHeader';
            src: url('/B1.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaMain';
            src: url('/B2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ==========================================================================
           3. RESET & BASE STYLES
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.75;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ==========================================================================
           STRICT FONT CONTROLS
           ==========================================================================
           Requirement: EVERY single letter must be under the control of these fonts.
        */
        
        /* --- ENGLISH STATE --- */
        body.lang-en,
        body.lang-en * {
            font-family: 'EnglishMain', var(--font-fallback-en) !important;
        }
        
        body.lang-en h1, 
        body.lang-en h2, 
        body.lang-en h3, 
        body.lang-en h4, 
        body.lang-en h5, 
        body.lang-en h6,
        body.lang-en .header-title,
        body.lang-en strong,
        body.lang-en b {
            font-family: 'EnglishHeader', var(--font-fallback-en) !important;
            font-weight: normal !important; /* Bold is handled by the font file itself */
        }

        /* --- BANGLA STATE --- */
        body.lang-bn,
        body.lang-bn * {
            font-family: 'BanglaMain', var(--font-fallback-bn) !important;
        }
        
        body.lang-bn h1, 
        body.lang-bn h2, 
        body.lang-bn h3, 
        body.lang-bn h4, 
        body.lang-bn h5, 
        body.lang-bn h6,
        body.lang-bn .header-title,
        body.lang-bn strong,
        body.lang-bn b {
            font-family: 'BanglaHeader', var(--font-fallback-bn) !important;
            font-weight: normal !important; /* Bold is handled by the font file itself */
        }

        /* Base Typography Metrics */
        h1, h2, h3 {
            line-height: 1.3;
            margin-bottom: var(--space-4);
            color: var(--text-main);
        }

        h1 { font-size: 2.25rem; letter-spacing: -0.02em; }
        h2 { 
            font-size: 1.6rem; 
            margin-top: var(--space-8); 
            border-bottom: 2px solid var(--text-main); 
            padding-bottom: var(--space-2); 
            display: inline-block;
        }
        h3 { font-size: 1.25rem; margin-top: var(--space-6); text-transform: uppercase; letter-spacing: 0.05em; }
        
        p { margin-bottom: var(--space-4); font-size: 1.125rem; }
        
        ul, ol { margin-bottom: var(--space-4); padding-left: var(--space-5); }
        li { margin-bottom: var(--space-3); font-size: 1.125rem; }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: var(--space-5) 0;
            background-color: var(--bg-muted);
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
            outline: none;
        }

        button:focus-visible {
            box-shadow: 0 0 0 2px var(--text-main);
            border-radius: 4px;
        }

        /* Text Links styling without actual hyperlink functionality (Requirement) */
        .raw-link {
            word-break: break-all;
            color: var(--text-muted);
            border-bottom: 1px dotted var(--text-muted);
        }

        /* ==========================================================================
           4. LAYOUT & COMPONENTS
           ========================================================================== */
        
        /* Fixed Header */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background-color: var(--header-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: var(--z-header);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-4);
            transition: transform 0.3s ease;
        }

        /* Hide header on scroll down, show on scroll up for better reading experience */
        .site-header.hidden {
            transform: translateY(-100%);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        /* Logo styling: Black and white first */
        .site-logo {
            height: 36px;
            width: 36px;
            object-fit: contain;
            filter: grayscale(100%); /* Strict grayscale requirement */
            margin: 0; /* Override global img margin */
        }

        .header-title {
            font-size: 1.15rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin: 0;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        /* Desktop specific header elements */
        .desktop-only {
            display: none;
        }

        /* Hamburger Menu Icon */
        .hamburger-btn {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            width: 30px;
            height: 24px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: calc(var(--z-header) + 2);
        }

        .hamburger-btn span {
            width: 30px;
            height: 2px;
            background: var(--text-main);
            border-radius: 10px;
            transition: all 0.3s linear;
            position: relative;
            transform-origin: 1px;
        }

        /* Hamburger Animation */
        .hamburger-btn.open span:nth-child(1) { transform: rotate(45deg); }
        .hamburger-btn.open span:nth-child(2) { opacity: 0; transform: translateX(20px); }
        .hamburger-btn.open span:nth-child(3) { transform: rotate(-45deg); }

        /* Mobile Menu Overlay */
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            z-index: calc(var(--z-header) + 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-6);
            transition: right var(--trans-slow);
            padding: var(--space-4);
        }

        .mobile-menu.open {
            right: 0;
        }

        /* Buttons */
        .btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            border: 1px solid var(--text-main);
            border-radius: 0; /* Sharp corners for pure article feel */
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all var(--trans-fast);
            background: transparent;
            color: var(--text-main);
            width: 100%;
            max-width: 300px;
        }

        .btn-outline:hover, .btn-outline:focus-visible {
            background-color: var(--text-main);
            color: var(--bg-color);
        }

        .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            transition: background-color var(--trans-fast);
            border: 1px solid transparent;
        }

        .btn-icon:hover {
            background-color: var(--bg-muted);
            border-color: var(--border-color);
        }

        .btn-icon svg {
            width: 22px;
            height: 22px;
            fill: var(--text-main);
        }

        /* Main Container */
        .main-content {
            margin-top: var(--header-height);
            min-height: calc(100vh - var(--header-height));
            padding-bottom: var(--space-12);
        }

        /* Hero Section */
        .hero-section {
            width: 100%;
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
        }

        .hero-image {
            width: 100%;
            max-height: 65vh;
            object-fit: cover;
            margin: 0; /* Remove default image margin for hero */
        }

        /* Action Bar (Share/Download) */
        .action-bar {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--space-3) var(--space-4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        
        .action-bar-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-light);
        }

        .action-buttons {
            display: flex;
            gap: var(--space-2);
        }

        /* Article Body */
        .article-container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--space-6) var(--space-4);
        }

        .article-meta {
            margin-bottom: var(--space-6);
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-left: 3px solid var(--text-main);
            padding-left: var(--space-3);
        }
        
        /* Inner Article Images styling */
        .article-container img {
            width: 100%;
            height: auto;
            border: 1px solid var(--border-color);
            margin: var(--space-5) 0;
            /* Explicitly no captions as per requirement */
        }

        /* Footer */
        .site-footer {
            border-top: 1px solid var(--border-color);
            padding: var(--space-8) var(--space-4);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            background-color: var(--bg-muted);
        }

        /* ==========================================================================
           5. MODALS & TOASTS (UI Overlays)
           ========================================================================== */
        
        /* Modal Backdrop */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-bg);
            z-index: var(--z-modal);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--trans-normal), visibility var(--trans-normal);
            padding: var(--space-4);
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Modal Content */
        .modal-content {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 480px;
            padding: var(--space-6);
            position: relative;
            transform: translateY(20px) scale(0.95);
            transition: transform var(--trans-normal);
            border: 1px solid var(--text-main);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-5);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: var(--space-3);
        }

        .modal-title {
            font-size: 1.25rem;
            margin: 0;
            text-transform: uppercase;
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            padding: var(--space-1);
        }

        .modal-close svg {
            width: 24px;
            height: 24px;
            fill: var(--text-main);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        /* Modal Radio Buttons Custom UI */
        .print-option-label {
            display: flex;
            align-items: center;
            padding: var(--space-3) var(--space-4);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all var(--trans-fast);
            background-color: var(--bg-muted);
        }

        .print-option-label:hover {
            border-color: var(--text-main);
            background-color: var(--bg-color);
        }

        .print-option-label input[type="radio"] {
            margin-right: var(--space-4);
            width: 20px;
            height: 20px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .print-option-label.selected {
            border-color: var(--text-main);
            background-color: var(--bg-color);
            font-weight: bold;
        }

        .modal-footer {
            margin-top: var(--space-6);
            display: flex;
            justify-content: flex-end;
            gap: var(--space-3);
        }

        .btn-primary {
            background-color: var(--text-main);
            color: var(--bg-color);
            padding: var(--space-3) var(--space-6);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid var(--text-main);
            transition: all var(--trans-fast);
        }

        .btn-primary:hover {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .btn-text {
            padding: var(--space-3) var(--space-4);
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .btn-text:hover {
            color: var(--text-main);
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            bottom: var(--space-6);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--text-main);
            color: var(--bg-color);
            padding: var(--space-3) var(--space-6);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            z-index: var(--z-toast);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .toast-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast-container svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        /* ==========================================================================
           6. RESPONSIVE DESIGN (Media Queries)
           ========================================================================== */
        
        /* Tablets and above */
        @media (min-width: 768px) {
            .header-title {
                font-size: 1.4rem;
            }
            .desktop-only {
                display: flex; /* Show language switcher in header */
            }
            .mobile-only {
                display: none; /* Hide hamburger */
            }
            
            h1 { font-size: 3rem; }
            h2 { font-size: 2rem; }
            p, li { font-size: 1.25rem; }
            
            .article-container {
                padding: var(--space-8) var(--space-4);
            }
            
            /* Action bar styling for desktop */
            .action-bar {
                padding: var(--space-4);
            }
            .btn-icon {
                width: 50px;
                height: 50px;
            }
            .btn-icon svg {
                width: 24px;
                height: 24px;
            }
        }

        /* ==========================================================================
           7. ADVANCED PRINT STYLES (@media print)
           ========================================================================== 
           Requirements: B&W mapping, Images kept, Videos removed, Accurate font faces.
        */
        @media print {
            /* Core Resets */
            body, .main-content, .article-container {
                background-color: transparent !important;
                color: #000 !important;
            }

            /* Hide all interactive & UI elements completely */
            .site-header, 
            .action-bar, 
            .site-footer, 
            .modal-overlay, 
            .toast-container,
            .mobile-menu,
            .hamburger-btn,
            button {
                display: none !important;
            }

            /* Video Removal Constraint */
            .video-container, 
            iframe,
            video {
                display: none !important;
            }

            /* Ensure Images are printed (t.png, 1.jpg, pv.jpg) */
            img {
                display: block !important;
                max-width: 100% !important;
                page-break-inside: avoid;
                filter: grayscale(100%) contrast(1.2) !important; /* Force B&W for images */
                border: 1px solid #ccc !important;
            }
            
            .hero-image {
                border: none !important;
                max-height: 400px !important;
            }

            /* Typography Print Enhancements */
            h1, h2, h3, p, li, span, strong {
                color: #000 !important;
                page-break-inside: avoid;
            }

            h2 {
                border-bottom: 1px solid #000 !important;
            }

            p, li {
                font-size: 12pt !important;
                line-height: 1.6 !important;
                text-align: justify;
            }

            /* Links Formatting (Raw Text) */
            .raw-link {
                color: #000 !important;
                border-bottom: none !important;
                text-decoration: underline !important;
            }

            /* Print Page Setup */
            @page {
                margin: 2cm;
                size: A4 portrait;
            }

            /* Eliminate Unnecessary Spacing */
            .main-content { margin-top: 0 !important; padding-bottom: 0 !important; }
            .article-container { padding: 0 !important; max-width: 100% !important; }
            
            /* Print Layout Structure Hacks */
            h1 { page-break-after: avoid; }
            img { page-break-before: auto; }
            ul { page-break-inside: auto; }
            li { page-break-inside: avoid; }

            /* --- MULTI-LANGUAGE PRINT HANDLING --- */
            /* Display the special container only when printing 'both' */
            #special-print-container {
                display: block !important;
            }
            
            .print-page-break {
                page-break-before: always;
                margin-top: 0;
                padding-top: 0;
                border: none;
            }
            
            /* When body has this class, it means we are executing the 'Both' print logic.
               In this state, we hide the normal flow article and show the compiled dual-language container. */
            body.is-printing-special .normal-flow-article,
            body.is-printing-special .hero-section {
                display: none !important;
            }
            
            /* Custom Print Header (Only visible on paper) */
            .print-header {
                display: block !important;
                text-align: center;
                margin-bottom: 20px;
                border-bottom: 2px solid #000;
                padding-bottom: 10px;
            }
            
            .print-header img {
                height: 40px !important;
                width: auto !important;
                margin: 0 auto 10px auto !important;
                border: none !important;
            }
            
            .print-header h1 {
                font-size: 14pt !important;
                margin: 0 !important;
                text-transform: uppercase;
            }
        }
        
        /* Hide Special Elements in Screen View */
        #special-print-container, .print-header {
            display: none;
        }

    </style>
</head>

        /**
         * Parses the JSON blocks array and generates raw HTML
         * @param {string} lang - 'en' or 'bn'
         */
        function buildArticleHTML(lang) {
            const data = ContentDB[`article_${lang}`];
            let html = '';

            // Meta & Title
            html += `<p class="article-meta">${data.meta}</p>`;
            html += `<h1>${data.title}</h1>`;

            // Loop through JSON content blocks
            data.blocks.forEach(block => {
                switch(block.type) {
                    case 'paragraph':
                        html += `<p>${block.content}</p>`;
                        break;
                    case 'heading':
                        html += `<h2>${block.content}</h2>`;
                        break;
                    case 'list':
                        html += `<ul>`;
                        block.items.forEach(item => {
                            html += `<li>${item}</li>`;
                        });
                        html += `</ul>`;
                        break;
                    case 'image':
                        // Fallback SVG generated inside onerror for robustness
                        const fallbackSvg = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='400' viewBox='0 0 800 400'><rect width='800' height='400' fill='%23f5f5f5'/><text x='50%' y='50%' font-family='sans-serif' font-size='18' fill='%23666' text-anchor='middle'>Missing Image: ${block.src}</text></svg>`;
                        html += `<img src="${block.src}" alt="${block.alt}" onerror="this.onerror=null; this.src='${fallbackSvg}'">`;
                        // Strict Rule: No captions
                        break;
                    default:
                        console.warn('Unknown block type:', block.type);
                }
            });

            return html;
        }

        /**
         * Updates all static UI strings on the page
         * @param {string} lang - 'en' or 'bn'
         */
        function updateUIStrings(lang) {
            const ui = ContentDB.ui[lang];

            nodes.newspaperName.innerText = ContentDB.config.newspaperName;
            nodes.footerText.innerText = ui.footer;
            nodes.actionLabel.innerText = ui.actionLabel;
            
            // Update Toggle Texts (Displays the opposite language suggestion)
            nodes.langBtnTexts.forEach(span => {
                span.innerText = ui.langBtnText;
            });

            // Modal Strings
            nodes.modalTitle.innerText = ui.printTitle;
            nodes.modalDesc.innerText = ui.printDesc;
            nodes.printEnText.innerText = ui.printEn;
            nodes.printBnText.innerText = ui.printBn;
            nodes.printBothText.innerText = ui.printBoth;
            nodes.printCancelBtn.innerText = ui.btnCancel;
            nodes.printConfirmBtn.innerText = ui.btnPrint;
            
            // Toast & Mobile Menu
            nodes.toastText.innerText = ui.toastMsg;
            document.getElementById('ui-mobile-share-text').innerText = ui.mobileShare;
            document.getElementById('ui-mobile-print-text').innerText = ui.mobilePrint;
        }

        /**
         * Main function to swap application language
         */
        function setLanguage(lang) {
            state.lang = lang;
            
            // Update root language for accessibility
            document.documentElement.lang = lang;

            // Update body class (This strictly triggers the font-family CSS variables)
            nodes.body.className = `lang-${lang} normal-flow`;

            // Render JSON Data to HTML
            nodes.articleContainer.innerHTML = buildArticleHTML(lang);
            
            // Update Static Strings
            updateUIStrings(lang);
        }

        /**

         * 4. INTERACTION HANDLERS
         * ====================================================================
         */

        // Language Toggle Action (Bound to multiple buttons: Desktop & Mobile)
        nodes.langToggleBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const newLang = state.lang === 'en' ? 'bn' : 'en';
                setLanguage(newLang);
                
                // If toggled from mobile menu, close it
                if(nodes.mobileNavOverlay.classList.contains('open')) {
                    toggleMobileMenu();
                }
            });
        });

        // Hamburger Menu Logic
        function toggleMobileMenu() {
            const isOpen = nodes.hamburgerBtn.classList.contains('open');
            if (isOpen) {
                nodes.hamburgerBtn.classList.remove('open');
                nodes.mobileNavOverlay.classList.remove('open');
                nodes.hamburgerBtn.setAttribute('aria-expanded', 'false');
                nodes.body.style.overflow = 'auto'; // restore scrolling
            } else {
                nodes.hamburgerBtn.classList.add('open');
                nodes.mobileNavOverlay.classList.add('open');
                nodes.hamburgerBtn.setAttribute('aria-expanded', 'true');
                nodes.body.style.overflow = 'hidden'; // prevent background scrolling
            }
        }
        nodes.hamburgerBtn.addEventListener('click', toggleMobileMenu);

        // Header Hide/Show on Scroll for better reading focus
        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;

                // Downscroll
                nodes.header.classList.add('hidden');
            } else {
                // Upscroll
                nodes.header.classList.remove('hidden');
            }
            state.lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; 
        });

        // --- Share Functionality ---
        function triggerShare() {
            // Strict Requirement: User can only copy the specific canonical URL format
            const url = ContentDB.config.canonicalUrl;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(url).then(showToast).catch(fallbackCopy);
            } else {
                fallbackCopy(url);
            }
            
            if(nodes.mobileNavOverlay.classList.contains('open')) {
                toggleMobileMenu();
            }
        }

        function fallbackCopy(url) {
            let textArea = document.createElement("textarea");
            textArea.value = url || ContentDB.config.canonicalUrl;
            textArea.style.position = "fixed"; 
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            textArea.remove();
        }

        function showToast() {
            nodes.shareToast.classList.add('show');
            setTimeout(() => {
                nodes.shareToast.classList.remove('show');
            }, 3500);
        }

        nodes.desktopShareBtn.addEventListener('click', triggerShare);
        nodes.mobileShareBtn.addEventListener('click', triggerShare);

        // --- Print Functionality & Dual Rendering ---
        function openPrintModal() {
            nodes.printModal.classList.add('active');
            if(nodes.mobileNavOverlay.classList.contains('open')) {
                toggleMobileMenu();
            }
        }
        
        function closePrintModal() {
            nodes.printModal.classList.remove('active');
        }

        nodes.desktopPrintBtn.addEventListener('click', openPrintModal);
        nodes.mobilePrintBtn.addEventListener('click', openPrintModal);
        nodes.modalCloseBtn.addEventListener('click', closePrintModal);
        nodes.printCancelBtn.addEventListener('click', closePrintModal);

        // Close modal on outside click
        nodes.printModal.addEventListener('click', (e) => {
            if(e.target === nodes.printModal) closePrintModal();
        });

        // Radio button visual selection handler
        nodes.printRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                nodes.printLabels.forEach(lbl => lbl.classList.remove('selected'));
                e.target.closest('.print-option-label').classList.add('selected');
            });
        });

        // Execute Print Command
        nodes.printConfirmBtn.addEventListener('click', () => {
            const selected = document.querySelector('input[name="print-lang"]:checked').value;
            closePrintModal();
            handleAdvancedPrint(selected);
        });

        /**
         * Handles complex print operations.
         * If "Both" is selected, constructs a hidden DOM structure with both
         * languages, triggers print, then cleans up.
         */
        function handleAdvancedPrint(mode) {
            const activeLang = state.lang; // Save current state

            if (mode === 'en' || mode === 'bn') {
                if (activeLang !== mode) {
                    setLanguage(mode); // Temporarily swap
                    setTimeout(() => {
                        window.print();
                        setLanguage(activeLang); // Restore
                    }, 400); // Buffer for font render
                } else {
                    window.print();
                }
            } 
            else if (mode === 'both') {
                /* DUAL LANGUAGE COMPILATION */
                
                let dualHTML = '';

                // Custom Print Header
                dualHTML += `
                    <div class="print-header">
                        <img src="/home.png" alt="Logo">
                        <h1>${ContentDB.config.newspaperName}</h1>
                    </div>
                `;

                // ENGLISH BLOCK
                // We wrap it in .lang-en and manually inline some font-families to ensure print fidelity
                dualHTML += `<div class="lang-en article-container" style="font-family: 'EnglishMain', sans-serif;">`;
                dualHTML += buildArticleHTML('en');
                dualHTML += `</div>`;

                // PAGE BREAK
                dualHTML += `<div class="print-page-break"></div>`;
                
                // Print Header again for second page
                dualHTML += `
                    <div class="print-header">
                        <img src="/home.png" alt="Logo">
                        <h1>${ContentDB.config.newspaperName}</h1>
                    </div>
                `;

                // BANGLA BLOCK
                dualHTML += `<div class="lang-bn article-container" style="font-family: 'BanglaMain', sans-serif;">`;
                dualHTML += buildArticleHTML('bn');
                dualHTML += `</div>`;

                // Inject into hidden container
                nodes.specialPrintContainer.innerHTML = dualHTML;
                
                // Add specific class to body to trigger special @media print rules
                nodes.body.classList.add('is-printing-special');
                
                // Trigger print dialog
                setTimeout(() => {
                    window.print();
                    
                    // Cleanup post-print
                    nodes.body.classList.remove('is-printing-special');
                    nodes.specialPrintContainer.innerHTML = '';
                }, 400);
            }
        }

        /**
         * ====================================================================
         * 5. BOOTSTRAP
         * ====================================================================
         */
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize app in English state
            setLanguage('en');
        });

    </script>
</body>
</html>
