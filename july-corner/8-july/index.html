<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>July 8, 2024</title>
    <meta name="description" content="Detailed timeline and events of the Bangladesh Quota Reform Movement on July 8, 2024.">
    <meta property="og:title" content="July 8, 2024 - ISTIACK'S JULY CORNER">
    <meta property="og:description" content="Detailed timeline and events of the Bangladesh Quota Reform Movement on July 8, 2024.">

    <meta property="og:image" content="./t.png">

    <meta property="article:published_time" content="2024-07-08T00:00:00Z">

    <!-- 
        ========================================================================
        STYLESHEET INJECTION
        ========================================================================
    -->
    <style>
        /* * 1. FONT DEFINITIONS (STRICT ASSET MANAGEMENT)
         * Enforcing the root folder .ttf files for English and Bangla.
         */
        @font-face {
            font-family: 'EnglishMain';
            src: url('/E1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'EnglishHeader';
            src: url('/E2.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaHeader';
            src: url('/B1.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaMain';
            src: url('/B2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* * 2. CSS VARIABLES (DESIGN TOKENS)
         * Mobile-first pure article aesthetic. Minimalist, high contrast.
         */
        :root {
            /* Color Palette */
            --bg-color: #FAFAFA;
            --surface-color: #FFFFFF;
            --text-primary: #111111;
            --text-secondary: #444444;
            --border-color: #E5E7EB;
            --action-color: #000000;
            --action-hover: #333333;
            --modal-overlay: rgba(0, 0, 0, 0.6);
            
            /* Spacing System */
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-xxl: 3rem;
            
            /* Layout */
            --header-height: 70px;
            --max-content-width: 800px;
            --border-radius: 4px;
            --transition-speed: 0.3s;
        }

        /* Language Specific Font Variables (Controlled by JS) */
        html[lang="en"] {
            --font-primary: 'EnglishMain', sans-serif;
            --font-heading: 'EnglishHeader', serif;
            --line-height-body: 1.7;
            --letter-spacing: 0.01em;
        }

        html[lang="bn"] {
            --font-primary: 'BanglaMain', sans-serif;
            --font-heading: 'BanglaHeader', serif;
            --line-height-body: 1.8;
            --letter-spacing: 0em;
        }

        /* * 3. CSS RESET & GLOBAL STYLES
         * Ensuring every single letter is under font control.
         */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-primary);
            font-size: 18px;
            line-height: var(--line-height-body);
            letter-spacing: var(--letter-spacing);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            padding-top: var(--header-height); /* Space for fixed header */
        }

        /* Enforce fonts on form elements and buttons */
        button, input, select, textarea {
            font-family: inherit;
            color: inherit;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            color: var(--text-primary);
            margin-bottom: var(--spacing-md);
            margin-top: var(--spacing-xl);
            line-height: 1.3;
        }

        p {
            margin-bottom: var(--spacing-lg);
            color: var(--text-secondary);
        }

        ul, ol {
            margin-bottom: var(--spacing-lg);
            padding-left: var(--spacing-xl);
            color: var(--text-secondary);
        }

        li {
            margin-bottom: var(--spacing-sm);
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Ensure links look like normal text as requested */
        a {
            color: inherit;
            text-decoration: none;
            pointer-events: none; /* Disables clicking */
            word-break: break-all;
        }

        /* * 4. COMPONENT STYLES
         */

        /* Header (Fixed) */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--spacing-lg);
            z-index: 1000;
            transition: transform var(--transition-speed) ease;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .site-logo {
            height: 40px;
            width: auto;
            /* Convert logo to black and white */
            filter: grayscale(100%) contrast(1.2);
            object-fit: contain;
        }

        .site-title {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-primary);
        }

        .header-right {
            display: flex;
            align-items: center;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            background-color: transparent;
            border: 1px solid var(--action-color);
            color: var(--action-color);
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background-color: var(--action-color);
            color: var(--surface-color);
        }

        .btn-lang {
            /* Specific style for language toggle */
            font-family: var(--font-heading);
        }

        .btn-action {
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 0.85rem;
            border-color: var(--border-color);
            color: var(--text-secondary);
        }

        .btn-action:hover {
            background-color: var(--border-color);
            color: var(--text-primary);
        }
        
        .btn-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Mobile Menu Toggle */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: var(--spacing-xs);
            color: var(--text-primary);
        }

        .menu-toggle svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* Main Content Layout */
        .main-content {
            width: 100%;
            max-width: var(--max-content-width);
            margin: 0 auto;
            background-color: var(--surface-color);
            min-height: calc(100vh - var(--header-height));
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        /* Hero Image Container */
        .hero-section {
            width: 100%;
            border-bottom: 1px solid var(--border-color);
        }

        .hero-img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            display: block;
        }

        /* Article Actions (Share/Print) */
        .article-actions {
            display: flex;
            justify-content: flex-end;
            gap: var(--spacing-md);
            padding: var(--spacing-md) var(--spacing-xl);
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
        }

        /* Article Body */
        .article-body {
            padding: var(--spacing-xl);
        }

        .article-title {
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }

        .article-meta {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: var(--spacing-xxl);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--text-primary);
            padding-bottom: var(--spacing-md);
            display: inline-block;
            width: 100%;
        }

        .content-section {
            margin-bottom: var(--spacing-xxl);
        }

        .content-section h2 {
            font-size: 1.8rem;
            border-left: 4px solid var(--text-primary);
            padding-left: var(--spacing-md);
        }

        .content-section h3 {
            font-size: 1.4rem;
            margin-top: var(--spacing-lg);
        }

        .divider {
            width: 50px;
            height: 2px;
            background-color: var(--border-color);
            margin: var(--spacing-xxl) auto;
        }

        .source-links {
            background-color: var(--bg-color);
            padding: var(--spacing-lg);
            border-radius: var(--border-radius);
            margin-top: var(--spacing-xxl);
            font-size: 0.9rem;
        }

        .source-links p {
            margin-bottom: var(--spacing-sm);
            word-wrap: break-word;
        }

        .in-article-img {
            width: 100%;
            margin: var(--spacing-xl) 0;
            border: 1px solid var(--border-color);
        }

        /* * 5. MODALS AND TOASTS
         */
        
        /* Print Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-speed) ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--surface-color);
            padding: var(--spacing-xxl);
            border-radius: var(--border-radius);
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform var(--transition-speed) ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            margin-top: 0;
            font-size: 1.5rem;
            margin-bottom: var(--spacing-lg);
        }

        .modal-options {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .modal-btn {
            width: 100%;
            padding: var(--spacing-md);
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .modal-btn:hover {
            background-color: var(--action-color);
            color: var(--surface-color);
            border-color: var(--action-color);
        }

        .modal-close {
            margin-top: var(--spacing-xl);
            background: none;
            border: none;
            color: var(--text-secondary);
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--action-color);
            color: var(--surface-color);
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: 50px;
            font-weight: bold;
            z-index: 3000;
            opacity: 0;
            transition: all var(--transition-speed) cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .toast.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* * 6. RESPONSIVE DESIGN (MOBILE FIRST EXTENSIONS)
         */
        @media (max-width: 768px) {
            .site-title {
                font-size: 1rem;
            }
            
            .header-right .btn-lang {
                display: none; /* Hide button on mobile, show in menu */
            }

            .menu-toggle {
                display: block;
            }

            /* Mobile Navigation Drawer */
            .mobile-nav {
                position: fixed;
                top: var(--header-height);
                right: -100%;
                width: 250px;
                height: calc(100vh - var(--header-height));
                background-color: var(--surface-color);
                border-left: 1px solid var(--border-color);
                transition: right var(--transition-speed) ease;
                display: flex;
                flex-direction: column;
                padding: var(--spacing-xl);
                z-index: 999;
                box-shadow: -5px 0 15px rgba(0,0,0,0.05);
            }

            .mobile-nav.active {
                right: 0;
            }

            .mobile-nav .btn-lang {
                display: block;
                width: 100%;
                text-align: center;
                margin-top: var(--spacing-lg);
            }
            
            .article-title {
                font-size: 2rem;
            }
            
            .article-body {
                padding: var(--spacing-lg);
            }
        }

        /* * 7. ADVANCED PRINT STYLES
         * Crucial for the physical paper output. Overrides standard web styles.
         */
        @media print {
            /* Reset colors for printer economy */
            body {
                background: #FFFFFF !important;
                color: #000000 !important;
                padding-top: 0 !important;
            }

            /* Hide UI Elements completely */
            .site-header,
            .article-actions,
            .modal-overlay,
            .toast,
            .mobile-nav {
                display: none !important;
            }

            /* Ensure main content takes full width */
            .main-content {
                box-shadow: none !important;
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
            }

            /* Typography Adjustments for Print */
            h1, h2, h3, h4, p, li {
                color: #000000 !important;
                page-break-inside: avoid;
            }
            
            h2 {
                border-left-color: #000000 !important;
            }

            /* Image Handling for Print */
            img {
                max-width: 100% !important;
                height: auto !important;
                page-break-inside: avoid;
            }
            
            /* Add page breaks between articles if "Both" is selected */
            .print-page-break {
                page-break-before: always;
                display: block;
                height: 1px; /* Firefox bug fix */
            }
            
            /* Ensure font settings are enforced by printer */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
        
        /* Utility class for JS print engine */
        .print-only-container {
            display: none;
        }
        
        @media print {
            .screen-only-when-printing {
                display: none !important;
            }
            .print-only-container {
                display: block !important;
            }
        }
    </style>
</head>

                    section.list.forEach(item => {
                        html += `<li>${item}</li>`;
                    });
                    html += `</ul>`;
                }

                // If section has subsections
                if (section.subsections) {
                    section.subsections.forEach(sub => {
                        html += `<h3>${sub.subtitle}</h3>`;
                        html += `<ul>`;
                        sub.list.forEach(item => {

            if(data.extraImage) {
                html += `<img src="${data.extraImage}" alt="" aria-hidden="true" class="in-article-img" onerror="this.style.display='none'">`;

            // Extracting date logic: July 8
            const dateVal = "8"; 
            const canonicalUrl = `https://istiack.ami.bd/july-corner/${dateVal}-july/`;

            // Clipboard API with fallback
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(canonicalUrl).then(() => {
                    showToast();
                });
            } else {
                // Fallback for older browsers or non-secure contexts (like local files)
                let textArea = document.createElement("textarea");
                textArea.value = canonicalUrl;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                document.body.removeChild(textArea);
            }
        }

        function showToast() {
            const toast = document.getElementById('toastMessage');
            toast.textContent = articleData[currentLang].meta.toastMsg;
            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        /**
         * 6. ADVANCED PRINTING LOGIC
         * Handles the custom modal and multi-language print rendering.
         */
        const printModal = document.getElementById('printModal');

        function openPrintModal() {
            printModal.classList.add('active');
        }

        function closePrintModal() {
            printModal.classList.remove('active');
        }

        /**
         * Executes the print based on user selection.
         * If "both", it creates a temporary printable DOM structure containing both languages.
         */
        function executePrint(mode) {
            closePrintModal();
            
            if (mode === 'en' || mode === 'bn') {
                // Single language print
                const previousLang = currentLang;
                if (currentLang !== mode) {
                    applyLanguage(mode); // Temporarily swap language
                }
                
                // Allow DOM to update before printing
                setTimeout(() => {
                    window.print();
                    // Revert language if it was changed
                    if (previousLang !== mode) {
                        applyLanguage(previousLang);
                    }
                }, 100);
            } else if (mode === 'both') {
                // Dual language print - Requires creating a shadow structure
                mainContent.classList.add('screen-only-when-printing');
                
                // Construct the combined HTML for printing
                let combinedHTML = `
                    <div lang="en" style="font-family: 'EnglishMain', sans-serif;">
                        <h2 style="font-family: 'EnglishHeader', serif; text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px;">
                            ${articleData.en.meta.newspaperName}
                        </h2>
                        ${buildArticleHTML('en')}
                    </div>
                    <div class="print-page-break"></div>
                    <div lang="bn" style="font-family: 'BanglaMain', sans-serif;">
                        <h2 style="font-family: 'BanglaHeader', serif; text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px;">
                            ${articleData.bn.meta.newspaperName}
                        </h2>
                        ${buildArticleHTML('bn')}
                    </div>
                `;
                
                printEngine.innerHTML = combinedHTML;
                
                setTimeout(() => {
                    window.print();
                    
                    // Cleanup after print dialog closes
                    setTimeout(() => {
                        mainContent.classList.remove('screen-only-when-printing');
                        printEngine.innerHTML = ''; // Clear memory
                    }, 500);
                }, 100);
            }
        }

        /**
         * 7. MOBILE MENU LOGIC
         */
        function toggleMobileMenu() {
            mobileNav.classList.toggle('active');
        }

        menuToggle.addEventListener('click', toggleMobileMenu);

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const isClickInside = siteHeader.contains(event.target) || mobileNav.contains(event.target);
            if (!isClickInside && mobileNav.classList.contains('active')) {
                toggleMobileMenu();
            }
        });

        // Hide header on scroll down, show on scroll up (Mobile App Feel)
        let lastScrollTop = 0;
        const siteHeader = document.getElementById('siteHeader');
        
        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                // Scroll Down
                siteHeader.style.transform = `translateY(-${getComputedStyle(document.documentElement).getPropertyValue('--header-height')})`;
            } else {
                // Scroll Up
                siteHeader.style.transform = 'translateY(0)';
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; // For Mobile or negative scrolling
        }, false);

        /**
         * 8. INITIALIZATION
         */
        window.addEventListener('DOMContentLoaded', () => {
            applyLanguage(currentLang);
        });

    </script>
</body>
</html>
