<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="The Bangla Blockade: July 6, 2024 - Bangladesh Anti-Quota Movement reaches a turning point.">

    <meta property="og:title" content="ISTIACK'S JULY CORNER - July 6, 2024">
    <meta property="og:description" content="Nationwide 'Bangla Blockade' announced as protests escalate across Bangladesh.">

    <style>
        /* ==========================================================================
           1. CSS VARIABLES & THEME SETUP
           Pure Article Aesthetic (Minimalist, high readability)
           ========================================================================== */
        :root {
            /* Colors */
            --bg-primary: #ffffff;
            --text-primary: #121212;
            --text-secondary: #4a4a4a;
            --border-light: #eaeaea;
            --header-bg: rgba(255, 255, 255, 0.95);
            --btn-bg: #f8f9fa;
            --btn-hover: #e9ecef;
            --accent-black: #000000;
            --link-bg: #f1f1f1;
            
            /* Spacing Framework */
            --sp-xs: 0.25rem;
            --sp-sm: 0.5rem;
            --sp-md: 1rem;
            --sp-lg: 2rem;
            --sp-xl: 3rem;
            --sp-xxl: 5rem;
            
            /* Layout & Structure */
            --header-height: 72px;
            --article-max-width: 720px;
            --content-padding: 20px;
            
            /* Animation & Transition */
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           2. TYPOGRAPHY & FONT ASSET MANAGEMENT (STRICT CONSTRAINT)
           Fonts loaded from Root Directory.
           Every letter must be under font control.
           ========================================================================== */
        @font-face {
            font-family: 'E1';
            src: url('/E1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'E2';
            src: url('/E2.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'B1';
            src: url('/B1.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'B2';
            src: url('/B2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* Global Reset & Strict Font Enforcements */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, input, textarea, select, button {
            font-family: 'E1', sans-serif; /* Default to English Main */
            color: var(--text-primary);
            background-color: var(--bg-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Base Typography Configuration */
        body {
            line-height: 1.75;
            font-size: 19px;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'E2', sans-serif; /* Default to English Header */
            color: var(--accent-black);
            line-height: 1.3;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
        }

        /* Bangla State Typography Overrides */
        body.lang-bn,
        body.lang-bn p,
        body.lang-bn li,
        body.lang-bn span,
        body.lang-bn div {
            font-family: 'B2', sans-serif;
            font-size: 20px; /* Slight bump for Bengali rendering */
            line-height: 1.8;
        }
        
        body.lang-bn h1, 
        body.lang-bn h2, 
        body.lang-bn h3, 
        body.lang-bn h4, 
        body.lang-bn h5, 
        body.lang-bn h6 {
            font-family: 'B1', sans-serif;
        }

        /* Specific Constraints: 
           Newspaper name MUST remain in E2 (English Header) regardless of state.
           Language Switcher button needs inverse fonts. 
        */
        .newspaper-title {
            font-family: 'E2', sans-serif !important; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 1.25rem;
            margin: 0;
        }

        /* Inverse logic for language toggle button text */
        body.lang-en .btn-lang-toggle span { font-family: 'B1', sans-serif !important; }
        body.lang-bn .btn-lang-toggle span { font-family: 'E2', sans-serif !important; }

        a, button {
            cursor: pointer;
            text-decoration: none;
            border: none;
            background: transparent;
        }

        /* ==========================================================================
           3. LAYOUT & UI COMPONENTS
           ========================================================================== */
        
        /* --- FIXED HEADER --- */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-light);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--sp-lg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--sp-md);
        }

        /* Logo Constraint: B&W filter */
        .site-logo {
            height: 36px;
            width: auto;
            filter: grayscale(100%);
            display: block;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: var(--sp-md);
        }

        /* Language Switcher */
        .btn-lang-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border: 1px solid var(--border-light);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: var(--transition-smooth);
        }
        
        .btn-lang-toggle:hover {
            background-color: var(--btn-hover);
            border-color: var(--text-secondary);
        }
        
        .btn-lang-toggle svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* Hamburger Menu */
        .btn-menu {
            display: none; /* Desktop hidden by default */
            padding: 8px;
            color: var(--text-primary);
        }
        .btn-menu svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* --- MAIN CONTENT & ARTICLE AESTHETIC --- */
        .main-container {
            margin-top: var(--header-height);
            min-height: 100vh;
            width: 100%;
        }

        /* Hero Image Container (./t.png constraint) */
        .hero-banner {
            width: 100%;
            max-width: var(--article-max-width);
            margin: 0 auto;
            padding-top: var(--sp-xl); /* Space below header */
        }

        .hero-banner img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        /* Article Wrapper */
        .article-wrapper {
            max-width: var(--article-max-width);
            margin: 0 auto;
            padding: var(--sp-xl) var(--content-padding) var(--sp-xxl);
        }

        /* Actions Bar (Share & Download directly below Hero) */
        .action-bar {
            display: flex;
            align-items: center;
            gap: var(--sp-md);
            padding-bottom: var(--sp-xl);
            margin-bottom: var(--sp-xl);
            border-bottom: 1px solid var(--border-light);
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--btn-bg);
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600; /* Usually safe, but overridden by E2/B1 if needed */
            transition: var(--transition-smooth);
        }
        
        body.lang-en .btn-action { font-family: 'E2', sans-serif; }
        body.lang-bn .btn-action { font-family: 'B1', sans-serif; font-size: 1rem; }

        .btn-action:hover {
            background-color: var(--btn-hover);
        }

        .btn-action svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Article Content Styling */
        .article-title {
            font-size: 2.8rem;
            margin-top: 0;
            margin-bottom: var(--sp-md);
            line-height: 1.15;
        }

        .article-meta {
            display: block;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: var(--sp-xl);
        }
        
        /* Body typography specifics */
        .article-content p {
            margin-bottom: 1.5rem;
        }

        .article-content h2 {
            font-size: 2rem;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 0.5rem;
        }

        .article-content ul {
            margin-bottom: 1.5rem;
            padding-left: var(--sp-xl);
        }

        .article-content li {
            margin-bottom: 0.75rem;
            padding-left: 0.25rem;
        }
        
        .article-content li::marker {
            color: var(--text-secondary);
        }

        .article-content hr {
            border: 0;
            height: 1px;
            background-color: var(--border-light);
            margin: var(--sp-xxl) 0;
        }

        /* Images inside content (Strict: No Captions) */
        .article-content img {
            width: 100%;
            height: auto;
            margin: var(--sp-lg) 0;
            display: block;
            border: 1px solid var(--border-light); /* Slight border for pure article style */
        }
        
        /* Strict link formatting: text only */
        .text-link {
            display: inline-block;
            background-color: var(--link-bg);
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 0.85em;
            word-break: break-all;
            margin-top: 4px;
            font-family: 'E1', sans-serif !important; /* URLs should strictly be in English font */
        }

        /* --- UI OVERLAYS (TOAST & MODAL) --- */
        
        /* Toast Notification */
        .toast-notification {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--accent-black);
            color: #fff;
            padding: 14px 28px;
            border-radius: 40px;
            font-size: 0.95rem;
            z-index: 2000;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        body.lang-en .toast-notification { font-family: 'E2', sans-serif; }
        body.lang-bn .toast-notification { font-family: 'B1', sans-serif; }
        
        .toast-notification.show {
            bottom: 40px;
        }

        /* Print Modal Overlay */
        .print-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
        }

        .print-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .print-modal-content {
            background-color: var(--bg-primary);
            width: 90%;
            max-width: 480px;
            border-radius: 12px;
            padding: var(--sp-xl);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid var(--border-light);
            transform: translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .print-modal.active .print-modal-content {
            transform: translateY(0);
        }

        .print-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--sp-lg);
        }

        .print-modal-title {
            margin: 0;
            font-size: 1.5rem;
        }

        .btn-close {
            color: var(--text-secondary);
            padding: 4px;
            transition: color var(--transition-smooth);
        }
        .btn-close:hover { color: var(--accent-black); }
        .btn-close svg { width: 24px; height: 24px; fill: currentColor; }

        .print-options-wrapper {
            display: flex;
            flex-direction: column;
            gap: var(--sp-md);
        }

        .btn-print-choice {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border: 1px solid var(--border-light);
            background-color: var(--bg-primary);
            border-radius: 8px;
            font-size: 1.05rem;
            transition: var(--transition-smooth);
        }

        .btn-print-choice:hover {
            border-color: var(--accent-black);
            background-color: var(--btn-bg);
            transform: translateY(-2px);
        }
        
        /* Enforce fonts in modal choices */
        .choice-en { font-family: 'E2', sans-serif !important; }
        .choice-bn { font-family: 'B1', sans-serif !important; }

        /* Print Buffer (Hidden on screen) */
        #print-buffer {
            display: none !important;
        }

        /* ==========================================================================
           4. RESPONSIVE DESIGN (Mobile First Adjustments)
           ========================================================================== */
        @media (max-width: 768px) {
            :root {
                --header-height: 60px;
                --sp-xl: 2rem;
                --content-padding: 16px;
            }

            .site-header {
                padding: 0 var(--sp-md);
            }

            .header-left .newspaper-title {
                font-size: 1rem;
                max-width: 140px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            
            .btn-lang-toggle span {
                display: none; /* Hide text on small mobile to save space */
            }
            
            .btn-lang-toggle::after {
                content: 'EN/বাংলা';
                font-family: 'E2', sans-serif;
                font-size: 0.8rem;
                display: inline-block;
            }

            .btn-menu {
                display: block; /* Show hamburger */
            }

            .hero-banner {
                padding-top: 0; /* Flush to header on mobile */
            }
            .hero-banner img {
                border-radius: 0;
            }

            .article-title {
                font-size: 2.2rem;
            }
            
            .article-content h2 {
                font-size: 1.6rem;
            }
            
            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-action {
                justify-content: center;
            }
        }

        @media (min-width: 769px) {
            .btn-lang-toggle::after { display: none; }
            .btn-lang-toggle span { display: inline; }
        }

        /* ==========================================================================
           5. ADVANCED PRINT STYLES
           ========================================================================== */
        @media print {
            /* Basic resets */
            * {
                background: transparent !important;
                color: #000 !important; /* Pure black text */
                box-shadow: none !important;
                text-shadow: none !important;
            }

            @page {
                margin: 2cm;
                size: A4 portrait;
            }
            
            /* Enforce Typography */
            body { 
                font-size: 12pt; 
                line-height: 1.5; 
                margin: 0 !important; 
                padding: 0 !important;
            }
            
            body, p, li, span, div { font-family: 'E1', sans-serif !important; }
            h1, h2, h3, h4, h5, h6, .newspaper-title { font-family: 'E2', sans-serif !important; }
            
            body.lang-bn, body.lang-bn p, body.lang-bn li, body.lang-bn span, body.lang-bn div { font-family: 'B2', sans-serif !important; }
            body.lang-bn h1, body.lang-bn h2, body.lang-bn h3, body.lang-bn h4, body.lang-bn h5, body.lang-bn h6 { font-family: 'B1', sans-serif !important; }
            
            .text-link { font-family: 'E1', sans-serif !important; } /* URLs always English */

            /* Hide UI Elements */
            .site-header, 
            .action-bar, 
            .print-modal,
            .toast-notification,
            .btn-lang-toggle,
            .btn-menu {
                display: none !important;
            }

            .main-container {
                margin-top: 0 !important;
            }

            .article-wrapper, .hero-banner {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            
            .hero-banner {
                margin-bottom: 20px !important;
            }

            /* Asset Management: All Images print, No Videos */
            img {
                display: block !important;
                max-width: 100% !important;
                height: auto !important;
                page-break-inside: avoid;
            }
            video, iframe {
                display: none !important;
            }

            /* Layout Flow */
            h2, h3, h4 {
                page-break-after: avoid;
                margin-top: 24pt;
            }
            p, li {
                page-break-inside: avoid;
                widows: 3;
                orphans: 3;
            }
            ul {
                margin-bottom: 12pt;
            }

            /* Links formatting */
            .text-link {
                border: 1px solid #ccc;
                display: inline-block;
                padding: 2px 6px;
                word-wrap: break-word;
            }

            /* Dual Language Print Logic */
            #print-buffer {
                display: block !important;
            }
            
            body.print-both .screen-article {
                display: none !important; /* Hide original when printing both */
            }
        }
    </style>
</head>

    <!-- ==========================================================================
         JAVASCRIPT LOGIC
         Architecture: Single state object, JSON dictionary, Event delegation.
         ========================================================================== -->
    <script>
        /**
         * APPLICATION CONFIGURATION & STATE
         */
        const AppState = {
            currentLang: 'en', // default language
            articleDate: '06'  // For URL constraint requirement
        };

        /**
         * CONTENT DICTIONARY (JSON-like structure)
         * Strict constraints handled:

        /**
         * DOM ELEMENTS
         */
        const DOM = {
            body: document.body,
            langBtnText: document.getElementById('ui-lang-text'),
            shareBtnText: document.getElementById('ui-share-text'),
            printBtnText: document.getElementById('ui-print-text'),
            modalTitle: document.getElementById('ui-modal-title'),
            modalDesc: document.getElementById('ui-modal-desc'),
            articleContent: document.getElementById('article-content'),
            btnLangToggle: document.getElementById('ui-btn-lang'),
            btnShare: document.getElementById('ui-btn-share'),
            btnPrint: document.getElementById('ui-btn-print'),
            printModal: document.getElementById('print-modal'),
            btnCloseModal: document.getElementById('btn-close-modal'),
            printChoices: document.querySelectorAll('.btn-print-choice'),
            toastMsg: document.getElementById('toast-message'),
            printBuffer: document.getElementById('print-buffer')
        };

        /**
         * RENDER PIPELINE
         * Replaces text seamlessly based on JSON payload
         */
        function renderView() {
            const lang = AppState.currentLang;
            const data = ContentDict[lang];

            // 1. Structural Class Assignment for Typography strict handling
            DOM.body.className = `lang-${lang}`;

            // 2. UI Localization
            DOM.langBtnText.textContent = data.ui.toggleBtnText;
            DOM.shareBtnText.textContent = data.ui.shareBtnText;
            DOM.printBtnText.textContent = data.ui.printBtnText;
            DOM.modalTitle.textContent = data.ui.modalTitle;
            DOM.modalDesc.textContent = data.ui.modalDesc;

            // 3. Article Content Construction
            const articleHTML = `
                <h1 class="article-title">${data.content.title}</h1>
                <time class="article-meta">${data.content.meta}</time>
                ${data.content.bodyHTML}
            `;
            
            DOM.articleContent.innerHTML = articleHTML;
        }

        /**
         * EVENT LISTENERS
         */
        
        // Language Toggle
        DOM.btnLangToggle.addEventListener('click', () => {
            AppState.currentLang = AppState.currentLang === 'en' ? 'bn' : 'en';
            renderView();
        });

        // Share Feature (Strict Copy URL Constraint)
        DOM.btnShare.addEventListener('click', () => {
            const canonicalURL = `https://istiack.ami.bd/july-corner/${AppState.articleDate}-july/`;
            
            // Clipboard API Logic
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(canonicalURL)
                    .then(() => triggerToast(ContentDict[AppState.currentLang].ui.toastSuccess))
                    .catch(() => fallbackClipboardCopy(canonicalURL));
            } else {
                fallbackClipboardCopy(canonicalURL);
            }
        });

        function fallbackClipboardCopy(text) {
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = text;
            tempTextArea.style.position = "fixed"; 
            tempTextArea.style.left = "-999999px";
            document.body.appendChild(tempTextArea);
            tempTextArea.focus();
            tempTextArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) triggerToast(ContentDict[AppState.currentLang].ui.toastSuccess);
            } catch (err) {
                console.error('Fallback clipboard failed', err);
            }
            document.body.removeChild(tempTextArea);
        }

        function triggerToast(msg) {
            DOM.toastMsg.textContent = msg;
            DOM.toastMsg.classList.add('show');
            setTimeout(() => {
                DOM.toastMsg.classList.remove('show');
            }, 3000);
        }

        // Print Modal Triggers
        DOM.btnPrint.addEventListener('click', () => {
            DOM.printModal.classList.add('active');
        });

        DOM.btnCloseModal.addEventListener('click', () => {
            DOM.printModal.classList.remove('active');
        });

        DOM.printModal.addEventListener('click', (e) => {
            if (e.target === DOM.printModal) DOM.printModal.classList.remove('active');
        });

        // Print Choice Execution
        DOM.printChoices.forEach(btn => {
            btn.addEventListener('click', () => {
                const choice = btn.getAttribute('data-print');
                DOM.printModal.classList.remove('active');
                executePrint(choice);
            });
        });

        function executePrint(mode) {
            DOM.printBuffer.innerHTML = ''; // Reset buffer
            
            if (mode === 'en' || mode === 'bn') {
                // Single language print
                const previousLang = AppState.currentLang;
                if (previousLang !== mode) {
                    AppState.currentLang = mode;
                    renderView();
                    DOM.body.setAttribute('data-revert', previousLang);
                }
                DOM.body.className = `lang-${mode}`; 
            } else if (mode === 'both') {
                // Both languages: Construct print buffer
                DOM.body.classList.add('print-both');
                
                const dataEN = ContentDict['en'].content;
                const dataBN = ContentDict['bn'].content;
                
                // Constructing explicit inline styles for the buffer to ensure font strictness in print
                const htmlBuffer = `
                    <div style="font-family: 'E1', sans-serif;">
                        <h1 style="font-family: 'E2', sans-serif;">${dataEN.title}</h1>
                        <p style="color: #4a4a4a;">${dataEN.meta}</p>
                        ${dataEN.bodyHTML}
                    </div>
                    <hr style="border: 0; border-top: 1px solid #000; margin: 40px 0;">
                    <div style="font-family: 'B2', sans-serif;">
                        <h1 style="font-family: 'B1', sans-serif;">${dataBN.title}</h1>
                        <p style="color: #4a4a4a;">${dataBN.meta}</p>
                        ${dataBN.bodyHTML}
                    </div>
                `;
                DOM.printBuffer.innerHTML = htmlBuffer;
            }

            // Yield to browser rendering thread, then print
            setTimeout(() => {
                window.print();
                
                // Clean up after print dialogue closes
                setTimeout(() => {
                    const revertLang = DOM.body.getAttribute('data-revert');
                    if (revertLang) {
                        AppState.currentLang = revertLang;
                        renderView();
                        DOM.body.removeAttribute('data-revert');
                    }
                    DOM.body.classList.remove('print-both');
                    DOM.printBuffer.innerHTML = '';
                    DOM.body.className = `lang-${AppState.currentLang}`;
                }, 500);
            }, 150);
        }

        /**
         * INITIALIZATION RUN
         */
        window.addEventListener('DOMContentLoaded', () => {
            renderView();
        });

    </script>
