        /* ==========================================================================
           1. ROOT VARIABLES & FONT FACE DECLARATIONS
           ========================================================================== */
        
        /* Strict Font Declarations targeting the Root Directory as requested.
           E1 = English Main, E2 = English Header
           B1 = Bangla Header, B2 = Bangla Main
        */
        @font-face {
            font-family: 'EnglishMain';
            src: url('/E1.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'EnglishHeader';
            src: url('/E2.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaHeader';
            src: url('/B1.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaMain';
            src: url('/B2.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            /* Pure Article Aesthetic Colors */
            --bg-color: #ffffff;
            --text-primary: #111111;
            --text-secondary: #444444;
            --border-color: #e5e5e5;
            --btn-bg: #f5f5f5;
            --btn-hover: #e0e0e0;
            --accent-color: #000000;
            
            /* Spacing */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-xxl: 48px;

            /* Z-index layers */
            --z-header: 1000;
            --z-modal: 2000;
            --z-toast: 3000;
        }

        /* ==========================================================================
           2. GLOBAL RESET & BASE TYPOGRAPHY
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Strict Font Control Logic based on the HTML lang attribute.
           Ensures every single letter is under control of the requested fonts.
        */
        html[lang="en"] {
            font-family: 'EnglishMain', sans-serif;
        }
        
        html[lang="en"] h1, 
        html[lang="en"] h2, 
        html[lang="en"] h3, 
        html[lang="en"] h4, 
        html[lang="en"] h5, 
        html[lang="en"] h6,
        html[lang="en"] .header-font {
            font-family: 'EnglishHeader', sans-serif;
        }

        html[lang="en"] button,
        html[lang="en"] input,
        html[lang="en"] select,
        html[lang="en"] textarea {
            font-family: 'EnglishMain', sans-serif;
        }

        html[lang="bn"] {
            font-family: 'BanglaMain', sans-serif;
        }
        
        html[lang="bn"] h1, 
        html[lang="bn"] h2, 
        html[lang="bn"] h3, 
        html[lang="bn"] h4, 
        html[lang="bn"] h5, 
        html[lang="bn"] h6,
        html[lang="bn"] .header-font {
            font-family: 'BanglaHeader', sans-serif;
        }

        html[lang="bn"] button,
        html[lang="bn"] input,
        html[lang="bn"] select,
        html[lang="bn"] textarea {
            font-family: 'BanglaMain', sans-serif;
        }

        /* ==========================================================================
           3. LAYOUT & COMPONENTS (Mobile First)
           ========================================================================== */
        
        /* --- Fixed Header --- */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 var(--spacing-md);
            z-index: var(--z-header);
            transition: all 0.3s ease;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            text-decoration: none;
            color: var(--text-primary);
        }

        .brand-logo {
            height: 36px;
            width: auto;
            /* Rule: Make it black and white first */
            filter: grayscale(100%);
            object-fit: contain;
        }

        .brand-name {
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: none; /* Hidden on very small screens, shown via media query */
        }

        .header-actions {
            display: flex;
            align-items: center;
        }

        .lang-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: 0.9rem;
            color: var(--text-primary);
            transition: background-color 0.2s, border-color 0.2s;
        }

        .lang-toggle-btn:hover {
            background-color: var(--btn-bg);
            border-color: #ccc;
        }

        .lang-toggle-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* --- Main Content Container --- */
        .main-content {
            margin-top: 70px; /* Offset for fixed header */
            width: 100%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            padding: var(--spacing-md);
            flex-grow: 1;
        }

        /* --- Hero Image --- */
        .hero-section {
            width: 100%;
            margin-bottom: var(--spacing-lg);
            border-radius: 8px;
            overflow: hidden;
            background-color: #f9f9f9;
        }

        .hero-section img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* --- Article Action Bar --- */
        .article-actions {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .action-btn {
            background-color: var(--btn-bg);
            border: none;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background-color: var(--btn-hover);
            color: var(--text-primary);
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* --- Article Typography & Formatting --- */
        .article-body {
            font-size: 1.1rem;
        }

        .article-body h1 {
            font-size: 2.2rem;
            line-height: 1.3;
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
        }

        .article-body h2 {
            font-size: 1.6rem;
            margin-top: var(--spacing-xl);
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-xs);
            border-bottom: 2px solid var(--text-primary);
            display: inline-block;
        }

        .article-body h3 {
            font-size: 1.3rem;
            margin-top: var(--spacing-lg);
            margin-bottom: var(--spacing-sm);
            color: var(--text-secondary);
        }

        .article-body p {
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
            text-align: justify;
        }

        .article-body ul {
            margin-bottom: var(--spacing-lg);
            padding-left: var(--spacing-xl);
        }

        .article-body li {
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        /* Rule: Links as plain text, not hyperlinked */
        .plain-link {
            color: var(--text-secondary);
            word-break: break-all;
            background-color: #f4f4f4;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.95em;
            display: inline-block;
            margin-top: 4px;
        }
        
        .inline-link {
            font-weight: bold;
            color: var(--text-secondary);
        }

        /* Content Images */
        .content-image-wrapper {
            margin: var(--spacing-xl) 0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .content-image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Rule: no images have any caption. Intentionally omitting figcaption */

        /* --- Modal (Print Selection) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: var(--z-modal);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-color);
            padding: var(--spacing-xl);
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            text-align: center;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 1.4rem;
            margin-bottom: var(--spacing-lg);
        }

        .modal-options {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .modal-btn {
            background-color: white;
            border: 2px solid var(--text-primary);
            color: var(--text-primary);
            padding: var(--spacing-md);
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .modal-btn:hover {
            background-color: var(--text-primary);
            color: white;
        }

        .modal-close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.9rem;
        }

        /* --- Toast Notification --- */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--text-primary);
            color: white;
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: var(--z-toast);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast-notification svg {
            width: 20px;
            height: 20px;
            fill: #4CAF50;
        }

        /* ==========================================================================
           4. MEDIA QUERIES (Responsive Design)
           ========================================================================== */
        @media (min-width: 600px) {
            .brand-name {
                display: block;
            }
            .main-content {
                padding: var(--spacing-xl);
            }
            .article-body h1 {
                font-size: 2.8rem;
            }
        }

        /* ==========================================================================
           5. ADVANCED PRINT STYLES
           ========================================================================== */
        @media print {
            /* Reset body and hide UI */
            body {
                background: white !important;
                color: black !important;
                font-size: 12pt;
            }

            .site-header, 
            .article-actions, 
            .modal-overlay, 
            .toast-notification {
                display: none !important;
            }

            /* Main Layout Adjustments for Paper */
            .main-content {
                margin: 0 !important;
                padding: 0 !important;
                max-width: 100% !important;
                width: 100% !important;
            }

            /* Ensure Font-Faces are rendered properly */
            html[lang="en"] { font-family: 'EnglishMain', sans-serif !important; }
            html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] h3 { font-family: 'EnglishHeader', sans-serif !important; }
            html[lang="bn"] { font-family: 'BanglaMain', sans-serif !important; }
            html[lang="bn"] h1, html[lang="bn"] h2, html[lang="bn"] h3 { font-family: 'BanglaHeader', sans-serif !important; }

            /* Color Optimization */
            *, *:before, *:after {
                background: transparent !important;
                color: #000 !important;
                box-shadow: none !important;
                text-shadow: none !important;
            }

            /* Handle Page Breaks */
            h1, h2, h3 {
                page-break-after: avoid;
                break-after: avoid;
            }
            
            p, ul, li {
                page-break-inside: avoid;
                break-inside: avoid;
            }

            img {
                page-break-inside: avoid;
                break-inside: avoid;
                max-width: 100% !important;
            }

            /* Rule: Add every pic in the printing, videos may removed.
               Aggressively targeting any video or iframe elements. 
            */
            video, iframe, object, embed {
                display: none !important;
            }

            /* Specific Print Container Logic (for "Both" mode) */
            #print-only-container {
                display: block !important;
            }
            
            body.printing-both #article-content {
                display: none !important; /* Hide normal content when printing both */
            }

            .page-break {
                page-break-before: always;
                break-before: page;
            }
        }
        
        /* Hide print container on screen */
        #print-only-container {
            display: none;
        }

    </style>
</head>

        /**
         * ==========================================================================
         * STATE MANAGEMENT
         * ==========================================================================
         */
        let currentLang = 'en'; // Default language

        /**
         * ==========================================================================
         * UTILITY FUNCTIONS
         * ==========================================================================
         */

        /**
         * Helper to parse text that might contain plain text URLs.
         * Enforces the rule: "must show the links as text. not hyperlinked"
         */
        function formatText(text) {
            // Replace line breaks with br tags
            let formattedText = text.replace(/\n/g, '<br>');
            
            // Highlight URLs as plain text blocks (Not A tags)
            const urlRegex = /(https?:\/\/[^\s\]]+)/g;
            formattedText = formattedText.replace(urlRegex, '<span class="plain-link">$1</span>');
            
            return formattedText;
        }

        /**
         * Safely creates DOM elements based on the parsed section data
         */
        function createDOMNode(section) {
            let el;
            switch(section.type) {
                case 'h2':
                case 'h3':
                    el = document.createElement(section.type);
                    el.className = 'header-font';
                    el.innerHTML = formatText(section.text);
                    break;
                case 'p':
                    el = document.createElement('p');
                    el.innerHTML = formatText(section.text);
                    break;
                case 'ul':
                    el = document.createElement('ul');
                    section.items.forEach(itemText => {
                        const li = document.createElement('li');
                        li.innerHTML = formatText(itemText);
                        el.appendChild(li);
                    });
                    break;
                case 'image':
                    // Rule: no images have any caption
                    el = document.createElement('div');
                    el.className = 'content-image-wrapper';
                    const img = document.createElement('img');
                    img.src = section.src;
                    img.alt = section.alt;
                    img.onerror = function() { this.style.display='none'; };
                    el.appendChild(img);
                    break;
                default:
                    el = document.createElement('div');
            }
            return el;
        }

        /**
         * Builds the full HTML structure for a specific language
         */
        function buildArticleHTML(langData) {
            const fragment = document.createDocumentFragment();

            // Build Title
            const h1 = document.createElement('h1');
            h1.className = 'header-font';
            h1.textContent = langData.content.title;
            fragment.appendChild(h1);

            // Build Intro
            const introP = document.createElement('p');
            introP.innerHTML = formatText(langData.content.intro);
            fragment.appendChild(introP);
            
            const introNoteP = document.createElement('p');
            introNoteP.innerHTML = formatText(langData.content.introNote);
            fragment.appendChild(introNoteP);

            // Build Sections
            langData.content.sections.forEach(section => {
                fragment.appendChild(createDOMNode(section));
            });

            return fragment;
        }

        /**
         * ==========================================================================
         * CORE RENDERING ENGINE
         * ==========================================================================
         */
        function renderUI() {
            const data = articleData[currentLang];
            
            // 1. Update HTML lang attribute (crucial for font inheritance)
            document.documentElement.lang = currentLang;

            // 2. Update UI Strings (Header, Buttons, Modals)
            document.title = data.content.title + " - " + data.ui.newspaperName;
            document.getElementById('ui-newspaper-name').textContent = data.ui.newspaperName;
            document.getElementById('ui-lang-text').textContent = data.ui.langToggleText;
            document.getElementById('ui-share-text').textContent = data.ui.shareText;
            document.getElementById('ui-print-text').textContent = data.ui.printText;
            document.getElementById('ui-modal-title').textContent = data.ui.modalTitle;
            document.getElementById('print-opt-en').textContent = data.ui.printEn;
            document.getElementById('print-opt-bn').textContent = data.ui.printBn;
            document.getElementById('print-opt-both').textContent = data.ui.printBoth;
            document.getElementById('btn-close-modal').textContent = data.ui.modalCancel;
            document.getElementById('ui-toast-text').textContent = data.ui.toastMsg;

            // 3. Render Main Article Content
            const articleContainer = document.getElementById('article-content');
            articleContainer.innerHTML = ''; // Clear current
            articleContainer.appendChild(buildArticleHTML(data));
        }

        /**
         * ==========================================================================
         * EVENT LISTENERS & INTERACTIVITY
         * ==========================================================================
         */

        // Language Toggle
        document.getElementById('btn-lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'bn' : 'en';
            renderUI();
        });

        // Share Link functionality
        document.getElementById('btn-share').addEventListener('click', () => {
            // Hardcoded required URL
            const urlToCopy = 'https://istiack.ami.bd/july-corner/17-july/';
            
            // Advanced copy to clipboard mechanism
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(urlToCopy).then(showToast);
            } else {
                // Fallback for older browsers
                let textArea = document.createElement("textarea");
                textArea.value = urlToCopy;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                document.body.removeChild(textArea);
            }
        });

        // Toast logic
        function showToast() {
            const toast = document.getElementById('copy-toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Print Modal Logic
        const printModal = document.getElementById('print-modal');
        const printContainer = document.getElementById('print-only-container');

        document.getElementById('btn-print').addEventListener('click', () => {
            printModal.classList.add('active');
        });

        document.getElementById('btn-close-modal').addEventListener('click', () => {
            printModal.classList.remove('active');
        });

        // Specialized Print Handlers
        document.getElementById('print-opt-en').addEventListener('click', () => {
            executePrint('en');
        });

        document.getElementById('print-opt-bn').addEventListener('click', () => {
            executePrint('bn');
        });

        document.getElementById('print-opt-both').addEventListener('click', () => {
            executePrintBoth();
        });

        /**
         * Executes print for a single selected language
         */
        function executePrint(targetLang) {
            printModal.classList.remove('active');
            
            // Temporarily switch language if necessary
            const originalLang = currentLang;
            if (currentLang !== targetLang) {
                currentLang = targetLang;
                renderUI();
            }

            // Small delay to allow fonts to apply and DOM to settle
            setTimeout(() => {
                window.print();
                // Restore original state
                if (currentLang !== originalLang) {
                    currentLang = originalLang;
                    renderUI();
                }
            }, 300);
        }

        /**
         * Executes print for both languages sequentially
         */
        function executePrintBoth() {
            printModal.classList.remove('active');
            
            // Clear print container
            printContainer.innerHTML = '';
            
            // Build EN DOM inside print container
            const enWrap = document.createElement('div');
            enWrap.setAttribute('lang', 'en'); // Force english font rendering inside wrapper
            enWrap.className = 'article-body';
            enWrap.appendChild(buildArticleHTML(articleData.en));
            
            // Page Break
            const pageBreak = document.createElement('div');
            pageBreak.className = 'page-break';
            
            // Build BN DOM inside print container
            const bnWrap = document.createElement('div');
            bnWrap.setAttribute('lang', 'bn'); // Force bangla font rendering inside wrapper
            bnWrap.className = 'article-body';
            bnWrap.appendChild(buildArticleHTML(articleData.bn));

            printContainer.appendChild(enWrap);
            printContainer.appendChild(pageBreak);
            printContainer.appendChild(bnWrap);

            // Add CSS class to body that switches view mode strictly for CSS @media print
            document.body.classList.add('printing-both');

            setTimeout(() => {
                window.print();
                // Cleanup after print dialog closes
                document.body.classList.remove('printing-both');
                printContainer.innerHTML = ''; 
            }, 300);
        }

        /**
         * ==========================================================================
         * INITIALIZATION
         * ==========================================================================
         */
        document.addEventListener('DOMContentLoaded', () => {
            renderUI();
        });

    </script>
