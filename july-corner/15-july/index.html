        /* ==========================================================================
           1. FONT DEFINITIONS (Strict Asset Management)
           ========================================================================== */
        @font-face {
            font-family: 'EnMain';
            src: url('/E1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'EnHeader';
            src: url('/E2.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'BnHeader';
            src: url('/B1.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'BnMain';
            src: url('/B2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ==========================================================================
           2. CSS VARIABLES & RESET
           ========================================================================== */
        :root {
            --bg-color: #fdfdfd;
            --text-main: #1a1a1a;
            --text-muted: #555555;
            --border-color: #e5e5e5;
            --header-bg: #ffffff;
            --accent-color: #000000;
            --button-hover: #f0f0f0;
            --max-width: 800px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            padding-top: 70px; /* Space for fixed header */
        }

        /* ==========================================================================
           3. DYNAMIC FONT ASSIGNMENTS (Based on data-lang attribute)
           Every single letter is under font control
           ========================================================================== */
        body[data-lang="en"] {
            font-family: 'EnMain', sans-serif;
            font-size: 18px;
        }
        body[data-lang="bn"] {
            font-family: 'BnMain', sans-serif;
            font-size: 20px;
        }

        /* Header specific font overrides based on language */
        body[data-lang="en"] h1, 
        body[data-lang="en"] h2, 
        body[data-lang="en"] h3,
        body[data-lang="en"] .newspaper-name,
        body[data-lang="en"] .btn-text,
        body[data-lang="en"] .modal-title {
            font-family: 'EnHeader', sans-serif;
        }

        body[data-lang="bn"] h1, 
        body[data-lang="bn"] h2, 
        body[data-lang="bn"] h3,
        body[data-lang="bn"] .btn-text,
        body[data-lang="bn"] .modal-title {
            font-family: 'BnHeader', sans-serif;
        }

        /* Newspaper name remains English font but scales with layout */
        .newspaper-name {
            font-family: 'EnHeader', sans-serif !important;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ==========================================================================
           4. LAYOUT & UI COMPONENTS
           ========================================================================== */
        /* Fixed Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--spacing-lg);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .logo-img {
            height: 35px;
            width: auto;
            /* Convert logo to black and white */
            filter: grayscale(100%); 
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        /* Buttons */
        button {
            background: none;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 4px;
            color: var(--text-main);
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--button-hover);
        }
        
        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }
        .btn-primary:hover {
            background-color: #333;
        }

        .lang-toggle {
            border: 1px solid var(--accent-color);
            border-radius: 20px;
            padding: 6px 20px;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            padding: 4px;
        }

        /* Main Content Area */
        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--spacing-lg) var(--spacing-md);
        }

        /* Hero Image */
        .hero-image {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: var(--spacing-lg);
            display: block;
        }

        /* Action Bar (Share/Print) */
        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
        }

        /* Article Typography */
        article h1 {
            font-size: 2.5rem;
            line-height: 1.2;
            margin-bottom: var(--spacing-md);
        }
        article h2 {
            font-size: 1.8rem;
            margin-top: var(--spacing-xl);
            margin-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 4px;
            display: inline-block;
        }
        article p {
            margin-bottom: var(--spacing-md);
            text-align: justify;
        }
        article ul {
            margin-bottom: var(--spacing-md);
            padding-left: var(--spacing-xl);
        }
        article li {
            margin-bottom: 8px;
        }
        
        /* Links displayed as text */
        .text-link {
            word-break: break-all;
            color: var(--text-muted);
            font-size: 0.9em;
        }

        /* In-Article Images */
        .article-img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            margin: var(--spacing-md) 0;
            display: block;
        }

        /* Video Container */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            margin: var(--spacing-lg) 0;
            border-radius: 8px;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Source List */
        .source-list {
            background-color: #f9f9f9;
            padding: var(--spacing-md);
            border-radius: 4px;
            margin-top: var(--spacing-xl);
            font-size: 0.9em;
        }

        /* ==========================================================================
           5. MODALS & TOAST NOTIFICATIONS
           ========================================================================== */
        /* Print Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: var(--bg-color);
            padding: var(--spacing-lg);
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-title {
            font-size: 1.5rem;
            margin-bottom: var(--spacing-sm);
        }
        .modal-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: var(--spacing-lg);
        }
        .modal-options button {
            justify-content: center;
            width: 100%;
            padding: 12px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent-color);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 10000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ==========================================================================
           6. RESPONSIVE DESIGN
           ========================================================================== */
        @media (max-width: 768px) {
            header {
                padding: 0 var(--spacing-md);
            }
            .desktop-nav {
                display: none;
            }
            .hamburger {
                display: block;
            }
            .newspaper-name span {
                font-size: 1rem;
            }
            article h1 {
                font-size: 2rem;
            }
            article h2 {
                font-size: 1.5rem;
            }
            
            /* Mobile Menu Expansion */
            .mobile-menu-active .desktop-nav {
                display: flex;
                flex-direction: column;
                position: fixed;
                top: 70px;
                left: 0;
                width: 100%;
                background: var(--header-bg);
                padding: var(--spacing-md);
                border-bottom: 1px solid var(--border-color);
                box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            }
        }

        /* ==========================================================================
           7. ADVANCED PRINT STYLES
           ========================================================================== */
        @media print {
            @page {
                margin: 2cm;
            }
            body {
                background: #fff !important;
                color: #000 !important;
                padding-top: 0 !important;
            }
            /* Hide UI Elements */
            header .header-actions,
            .hamburger,
            .action-bar,
            .modal-overlay,
            .toast {
                display: none !important;
            }
            /* Keep header branding but make it static for print */
            header {
                position: static !important;
                border-bottom: 2px solid #000 !important;
                height: auto !important;
                padding: 10px 0 !important;
                margin-bottom: 20px !important;
            }
            main {
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            /* Ensure Fonts render in print if browser supports */
            body[data-lang="en"] { font-family: 'EnMain', sans-serif !important; }
            body[data-lang="bn"] { font-family: 'BnMain', sans-serif !important; }
            
            /* Typography adjustments for print */
            article h1, article h2 {
                page-break-after: avoid;
                color: #000 !important;
            }
            article p, article li {
                page-break-inside: avoid;
                color: #000 !important;
            }
            
            /* Images */
            img {
                max-width: 100% !important;
                page-break-inside: avoid;
            }
            
            /* REMOVE VIDEOS FOR PRINTING */
            iframe, .video-container {
                display: none !important;
            }

            .page-break {
                page-break-before: always;
            }
            
            /* Links in print */
            .text-link {
                color: #000 !important;
            }
        }
    </style>
</head>

                    <h1>15 July 2024: The Day the Campus Bled</h1>
                    <p>On July 15, 2024, the Bangladeshi Anti-Quota Movement suffered its first massive wave of brutal physical violence. This day marks the entry of the pro-government student wing, the Bangladesh Chhatra League (BCL), which launched sweeping, coordinated armed attacks against unarmed student protestors on university campuses across the country. This turned a peaceful student movement into a bloody, nationwide confrontation. [1, 2, 3, 4]</p>
                    
                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: var(--spacing-lg) 0;">

                    <h2>1. Chronological Breakdown of Events</h2>
                    
                    <h3>Morning (10:00 AM – 12:00 PM): Protests Mobilize Over the "Razakar" Insult</h3>
                    <ul>
                        <li><strong>The Gathering:</strong> Enraged by Prime Minister Sheikh Hasina's press conference remarks from the previous afternoon, thousands of students under the "Students Against Discrimination" banner gathered at the Raju Memorial Sculpture at Dhaka University (DU). [5, 6]</li>
                        <li><strong>Nationwide Solidarity:</strong> Similar large-scale protest rallies took shape simultaneously across other major campuses, including Jahangirnagar University (JU), Chittagong University (CU), and Rajshahi University (RU). [7, 8, 9]</li>
                        <li><strong>The Counter-Mobilization:</strong> At the same time, top leaders of the ruling Awami League and the BCL held high-level meetings. That time's Facist Government's Road, Bridge and Rail Transportation minister Obaidul Quader publicly stated that the students had crossed a line by chanting ironic "Razakar" slogans, declaring that the BCL would give a "fitting reply." [10]</li>
                    </ul>

                    <h3>Early Afternoon (1:30 PM – 3:30 PM): The Attack at Dhaka University Begins</h3>
                    <ul>
                        <li><strong>Armed Aggression:</strong> Around 1:30 PM, hundreds of BCL activists—many wearing helmets and armed with iron rods, hockey sticks, bamboo sticks, and leather belts—gathered near the Madhur Canteen and the TSC area of Dhaka University. Reports indicated that many attackers were political cadres brought in from outside the university to reinforce BCL ranks. [2, 11]</li>
                    </ul>
                    
                    <img src="./h.jpg" class="article-img" alt="Helmeted Attackers of TSC" onerror="this.style.display='none'">
                    
                    <ul>
                        <li><strong>The Clash Near TSC:</strong> BCL cadres launched a sudden, violent charge on the protesting students gathered near the Raju Memorial Sculpture. The peaceful assembly fractured as unarmed students scrambled for cover under a barrage of bricks and heavy clubbing. [2]</li>
                        <li><strong>Targeting Female Students:</strong> In full view of onlookers and journalists, BCL attackers pursued and brutally beat female protestors with sticks and rods. Several prominent female organizers were cornered, assaulted, and left bleeding on the campus roads. [2]</li>
                    </ul>

                    <img src="./f1.jpg" class="article-img" alt="Assault on Female Protestors" onerror="this.style.display='none'">
                    <img src="./f2.jpg" class="article-img" alt="Assault on Female Protestors 2" onerror="this.style.display='none'">

                    <h3>Late Afternoon (3:30 PM – 6:00 PM): The Siege of Shahidullah Hall and DMCH</h3>
                    <ul>
                        <li><strong>Shahidullah Hall Pitched Battle:</strong> The violence escalated into a grueling multi-hour battle at Dhaka University’s Shahidullah Hall and Dr. Muhammad Qudrat-e-Khuda Road. Cornered protestors retreated inside the hall compounds and attempted to defend themselves by hurling back bricks at the helmeted BCL cadres.</li>
                    </ul>

                    <img src="./s.jpg" class="article-img" alt="Shahidullah Hall Brick-Pelting" onerror="this.style.display='none'">

                    <ul>
                        <li><strong>Hospital Violence:</strong> As over 300 injured students were rushed to the Emergency Department of Dhaka Medical College Hospital (DMCH), BCL groups chased them inside the hospital gates. Attackers entered the emergency compound, vandalized ambulances, and beat injured students who were actively receiving medical treatment, sparking terror among doctors and nurses. [2, 12, 13, 14, 15]</li>
                    </ul>

                    <img src="./dmc.jpg" class="article-img" alt="Dhaka Medical College Chaos" onerror="this.style.display='none'">

                    <h3>Evening to Night: Nationwide Spreading and Midnight Siege at JU [16]</h3>
                    <ul>
                        <li><strong>Jahangirnagar University Escalation:</strong> News of the Dhaka University attacks triggered immediate outrage at Jahangirnagar University (JU) in Savar. In the evening, JU students took out large protest rallies.</li>
                        <li><strong>The Midnight Attack:</strong> Around midnight, the JU BCL branch, led by its local president, alongside external armed goons, launched an attack on the demonstrating students. Protestors, including female students and several university teachers who tried to protect them, were forced to take refuge inside the Vice-Chancellor’s residence as BCL cadres surrounded the building, throwing bricks and detonating crude bombs. [14, 17, 18, 19, 20]</li>
                    </ul>

        /**
         * ==========================================================================
         * CORE STATE AND RENDERING LOGIC
         * ==========================================================================
         */
        let currentLang = 'en'; // Default language

        function renderContent(lang) {
            const data = articleData[lang];
            
            // 1. Update DOM data attribute to enforce strict Font mapping
            document.body.setAttribute('data-lang', lang);
            
            // 2. Update UI Elements
            document.querySelector('#langToggleBtn .btn-text').textContent = data.ui.langToggle;
            document.getElementById('shareBtnText').textContent = data.ui.share;
            document.getElementById('printBtnText').textContent = data.ui.print;
            
            // Update Modal Texts
            document.getElementById('modalTitle').textContent = data.ui.modalTitle;
            document.getElementById('modalDesc').textContent = data.ui.modalDesc;
            document.getElementById('btnCancel').textContent = data.ui.btnCancel;
            document.getElementById('btnPrintEn').textContent = data.ui.btnPrintEn;
            document.getElementById('btnPrintBn').textContent = data.ui.btnPrintBn;
            document.getElementById('btnPrintBoth').textContent = data.ui.btnPrintBoth;

            // 3. Inject Article HTML
            document.getElementById('article-container').innerHTML = data.content;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'bn' : 'en';
            renderContent(currentLang);
        }

        function toggleMobileMenu() {
            document.body.classList.toggle('mobile-menu-active');
        }

        /**
         * ==========================================================================
         * SHARE LOGIC (Clipboard API)
         * ==========================================================================
         */
        function copyLink() {
            const copyUrl = "https://istiack.ami.bd/july-corner/15-july/";
            
            // Try modern clipboard API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(copyUrl).then(() => showToast());
            } else {
                // Fallback for older browsers or iframes
                let textArea = document.createElement("textarea");
                textArea.value = copyUrl;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                textArea.remove();
            }
        }

        function showToast() {
            const toast = document.getElementById('toastMsg');
            toast.textContent = articleData[currentLang].ui.copied;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        /**
         * ==========================================================================
         * ADVANCED PRINTING LOGIC (Modal + Language Override + Multi-lang Print)
         * ==========================================================================
         */
        const modal = document.getElementById('printModal');

        function openPrintModal() {
            modal.classList.add('active');
        }

        function closePrintModal() {
            modal.classList.remove('active');
        }

        // Close modal if clicked outside
        modal.addEventListener('click', function(e) {
            if(e.target === modal) {
                closePrintModal();
            }
        });

        function executePrint(format) {
            closePrintModal();
            const originalLang = currentLang;
            const container = document.getElementById('article-container');

            if (format === 'en' || format === 'bn') {
                // Single language print
                renderContent(format);
                
                // Allow DOM to update before printing
                setTimeout(() => {
                    window.print();
                    // Restore original state
                    renderContent(originalLang);
                }, 300);

            } else if (format === 'both') {
                // Render BOTH languages specifically for printing
                // Temporary print layout setup
                document.body.setAttribute('data-lang', 'both'); // Allows us to use inline fonts
                
                // Construct combined HTML with page breaks
                let combinedHTML = `
                    <div style="font-family: 'EnMain', sans-serif;">
                        ${articleData['en'].content}
                    </div>
                    <div class="page-break"></div>
                    <div style="font-family: 'BnMain', sans-serif;">
                        ${articleData['bn'].content}
                    </div>
                `;
                
                container.innerHTML = combinedHTML;
                
                setTimeout(() => {
                    window.print();
                    // Restore original state
                    renderContent(originalLang);
                }, 500);
            }
        }

        // Initialize application
        document.addEventListener('DOMContentLoaded', () => {
            renderContent(currentLang);
        });

    </script>
