<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <!-- SEO and Open Graph Meta Tags -->
    <title>July 9, 2024</title>
    <meta name="description" content="Detailed timeline and events of the Bangladesh Quota Reform Movement on July 9, 2024 - The Pause Before the Storm.">
    <meta property="og:title" content="July 9, 2024 - ISTIACK'S JULY CORNER">
    <meta property="og:description" content="Detailed timeline and events of the Bangladesh Quota Reform Movement on July 9, 2024.">
    <!-- Using the required local image for og:image -->
    <meta property="og:image" content="./t.png">
    <meta property="og:type" content="article">
    <meta property="article:published_time" content="2024-07-09T00:00:00Z">

    <!-- 
        ========================================================================
        STYLESHEET INJECTION
        ========================================================================
    -->
    <style>
        /* ========================================================================
         * 1. FONT DEFINITIONS (STRICT ASSET MANAGEMENT)
         * Enforcing the root folder .ttf files for English and Bangla.
         * ======================================================================== */
        @font-face {
            font-family: 'EnglishMain';
            src: url('/E1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'EnglishHeader';
            src: url('/E2.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaHeader';
            src: url('/B1.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaMain';
            src: url('/B2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ========================================================================
         * 2. CSS VARIABLES (DESIGN TOKENS)
         * Mobile-first pure article aesthetic. Minimalist, high contrast.
         * ======================================================================== */
        :root {
            /* Color Palette */
            --bg-color: #FAFAFA;
            --surface-color: #FFFFFF;
            --text-primary: #111111;
            --text-secondary: #333333;
            --text-muted: #666666;
            --border-color: #E5E7EB;
            --action-color: #000000;
            --action-hover: #444444;
            --modal-overlay: rgba(0, 0, 0, 0.7);
            
            /* Spacing System */
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-xxl: 3rem;
            
            /* Layout */
            --header-height: 75px;
            --max-content-width: 820px;
            --border-radius: 2px;
            --transition-speed: 0.3s;
        }

        /* Language Specific Font Variables (Controlled by JS) */
        html[lang="en"] {
            --font-primary: 'EnglishMain', sans-serif;
            --font-heading: 'EnglishHeader', serif;
            --line-height-body: 1.75;
            --letter-spacing: 0.015em;
        }

        html[lang="bn"] {
            --font-primary: 'BanglaMain', sans-serif;
            --font-heading: 'BanglaHeader', serif;
            --line-height-body: 1.85;
            --letter-spacing: 0em;
        }

        /* ========================================================================
         * 3. CSS RESET & GLOBAL STYLES
         * Ensuring every single letter is under font control.
         * ======================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-primary);
            font-size: 19px;
            line-height: var(--line-height-body);
            letter-spacing: var(--letter-spacing);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            padding-top: var(--header-height); /* Space for fixed header */
        }

        /* STRICT: Enforce fonts on form elements and buttons */
        button, input, select, textarea, span, a, p, div, h1, h2, h3, h4, li {
            font-family: inherit;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            color: var(--text-primary);
            margin-bottom: var(--spacing-md);
            margin-top: var(--spacing-xl);
            line-height: 1.3;
        }

        p {
            margin-bottom: var(--spacing-lg);
            color: var(--text-secondary);
        }

        ul, ol {
            margin-bottom: var(--spacing-lg);
            padding-left: var(--spacing-xl);
            color: var(--text-secondary);
        }

        li {
            margin-bottom: var(--spacing-sm);
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* STRICT: Ensure global links look like normal text as requested */
        .text-link {
            color: inherit;
            text-decoration: none;
            pointer-events: none; /* Disables clicking globally */
            word-break: break-all;
        }

        /* Exception explicitly requested for Coordinator wiki links */
        .active-link {
            color: #0000EE;
            text-decoration: underline;
            pointer-events: auto;
        }

        /* ========================================================================
         * 4. COMPONENT STYLES
         * ======================================================================== */

        /* Header (Fixed) */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--spacing-lg);
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .site-logo {
            height: 45px;
            width: auto;
            /* Requirement: Convert logo to black and white */
            filter: grayscale(100%) contrast(1.1);
            object-fit: contain;
        }

        .site-title {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-primary);
            line-height: 1;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            background-color: transparent;
            border: 1px solid var(--action-color);
            color: var(--action-color);
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background-color: var(--action-color);
            color: var(--surface-color);
        }

        .btn-lang {
            /* Ensure the font hierarchy overrides specifically for this button */
            font-family: var(--font-heading);
        }

        .btn-action {
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 0.9rem;
            border-color: var(--border-color);
            color: var(--text-secondary);
        }

        .btn-action:hover {
            background-color: var(--border-color);
            color: var(--text-primary);
        }
        
        .btn-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Mobile Menu Toggle (SVG Only) */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: var(--spacing-xs);
            color: var(--text-primary);
        }

        .menu-toggle svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        /* Main Content Layout */
        .main-content {
            width: 100%;
            max-width: var(--max-content-width);
            margin: 0 auto;
            background-color: var(--surface-color);
            min-height: calc(100vh - var(--header-height));
            box-shadow: 0 0 25px rgba(0,0,0,0.02);
        }

        /* Hero Image Container */
        .hero-section {
            width: 100%;
            border-bottom: 1px solid var(--border-color);
        }

        .hero-img {
            width: 100%;
            max-height: 550px;
            object-fit: cover;
            display: block;
        }

        /* Article Actions (Share/Print) */
        .article-actions {
            display: flex;
            justify-content: flex-end;
            gap: var(--spacing-md);
            padding: var(--spacing-md) var(--spacing-xl);
            border-bottom: 1px solid var(--border-color);
            background-color: var(--surface-color);
        }

        /* Article Body */
        .article-body {
            padding: var(--spacing-xl);
        }

        .article-title {
            font-size: 2.8rem;
            margin-top: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            text-align: left;
            line-height: 1.2;
        }

        .article-meta {
            text-align: left;
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: var(--spacing-xxl);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 3px solid var(--text-primary);
            padding-bottom: var(--spacing-md);
            display: block;
            width: 100%;
        }

        .content-section {
            margin-bottom: var(--spacing-xxl);
        }

        .content-section h2 {
            font-size: 1.9rem;
            border-left: 5px solid var(--text-primary);
            padding-left: var(--spacing-md);
        }

        .content-section h3 {
            font-size: 1.5rem;
            margin-top: var(--spacing-lg);
            color: var(--text-primary);
        }

        .divider {
            width: 100%;
            height: 1px;
            background-color: var(--border-color);
            margin: var(--spacing-xxl) 0;
        }

        /* Images inside Article */
        .in-article-image-container {
            margin: var(--spacing-xl) 0;
        }

        .in-article-img {
            width: 100%;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color); /* Fallback */
        }

        .image-context {
            margin-top: var(--spacing-sm);
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Special Grid for Coordinators (Must be side-by-side on mobile and PC) */
        .coordinator-grid {
            display: flex;
            flex-direction: row; /* Enforce side-by-side always */
            justify-content: space-between;
            gap: var(--spacing-sm);
            margin: var(--spacing-xl) 0;
        }

        .coordinator-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .coordinator-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border: 1px solid var(--border-color);
            margin-bottom: var(--spacing-sm);
        }

        .coordinator-card a {
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* Sources Section */
        .source-links {
            background-color: var(--bg-color);
            padding: var(--spacing-xl);
            border-top: 2px solid var(--border-color);
            margin-top: var(--spacing-xxl);
        }

        .source-links h2 {
            font-size: 1.5rem;
            border-left: none;
            padding-left: 0;
            margin-bottom: var(--spacing-md);
        }

        .source-links p {
            margin-bottom: var(--spacing-sm);
            font-size: 0.9rem;
            word-wrap: break-word;
            color: var(--text-muted);
        }

        /* ========================================================================
         * 5. MODALS AND TOASTS
         * ======================================================================== */
        
        /* Print Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-speed) ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--surface-color);
            padding: var(--spacing-xxl);
            border-radius: var(--border-radius);
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            transform: translateY(30px);
            transition: transform var(--transition-speed) ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            margin-top: 0;
            font-size: 1.6rem;
            margin-bottom: var(--spacing-xl);
            color: var(--text-primary);
        }

        .modal-options {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .modal-btn {
            width: 100%;
            padding: var(--spacing-md);
            background-color: var(--surface-color);
            border: 2px solid var(--text-primary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .modal-btn:hover {
            background-color: var(--text-primary);
            color: var(--surface-color);
        }

        .modal-close {
            margin-top: var(--spacing-xl);
            background: none;
            border: none;
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(150px);
            background-color: var(--text-primary);
            color: var(--surface-color);
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            z-index: 3000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toast.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ========================================================================
         * 6. RESPONSIVE DESIGN (MOBILE FIRST EXTENSIONS)
         * ======================================================================== */
        @media (max-width: 768px) {
            :root {
                --header-height: 65px;
            }

            .site-title {
                font-size: 1.1rem;
            }
            
            .header-right .btn-lang {
                display: none; /* Hide button on mobile header, show in mobile nav */
            }

            .menu-toggle {
                display: block;
            }

            /* Mobile Navigation Drawer */
            .mobile-nav {
                position: fixed;
                top: var(--header-height);
                right: -100%;
                width: 280px;
                height: calc(100vh - var(--header-height));
                background-color: var(--surface-color);
                border-left: 1px solid var(--border-color);
                transition: right var(--transition-speed) ease;
                display: flex;
                flex-direction: column;
                padding: var(--spacing-xl);
                z-index: 999;
                box-shadow: -10px 0 20px rgba(0,0,0,0.05);
            }

            .mobile-nav.active {
                right: 0;
            }

            .mobile-nav .btn-lang {
                display: block;
                width: 100%;
                text-align: center;
                margin-top: var(--spacing-md);
                padding: var(--spacing-md);
            }
            
            .article-title {
                font-size: 2.2rem;
            }
            
            .article-body {
                padding: var(--spacing-lg);
            }

            .coordinator-card a {
                font-size: 0.75rem; /* Slightly smaller text for side-by-side mobile */
            }
        }

        /* ========================================================================
         * 7. ADVANCED PRINT STYLES
         * Crucial for physical paper output. Optimizes colors and enforces typography.
         * ======================================================================== */
        @media print {
            /* Reset colors for absolute printer economy (B&W) */
            body {
                background: #FFFFFF !important;
                color: #000000 !important;
                padding-top: 0 !important;
            }

            /* Hide UI Elements completely */
            .site-header,
            .article-actions,
            .modal-overlay,
            .toast,
            .mobile-nav {
                display: none !important;
            }

            /* Ensure main content takes full width without shadow */
            .main-content {
                box-shadow: none !important;
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                border: none !important;
            }

            .article-body {
                padding: 0 !important;
            }

            /* Typography Adjustments for Print - Enforcing visibility */
            h1, h2, h3, h4, p, li, span, div {
                color: #000000 !important;
                page-break-inside: avoid;
            }
            
            h2 {
                border-left-color: #000000 !important;
            }

            .article-meta {
                border-bottom-color: #000000 !important;
                color: #333333 !important;
            }

            /* Image Handling for Print (All images preserved as requested) */
            img {
                max-width: 100% !important;
                height: auto !important;
                page-break-inside: avoid;
            }

            .hero-img, .in-article-img, .coordinator-grid {
                page-break-inside: avoid;
                break-inside: avoid;
            }
            
            /* Page break controller for "Both" language print mode */
            .print-page-break {
                page-break-before: always;
                display: block;
                height: 1px; 
            }
            
            /* Ensure background colors and font specificities are forced */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
        
        /* Utility class for the JS print engine (Invisible on screen) */
        .print-only-container {
            display: none;
        }
        
        /* Swaps display logic during window.print() execution */
        @media print {
            .screen-only-when-printing {
                display: none !important;
            }
            .print-only-container {
                display: block !important;
            }
        }
    </style>
</head>
<body>

    <!-- 
        ========================================================================
        HEADER & NAVIGATION
        ========================================================================
    -->
    <header class="site-header" id="siteHeader">
        <div class="header-left">
            <!-- Requirement: /home.png as logo, B&W filter applied via CSS -->
            <img src="/home.png" alt="Logo" class="site-logo" id="siteLogo" onerror="this.style.display='none'">
            <span class="site-title" id="newspaperName">ISTIACK'S JULY CORNER</span>
        </div>
        
        <div class="header-right">
            <!-- Language Toggle Desktop -->
            <button class="btn btn-lang" id="langToggleDesktop" aria-label="Toggle Language" onclick="toggleLanguage()">
                বাংলায় পড়ুন
            </button>
            
            <!-- Hamburger Menu (SVG Only - No Emojis) -->
            <button class="menu-toggle" id="menuToggle" aria-label="Open Menu">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Mobile Navigation Drawer -->
    <nav class="mobile-nav" id="mobileNav">
        <!-- Language Toggle Mobile -->
        <button class="btn btn-lang" id="langToggleMobile" aria-label="Toggle Language" onclick="toggleLanguage()">
            বাংলায় পড়ুন
        </button>
    </nav>

    <!-- 
        ========================================================================
        MAIN ARTICLE CONTENT AREA
        ========================================================================
    -->
    <main class="main-content" id="mainContent">
        
        <!-- Hero Section -->
        <section class="hero-section">
            <!-- Requirement: ./t.png without caption -->
            <img src="./t.png" alt="" aria-hidden="true" class="hero-img" onerror="this.style.display='none'">
        </section>

        <!-- Action Bar (Under image, before content) -->
        <div class="article-actions">
            <button class="btn btn-action" onclick="copyShareLink()" aria-label="Share Link">
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/>
                </svg>
                <span id="lblShare">Share</span>
            </button>
            <button class="btn btn-action" onclick="openPrintModal()" aria-label="Print Article">
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
                </svg>
                <span id="lblPrint">Print</span>
            </button>
        </div>

        <!-- Dynamic Article Container (Populated entirely by Vanilla JS engine) -->
        <article class="article-body" id="articleBody">
            <!-- Content Injected Here -->
        </article>

    </main>

    <!-- 
        ========================================================================
        HIDDEN PRINT ENGINE CONTAINER
        ========================================================================
        Used solely for assembling the DOM structure required for dual-language 
        printing without disrupting the current screen UI state.
    -->
    <div id="printEngine" class="print-only-container" aria-hidden="true"></div>

    <!-- 
        ========================================================================
        UI OVERLAYS (MODALS & TOASTS)
        ========================================================================
    -->
    
    <!-- Print Configuration Modal -->
    <div class="modal-overlay" id="printModal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <h3 class="modal-title" id="printModalTitle">Select Print Language</h3>
            <div class="modal-options">
                <button class="modal-btn" onclick="executePrint('en')" id="printOptEn">English Only</button>
                <button class="modal-btn" onclick="executePrint('bn')" id="printOptBn">Bangla Only</button>
                <button class="modal-btn" onclick="executePrint('both')" id="printOptBoth">Both (English & Bangla)</button>
            </div>
            <button class="modal-close" onclick="closePrintModal()" id="printModalClose">Cancel</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toastMessage" role="alert">
        Link Copied!
    </div>

    <!-- 
        ========================================================================
        JAVASCRIPT APPLICATION LOGIC
        ========================================================================
    -->
    <script>
        /**
         * 1. CONTENT DATA STRUCTURE (JSON-LIKE OBJECT)
         * State management for bilingual content. 
         * Addresses requirements: Links are text-only globally EXCEPT for coordinators.
         * Images do not use HTML caption elements, just adjacent text rendering.
         */
        const articleData = {
            en: {
                meta: {
                    langBtnText: "বাংলায় পড়ুন", // English UI shows toggle for Bangla
                    newspaperName: "ISTIACK'S JULY CORNER",
                    shareBtn: "Share",
                    printBtn: "Print",
                    printModalTitle: "Select Print Language",
                    printEn: "English Only",
                    printBn: "Bangla Only",
                    printBoth: "Both (English & Bangla)",
                    printCancel: "Cancel",
                    toastMsg: "Link Copied!"

                if (section.list) {
                    html += `<ul>`;
                    section.list.forEach(item => { html += `<li>${item}</li>`; });
                    html += `</ul>`;
                }

                if (section.subsections) {
                    section.subsections.forEach(sub => {
                        html += `<h3>${sub.subtitle}</h3><ul>`;
                        sub.list.forEach(item => { html += `<li>${item}</li>`; });
                        html += `</ul>`;
                    });
                }
                html += `</section>`;
            });

            // Render Visuals (Images and Context)
            if(data.visuals && data.visuals.length > 0) {
                html += `<div class="divider"></div>`;
                data.visuals.forEach(vis => {
                    if (vis.type === "single") {
                        // Regular single image. NO <figcaption> used.
                        html += `
                        <div class="in-article-image-container">
                            <img src="${vis.src}" alt="" class="in-article-img" onerror="this.style.display='none'">
                            <div class="image-context">${vis.contextText}</div>
                        </div>`;
                    } else if (vis.type === "coordinators-grid") {
                        // Specific side-by-side grid, explicitly active anchor links applied to names
                        html += `<div class="coordinator-grid">`;
                        vis.items.forEach(person => {
                            html += `
                            <div class="coordinator-card">
                                <img src="${person.src}" alt="${person.name}" onerror="this.style.display='none'">
                                <a href="${person.url}" target="_blank" rel="noopener noreferrer" class="active-link">${person.name}</a>
                            </div>`;
                        });
                        html += `</div>`;
                    }
                });
            }

            // Sources block (Enforcing raw text, no hyperlinks globally)
            html += `
                <div class="source-links">
                    <h2>${data.sourcesTitle}</h2>
                    <p><em>${data.sourcesIntro}</em></p>
                    <br>
            `;
            data.sources.forEach(src => {
                html += `<p class="text-link">${src}</p>`;
            });
            html += `</div>`;

            return html;
        }

        /**
         * Applies the selected language to the UI and updates the DOM.
         */
        function applyLanguage(lang) {
            htmlElement.setAttribute('lang', lang);
            const meta = articleData[lang].meta;

            newspaperNameEl.textContent = meta.newspaperName;
            langToggleDesktop.textContent = meta.langBtnText;
            langToggleMobile.textContent = meta.langBtnText;
            lblShare.textContent = meta.shareBtn;
            lblPrint.textContent = meta.printBtn;
            
            printModalTitle.textContent = meta.printModalTitle;
            printOptEn.textContent = meta.printEn;
            printOptBn.textContent = meta.printBn;
            printOptBoth.textContent = meta.printBoth;
            printModalClose.textContent = meta.printCancel;
            
            articleBody.innerHTML = buildArticleHTML(lang);
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'bn' : 'en';
            applyLanguage(currentLang);
            if(mobileNav.classList.contains('active')) toggleMobileMenu();
        }

        /**
         * 5. SHARE LOGIC (Strict canonical URL binding)
         */
        function copyShareLink() {
            const canonicalUrl = "https://istiack.ami.bd/july-corner/9-july/";

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(canonicalUrl).then(() => showToast());
            } else {
                let textArea = document.createElement("textarea");
                textArea.value = canonicalUrl;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('Copy failed', err);
                }
                document.body.removeChild(textArea);
            }
        }

        function showToast() {
            const toast = document.getElementById('toastMessage');
            toast.textContent = articleData[currentLang].meta.toastMsg;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 3500);
        }

        /**
         * 6. ADVANCED PRINTING LOGIC
         */
        const printModal = document.getElementById('printModal');

        function openPrintModal() {
            printModal.classList.add('active');
        }

        function closePrintModal() {
            printModal.classList.remove('active');
        }

        function executePrint(mode) {
            closePrintModal();
            
            if (mode === 'en' || mode === 'bn') {
                // Single language print
                const prevLang = currentLang;
                if (currentLang !== mode) applyLanguage(mode); 
                
                setTimeout(() => {
                    window.print();
                    if (prevLang !== mode) applyLanguage(prevLang);
                }, 150);
            } else if (mode === 'both') {
                // Dual language shadow rendering
                mainContent.classList.add('screen-only-when-printing');
                
                let combinedHTML = `
                    <div lang="en" style="font-family: 'EnglishMain', sans-serif;">
                        <h2 style="font-family: 'EnglishHeader', serif; text-align: left; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px;">
                            ${articleData.en.meta.newspaperName}
                        </h2>
                        ${buildArticleHTML('en')}
                    </div>
                    <div class="print-page-break"></div>
                    <div lang="bn" style="font-family: 'BanglaMain', sans-serif;">
                        <h2 style="font-family: 'BanglaHeader', serif; text-align: left; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px;">
                            ${articleData.bn.meta.newspaperName}
                        </h2>
                        ${buildArticleHTML('bn')}
                    </div>
                `;
                
                printEngine.innerHTML = combinedHTML;
                
                setTimeout(() => {
                    window.print();
                    setTimeout(() => {
                        mainContent.classList.remove('screen-only-when-printing');
                        printEngine.innerHTML = ''; 
                    }, 500);
                }, 150);
            }
        }

        /**
         * 7. MOBILE MENU LOGIC
         */
        function toggleMobileMenu() {
            mobileNav.classList.toggle('active');
        }

        menuToggle.addEventListener('click', toggleMobileMenu);

        document.addEventListener('click', function(event) {
            const isClickInside = siteHeader.contains(event.target) || mobileNav.contains(event.target);
            if (!isClickInside && mobileNav.classList.contains('active')) {
                toggleMobileMenu();
            }
        });

        // Hide header on scroll down, show on scroll up
        let lastScrollTop = 0;
        const siteHeader = document.getElementById('siteHeader');
        
        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                siteHeader.style.transform = `translateY(-${getComputedStyle(document.documentElement).getPropertyValue('--header-height')})`;
            } else {
                siteHeader.style.transform = 'translateY(0)';
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; 
        }, false);

        /**
         * 8. BOOTSTRAP
         */
        window.addEventListener('DOMContentLoaded', () => {
            applyLanguage(currentLang);
        });
    </script>
</body>
</html>
