    <style>
        /* ==========================================================================
           1. CSS VARIABLES & THEME
           ========================================================================== */
        :root {
            /* Colors - Pure Article Aesthetic */
            --color-bg: #ffffff;
            --color-text-main: #1a1a1a;
            --color-text-muted: #555555;
            --color-border: #e0e0e0;
            --color-header-bg: rgba(255, 255, 255, 0.98);
            --color-accent: #000000;
            --color-danger: #d93025;
            --color-hover-bg: #f5f5f5;
            
            /* Spacing & Layout */
            --max-width-content: 800px;
            --header-height: 70px;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
            
            /* Typography Variables (Populated by @font-face) */
            --font-en-main: 'EnMain', sans-serif;
            --font-en-header: 'EnHeader', serif;
            --font-bn-main: 'BnMain', sans-serif;
            --font-bn-header: 'BnHeader', serif;
            
            /* Active Fonts (Changed via JS/Body classes) */
            --active-font-main: var(--font-en-main);
            --active-font-header: var(--font-en-header);

            /* Transitions */
            --trans-default: 0.3s ease;
        }

        /* Language Toggle Classes */
        body.lang-en {
            --active-font-main: var(--font-en-main);
            --active-font-header: var(--font-en-header);
        }

        body.lang-bn {
            --active-font-main: var(--font-bn-main);
            --active-font-header: var(--font-bn-header);
        }

        /* ==========================================================================
           2. FONT DEFINITIONS (Strict Asset Management)
           ========================================================================== */
        @font-face {
            font-family: 'EnMain';
            src: url('/E1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'EnHeader';
            src: url('/E2.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'BnHeader';
            src: url('/B1.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'BnMain';
            src: url('/B2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ==========================================================================
           3. RESET & BASE STYLES
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* STRICT REQUIREMENT: Every letter under control of the fonts */
            font-family: var(--active-font-main);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text-main);
            line-height: 1.7;
            font-size: 18px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-top: var(--header-height);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--active-font-header);
            line-height: 1.3;
            margin-bottom: var(--spacing-md);
            color: var(--color-accent);
        }

        button, input, textarea, select {
            font-family: var(--active-font-main);
            font-size: inherit;
        }

        img, video, svg {
            display: block;
            max-width: 100%;
            height: auto;
        }

        ul, ol {
            padding-left: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }

        li {
            margin-bottom: var(--spacing-sm);
        }

        p {
            margin-bottom: var(--spacing-md);
        }

        /* URLs presented as text (No hyperlinks) */
        .url-text {
            color: var(--color-text-muted);
            word-break: break-all;
            font-size: 0.9em;
        }

        /* ==========================================================================
           4. LAYOUT COMPONENTS
           ========================================================================== */
        
        /* HEADER */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background-color: var(--color-header-bg);
            border-bottom: 1px solid var(--color-border);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--spacing-md);
            backdrop-filter: blur(10px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .site-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            filter: grayscale(100%);
            transition: filter var(--trans-default);
            cursor: pointer;
        }

        .site-logo:hover {
            filter: grayscale(0%);
        }

        .newspaper-name {
            font-family: var(--active-font-header);
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* LANGUAGE SWITCHER */
        .header-right {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .lang-switch-btn {
            background: none;
            border: 1px solid var(--color-border);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all var(--trans-default);
            background-color: var(--color-bg);
            color: var(--color-text-main);
        }

        .lang-switch-btn:hover {
            background-color: var(--color-hover-bg);
            border-color: var(--color-accent);
        }

        /* HAMBURGER MENU (Mobile Only) */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
        }

        /* MAIN CONTENT AREA */
        .main-container {
            max-width: var(--max-width-content);
            margin: 0 auto;
            padding: var(--spacing-xl) var(--spacing-md);
        }

        .hero-image {
            width: 100%;
            border-radius: 4px;
            margin-bottom: var(--spacing-lg);
            background-color: var(--color-hover-bg); /* Placeholder bg */
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        /* ACTION BAR (Share & Print) */
        .action-bar {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            border-top: 1px solid var(--color-border);
            border-bottom: 1px solid var(--color-border);
            padding: var(--spacing-sm) 0;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-text-muted);
            font-weight: bold;
            transition: color var(--trans-default);
            padding: 0.5rem;
            border-radius: 4px;
        }

        .action-btn:hover {
            color: var(--color-accent);
            background-color: var(--color-hover-bg);
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* ARTICLE CONTENT */
        .article-title {
            font-size: 2.5rem;
            margin-bottom: var(--spacing-md);
        }

        .article-body h2 {
            font-size: 1.8rem;
            margin-top: var(--spacing-xl);
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--color-accent);
        }

        .article-body ul {
            list-style-type: square;
        }
        
        .inline-image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin: var(--spacing-lg) 0;
        }

        .inline-image-grid img {
            width: 100%;
            border-radius: 4px;
            border: 1px solid var(--color-border);
        }
        
        .inline-image-single {
            margin: var(--spacing-lg) 0;
            border-radius: 4px;
            border: 1px solid var(--color-border);
        }

        /* VIDEO TRIGGER BUTTON */
        .video-trigger-wrapper {
            margin: var(--spacing-lg) 0;
            padding: var(--spacing-lg);
            background-color: #fff5f5;
            border-left: 4px solid var(--color-danger);
            border-radius: 0 4px 4px 0;
        }

        .video-btn {
            background-color: var(--color-danger);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: opacity var(--trans-default);
        }

        .video-btn:hover {
            opacity: 0.9;
        }

        /* MODALS (Print Choice & Video) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all var(--trans-default);
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--color-bg);
            padding: var(--spacing-xl);
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-text-muted);
        }

        .modal-close:hover {
            color: var(--color-danger);
        }

        .print-options {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }

        .print-btn-option {
            background-color: var(--color-hover-bg);
            border: 1px solid var(--color-border);
            padding: 1rem;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all var(--trans-default);
        }

        .print-btn-option:hover {
            background-color: var(--color-accent);
            color: var(--color-bg);
        }

        /* VIDEO MODAL SPECIFIC */
        .video-modal-content {
            max-width: 800px;
            background: #000;
            padding: 0;
            overflow: hidden;
        }

        .video-modal-content .modal-close {
            color: white;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            padding: 5px;
            top: 10px;
            right: 10px;
        }

        .video-player {
            width: 100%;
            max-height: 80vh;
            display: block;
        }

        /* TOAST NOTIFICATION */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--color-accent);
            color: var(--color-bg);
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            font-weight: bold;
            opacity: 0;
            visibility: hidden;
            transition: all var(--trans-default);
            z-index: 3000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        /* ==========================================================================
           5. DUAL RENDER ENGINE CONTAINERS
           ========================================================================== */
        #content-en, #content-bn {
            display: none;
        }
        
        #content-en.active, #content-bn.active {
            display: block;
        }

        /* ==========================================================================
           6. RESPONSIVE DESIGN (Mobile First adapted for Desktop)
           ========================================================================== */
        @media (max-width: 768px) {
            .newspaper-name {
                font-size: 1rem;
            }
            .header-right .lang-text {
                display: none;
            }
            .header-right .lang-switch-btn {
                padding: 0.4rem;
                border-radius: 50%;
            }
            .article-title {
                font-size: 2rem;
            }
            .inline-image-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .newspaper-name {
                display: none;
            }
            .menu-toggle {
                display: block;
                color: var(--color-accent);
            }
            .action-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        /* ==========================================================================
           7. ADVANCED PRINT CSS
           ========================================================================== */
        @media print {
            /* Force exact font rendering and background graphics */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color: #000 !important; /* Force black text */
            }

            body {
                background: none !important;
                padding-top: 0 !important;
                font-size: 12pt !important;
            }

            /* Hide interactive UI elements */
            .site-header, 
            .action-bar, 
            .video-trigger-wrapper, 
            .modal-overlay, 
            .toast {
                display: none !important;
            }

            .main-container {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .hero-image {
                margin-bottom: 20px !important;
                page-break-after: avoid;
            }

            h1, h2 {
                page-break-after: avoid;
                color: #000 !important;
            }
            
            p, li {
                page-break-inside: avoid;
            }

            img {
                max-width: 100% !important;
                page-break-inside: avoid;
                border: none !important;
            }

            .inline-image-grid {
                display: flex !important;
                gap: 10px !important;
            }

            .inline-image-grid img {
                width: 48% !important;
            }

            /* Print Both Logic */
            body.print-both #content-en,
            body.print-both #content-bn {
                display: block !important;
            }

            body.print-both #content-bn {
                page-break-before: always;
            }
            
            /* Apply specific fonts during print based on body class */
            body.print-en * {
                font-family: 'EnMain', sans-serif !important;
            }
            body.print-en h1, body.print-en h2 {
                font-family: 'EnHeader', serif !important;
            }

            body.print-bn * {
                font-family: 'BnMain', sans-serif !important;
            }
            body.print-bn h1, body.print-bn h2 {
                font-family: 'BnHeader', serif !important;
            }
            
            /* URLs Styling for Print */
            .url-text {
                font-family: monospace !important;
                font-size: 10pt !important;
            }
        }
    </style>
</head>

                            text: "[১] <span class='url-text'>https://journals.sagepub.com/doi/10.1177/13582291261424344</span><br>[২] <span class='url-text'>https://dailyasianage.com/news/340160/abu-sayeeds-killing-triggered-mass-uprising</span><br>[৩] <span class='url-text'>https://www.thedailystar.net/news/bangladesh/news/july-16-2024-nationwide-mayhem-leaves-6-dead-3940681</span><br>[৪] <span class='url-text'>https://www.facebook.com/DailyStarNews/posts/the-july-that-rocked-bangladeshaugust-4-2024-marked-the-deadliest-day-of-banglad/1094363242844954/</span><br>[৫] <span class='url-text'>https://www.bbc.com/news/articles/c720lzejzwpo</span><br>[৬] <span class='url-text'>https://www.amnesty.org/en/latest/news/2024/07/what-is-happening-at-the-quota-reform-protests-in-bangladesh/</span><br>[৭] <span class='url-text'>https://www.thedailystar.net/news/bangladesh/news/honours-exam-abu-sayed-secures-14th-spot-among-69-students-3731951</span><br>[৮] <span class='url-text'>https://en.wikipedia.org/wiki/July_massacre</span><br>[৯] <span class='url-text'>https://www.bssnews.net/news-flash/292416</span><br>[১০] <span class='url-text'>https://www.amnesty.org/en/latest/news/2024/07/what-is-happening-at-the-quota-reform-protests-in-bangladesh/</span><br>[১১] <span class='url-text'>https://www.youtube.com/watch?v=mCzO5P7v9mc</span><br>[১২] <span class='url-text'>https://www.aa.com.tr/en/asia-pacific/hundreds-of-students-in-bangladesh-injured-in-protests-over-gov-t-job-quotas/3276313</span><br>[১৩] <span class='url-text'>https://www.sciencedirect.com/science/article/pii/S2590051X26000092</span><br>[১৪] <span class='url-text'>https://muse.jhu.edu/article/947884</span><br>[১৫] <span class='url-text'>https://www.dhakatribune.com/bangladesh/386502/july-16-abu-sayed%E2%80%99s-killing-sparks-nationwide</span>"
                        }
                    ]
                }
            }
        };

        /**
         * 2. HTML GENERATOR ENGINE
         * Parses the JSON blocks and builds raw HTML strings.
         */
        function generateHTML(contentObj) {
            let html = `<h1 class="article-title">${contentObj.title}</h1>`;
            
            contentObj.blocks.forEach(block => {
                switch(block.type) {
                    case 'paragraph':
                        html += `<p>${block.text}</p>`;
                        break;
                    case 'heading':
                        html += `<h2>${block.text}</h2>`;
                        break;
                    case 'list':
                        html += `<ul>`;
                        block.items.forEach(item => {
                            html += `<li>${item}</li>`;
                        });
                        html += `</ul>`;
                        break;
                    case 'image':
                        // Fallback hidden if image is missing to maintain strict UI
                        html += `<img src="${block.src}" alt="Article Image" class="inline-image-single" onerror="this.style.display='none'">`;
                        break;
                    case 'image-grid':
                        html += `<div class="inline-image-grid">`;
                        block.images.forEach(img => {
                            html += `<img src="${img.src}" alt="Article Image" onerror="this.style.display='none'">`;
                        });
                        html += `</div>`;
                        break;
                    case 'video-trigger':
                        // The button triggers the modal logic instead of putting video inline directly.
                        html += `
                        <div class="video-trigger-wrapper">
                            <button class="video-btn" onclick="openVideoModal('${block.src}')">
                                ${block.icon}
                                ${block.btnText}
                            </button>
                        </div>`;
                        break;
                }
            });
            return html;
        }

        /**
         * 3. INITIALIZATION & UI BINDING
         */
        document.addEventListener("DOMContentLoaded", () => {
            
            // DOM Elements Cache
            const body = document.getElementById('appBody');
            const contentEn = document.getElementById('content-en');
            const contentBn = document.getElementById('content-bn');
            
            const langToggleBtn = document.getElementById('langToggleBtn');
            const langBtnText = document.getElementById('langBtnText');
            const shareBtn = document.getElementById('shareBtn');
            const shareBtnText = document.getElementById('shareBtnText');
            const printTriggerBtn = document.getElementById('printTriggerBtn');
            const printBtnText = document.getElementById('printBtnText');
            const toastMsg = document.getElementById('toastMsg');
            
            // Modals Elements
            const printModal = document.getElementById('printModal');
            const videoModal = document.getElementById('videoModal');
            const printModalTitle = document.getElementById('printModalTitle');
            const printOptEn = document.getElementById('printOptEn');
            const printOptBn = document.getElementById('printOptBn');
            const printOptBoth = document.getElementById('printOptBoth');
            
            // Pre-render both DOMs to allow for "Print Both" feature
            contentEn.innerHTML = generateHTML(articleData.en.content);
            contentBn.innerHTML = generateHTML(articleData.bn.content);

            // Function to apply UI text based on language
            const updateUI = (lang) => {
                const uiData = articleData[lang].ui;
                langBtnText.textContent = uiData.langBtn;
                shareBtnText.textContent = uiData.shareBtn;
                printBtnText.textContent = uiData.printBtn;
                printModalTitle.textContent = uiData.printModalTitle;
                printOptEn.textContent = uiData.printOptEn;
                printOptBn.textContent = uiData.printOptBn;
                printOptBoth.textContent = uiData.printOptBoth;
                
                // Toggle active content container
                if(lang === 'en') {
                    contentEn.classList.add('active');
                    contentBn.classList.remove('active');
                    body.className = 'lang-en'; // Applies strict typography variables
                } else {
                    contentBn.classList.add('active');
                    contentEn.classList.remove('active');
                    body.className = 'lang-bn';
                }
                
                AppConfig.currentLang = lang;
            };

            // Initialize default UI
            updateUI(AppConfig.currentLang);

            // ----------------------------------------------------
            // EVENT LISTENERS
            // ----------------------------------------------------

            // Language Toggle
            langToggleBtn.addEventListener('click', () => {
                const nextLang = AppConfig.currentLang === 'en' ? 'bn' : 'en';
                updateUI(nextLang);
            });

            // Share Feature (Strict canonical copy requirement)
            shareBtn.addEventListener('click', () => {
                // Clipboard API fallback logic (execCommand handled inside fallback)
                const textToCopy = AppConfig.shareUrl;
                
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        showToast();
                    });
                } else {
                    // Fallback for non-https/iframe contexts
                    let textArea = document.createElement("textarea");
                    textArea.value = textToCopy;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-999999px";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        showToast();
                    } catch (err) {
                        console.error('Fallback: Oops, unable to copy', err);
                    }
                    textArea.remove();
                }
            });

            const showToast = () => {
                toastMsg.textContent = articleData[AppConfig.currentLang].ui.toastSuccess;
                toastMsg.classList.add('show');
                setTimeout(() => {
                    toastMsg.classList.remove('show');
                }, 3000);
            };

            // Print Modal Management
            printTriggerBtn.addEventListener('click', () => {
                printModal.classList.add('active');
            });

            document.getElementById('closePrintModal').addEventListener('click', () => {
                printModal.classList.remove('active');
            });

            // Handle Print Selection Logic
            const executePrint = (mode) => {
                // 1. Close Modal
                printModal.classList.remove('active');
                
                // 2. Prepare DOM based on mode (en, bn, both)
                const originalClass = body.className;
                
                // Clear any previous print classes
                body.classList.remove('print-en', 'print-bn', 'print-both');
                
                if (mode === 'both') {
                    body.classList.add('print-both');
                    // Ensure fonts fall back nicely when both are present
                } else {
                    body.classList.add(`print-${mode}`);
                    // Ensure the selected language is currently visible on screen before print
                    if(AppConfig.currentLang !== mode) {
                        updateUI(mode);
                    }
                }

                // 3. Trigger Print (Small timeout to let DOM render)
                setTimeout(() => {
                    window.print();
                    
                    // 4. Revert state after print dialogue is closed
                    body.className = originalClass; 
                    updateUI(AppConfig.currentLang); // Ensure UI matches the original class
                }, 100);
            };

            printOptEn.addEventListener('click', () => executePrint('en'));
            printOptBn.addEventListener('click', () => executePrint('bn'));
            printOptBoth.addEventListener('click', () => executePrint('both'));

            // Video Modal Management
            // The function openVideoModal is bound globally so the inline HTML button can trigger it
            window.openVideoModal = (src) => {
                const container = document.getElementById('videoContainer');
                container.innerHTML = `
                    <video class="video-player" controls autoplay>
                        <source src="${src}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>`;
                videoModal.classList.add('active');
            };

            document.getElementById('closeVideoModal').addEventListener('click', () => {
                const container = document.getElementById('videoContainer');
                container.innerHTML = ''; // Destroy video instance to stop playback & save resources
                videoModal.classList.remove('active');
            });

            // Close modals on outside click
            window.addEventListener('click', (e) => {
                if (e.target === printModal) printModal.classList.remove('active');
                if (e.target === videoModal) {
                    document.getElementById('videoContainer').innerHTML = '';
                    videoModal.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
