        /* ==========================================================================
           1. FONT DEFINITIONS (Strict Pathing from Root)
           ========================================================================== */
        @font-face {

        /* ==========================================================================
           2. CSS VARIABLES (Design System)
           ========================================================================== */
        :root {
            --bg-color: #FAFAFA;
            --text-color-main: #1A1A1A;
            --text-color-muted: #555555;
            --border-color: #E0E0E0;
            --brand-color: #000000;
            --header-bg: #FFFFFF;
            --action-bg: #F0F0F0;
            --action-hover: #E5E5E5;
            --overlay-bg: rgba(0, 0, 0, 0.6);
            --modal-bg: #FFFFFF;
            
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2.5rem;
            --spacing-xl: 4rem;
            
            --max-content-width: 800px;
            --header-height: 70px;
            
            --radius-sm: 4px;
            --radius-md: 8px;
            
            --transition-speed: 0.3s;
        }

        /* ==========================================================================
           3. RESET & UNIVERSAL FONT CONTROL (Strict)
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* English Font Mapping */
        html[lang="en"] * {
            font-family: 'EnglishMain', sans-serif !important;
        }
        
        html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] h3, 
        html[lang="en"] h4, html[lang="en"] h5, html[lang="en"] h6,
        html[lang="en"] .newspaper-name, html[lang="en"] .btn, 
        html[lang="en"] .modal-title, html[lang="en"] strong, html[lang="en"] b {
            font-family: 'EnglishHeader', sans-serif !important;
        }

        /* Bangla Font Mapping */
        html[lang="bn"] * {
            font-family: 'BanglaMain', sans-serif !important;
        }
        
        html[lang="bn"] h1, html[lang="bn"] h2, html[lang="bn"] h3, 
        html[lang="bn"] h4, html[lang="bn"] h5, html[lang="bn"] h6,
        html[lang="bn"] .newspaper-name, html[lang="bn"] .btn, 
        html[lang="bn"] .modal-title, html[lang="bn"] strong, html[lang="bn"] b {
            font-family: 'BanglaHeader', sans-serif !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-top: var(--header-height);
            overflow-x: hidden;
        }

        /* ==========================================================================
           4. LAYOUT & UI COMPONENTS
           ========================================================================== */
        
        /* --- Fixed Header --- */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--spacing-sm);
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .logo {

            width: auto;

        }

        .newspaper-name {

            letter-spacing: 1px;
            color: var(--brand-color);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .lang-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--header-bg);
            color: var(--text-color-main);
            transition: background var(--transition-speed);
            font-size: 0.9rem;
        }

        .lang-toggle-btn:hover {
            background-color: var(--action-bg);
        }

        .svg-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: var(--text-color-main);
        }

        /* --- Main Content --- */

            max-width: 100%;
            margin: 0 auto;
            padding-bottom: var(--spacing-xl);

            height: auto;
            display: block;
            object-fit: cover;
            max-height: 60vh;
        }

            max-width: var(--max-content-width);
            margin: var(--spacing-sm) auto;
            padding: 0 var(--spacing-sm);
            display: flex;
            justify-content: flex-end;
            gap: var(--spacing-sm);
        }

        .action-btn {
            background-color: var(--action-bg);
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-color-main);
            transition: background var(--transition-speed);
            font-size: 0.95rem;
        }

        .action-btn:hover {
            background-color: var(--action-hover);
        }

        /* --- Article Typography --- */
        .article-container {
            max-width: var(--max-content-width);
            margin: 0 auto;
            padding: var(--spacing-md) var(--spacing-sm);
        }

        .article-title {
            font-size: 2.2rem;
            line-height: 1.2;
            margin-bottom: var(--spacing-sm);
            color: var(--brand-color);
        }

        .article-meta {
            font-size: 0.95rem;
            color: var(--text-color-muted);
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-sm);
            border-bottom: 1px solid var(--border-color);
        }

        .article-body {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #2c2c2c;

        .article-body p {
            margin-bottom: var(--spacing-md);

            font-size: 1.5rem;
            margin-top: var(--spacing-lg);
            margin-bottom: var(--spacing-sm);
            color: var(--brand-color);
        }

        .article-body ul, .article-body ol {
            margin-bottom: var(--spacing-md);
            padding-left: var(--spacing-lg);
        }

        .article-body li {
            margin-bottom: var(--spacing-xs);

            word-break: break-all;
            display: inline-block;
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.95em;
        }

        /* --- Custom Modals & Toasts --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-speed), visibility var(--transition-speed);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--modal-bg);
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform var(--transition-speed);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 1.3rem;
            margin-bottom: var(--spacing-md);
            color: var(--brand-color);
        }

        .print-options {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .print-btn-option {
            background-color: var(--header-bg);
            border: 2px solid var(--border-color);
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .print-btn-option:hover {
            border-color: var(--brand-color);
            background-color: var(--action-bg);
        }

        .close-modal-btn {
            margin-top: var(--spacing-md);
            background: none;
            border: none;
            color: var(--text-color-muted);
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
            width: 100%;
            text-align: center;
        }

        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--brand-color);
            color: #FFFFFF;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            z-index: 3000;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
        }

        .toast-notification.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* --- Print Container (Hidden by default) --- */
        #print-engine-container {
            display: none;
        }

        /* ==========================================================================
           5. RESPONSIVE DESIGN (Mobile First Adjustments)
           ========================================================================== */
        @media (max-width: 768px) {
            .newspaper-name {
                font-size: 0.9rem;
            }
            .article-title {
                font-size: 1.8rem;
            }
            .article-body {
                font-size: 1.05rem;
            }
            .mobile-menu-btn {
                display: block;
            }
            /* Hide language text on mobile, keep icon */
            .lang-toggle-text {
                display: none;
            }
            .lang-toggle-btn {
                padding: 8px;
            }
        }

        /* ==========================================================================
           6. ADVANCED PRINT STYLES
           ========================================================================== */
        @media print {
            /* Hide UI Elements */
            .site-header, .hero-section, .action-bar, .modal-overlay, .toast-notification, .screen-only-article {
                display: none !important;
            }

            /* Reset Body */
            body {
                background: #FFFFFF !important;
                color: #000000 !important;
                padding-top: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            /* Activate Print Engine Container */
            #print-engine-container {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
            }

            .print-page {
                page-break-after: always;
                padding: 2cm !important;
            }

            .print-page:last-child {
                page-break-after: auto;
            }

            /* Print Header */
            .print-header {
                text-align: center;
                border-bottom: 2px solid #000;
                padding-bottom: 10px;
                margin-bottom: 20px;
            }
            
            .print-logo {
                height: 50px;
                filter: grayscale(100%) contrast(200%);
                margin-bottom: 10px;
            }

            .print-newspaper-name {
                font-size: 1.2rem;
                text-transform: uppercase;
                letter-spacing: 2px;
            }

            /* Print Typography (Enforcing fonts for print) */
            .print-page[lang="en"] * { font-family: 'EnglishMain', serif !important; }
            .print-page[lang="en"] h1, .print-page[lang="en"] h2, .print-page[lang="en"] h3, .print-page[lang="en"] .print-newspaper-name { font-family: 'EnglishHeader', sans-serif !important; }
            
            .print-page[lang="bn"] * { font-family: 'BanglaMain', serif !important; }
            .print-page[lang="bn"] h1, .print-page[lang="bn"] h2, .print-page[lang="bn"] h3, .print-page[lang="bn"] .print-newspaper-name { font-family: 'BanglaHeader', sans-serif !important; }

            .print-title {
                font-size: 24pt;
                line-height: 1.1;
                margin-bottom: 10pt;
            }

            .print-meta {
                font-size: 11pt;
                color: #333 !important;
                margin-bottom: 20pt;
            }

            .print-image {
                width: 100%;
                max-width: 500px;
                height: auto;
                margin: 0 auto 20pt auto;
                display: block;
                filter: grayscale(100%); /* Optimize for b/w print */
            }

            .print-body {
                font-size: 12pt;
                line-height: 1.6;
                text-align: justify;
            }

            .print-body h3 {
                font-size: 16pt;
                margin-top: 15pt;
                margin-bottom: 8pt;
                page-break-after: avoid;
            }

            .print-body p {
                margin-bottom: 10pt;
                orphans: 3;
                widows: 3;
            }

            .print-body ul {
                margin-bottom: 10pt;
                padding-left: 20pt;
            }
            
            a {
                text-decoration: none !important;
                color: #000 !important;
            }
        }
    </style>

                    <p>On July 2, 2024, the anti-quota movement in Bangladesh experienced a significant escalation, transitioning from isolated campus-based demonstrations into a coordinated, large-scale national protest. This day is frequently cited by observers and participants as a key moment when the movement gained the momentum that would eventually lead to the broader "July Uprising."</p>
                    
                    <p>Below are the detailed events and points related to that day:</p>

                    <h3>Key Developments on July 2, 2024</h3>
                    <ul>
                        <li><strong>Mass Mobilization at Shahbagh:</strong> The Shahbagh intersection in Dhaka, a historic protest hub, became the epicenter of the movement. Thousands of students from various universities and colleges converged there to stage a massive sit-in and demonstration. This was a notable shift from the previous days, which were largely contained within individual university campuses.</li>
                        <li><strong>Expansion of the Platform:</strong> The movement solidified under the banner of the "Anti-Discrimination Student Movement" (Boishommobirodhi Chhatro Andolon). While initially led primarily by Dhaka University students, the protest on July 2 saw a massive leap in coordination, drawing participants from across the capital’s educational institutions.</li>
                        <li><strong>The "Bangla Blockade" Concept:</strong> This day marked a significant increase in the use of the "Bangla Blockade" tactic. Protesters marched from the Dhaka University Central Library (beginning around 2:45 PM) through key areas including Nilkhet, Science Lab, and Bata Signal, eventually occupying the Shahbagh intersection. By blocking these vital points, students effectively halted traffic, causing widespread disruptions and forcing the issue into the public consciousness.</li>
                        <li><strong>Clarification of Demands:</strong> Coordinators of the movement used the platform to clearly articulate their opposition to the High Court’s June 5, 2024, verdict. This verdict had declared the 2018 government circular (which had abolished the quota system for first- and second-class jobs) illegal, effectively reinstating the old quota system.</li>
                        <li><strong>Ideological Stance:</strong> A major point of discussion on July 2 was the protesters' clarification regarding the Liberation War. Coordinators emphasized that they were not against the spirit of the Liberation War, but rather against the "hereditary" and "discriminatory" nature of the existing quota system. They argued that the quota for the descendants of freedom fighters was being misrepresented for political purposes.</li>
                    </ul>

                    <h3>Specific Demands articulated by students:</h3>
                    <ul>
                        <li>Immediate reinstatement of the 2018 government circular that ensured merit-based recruitment.</li>
                        <li>Formation of an independent commission to review and reform all quota systems in public service to ensure fairness.</li>
                        <li>Ensuring that quotas were only applicable to disadvantaged or marginalized communities as constitutionally required.</li>
                        <li>Ensuring that quota privileges could not be utilized more than once.</li>
                        <li>Ensuring that if quota seats remained vacant due to a lack of eligible candidates, they must be filled by merit-based candidates.</li>
                    </ul>

                    <h3>Contextual Significance</h3>
                    <p>July 2 was the second day of this specific wave of protests (which began on July 1). The scale of the mobilization on this day surprised many, including the government. It signaled to the public that the movement was not going to dissipate quickly, and it served as the "Monsoon Uprising's" precursor to the more violent and expansive protests that occurred later in July.</p>

        function copyShareLink() {
            // Strict URL requirement as per instructions
            const canonicalUrl = "https://istiack.ami.bd/july-corner/2-july/";
            
            // Fallback copy method for older browsers or iframe restrictions
            const textArea = document.createElement("textarea");
            textArea.value = canonicalUrl;
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Failed to copy text', err);
            }
            
            document.body.removeChild(textArea);
        }

        function showToast() {
            domElements.toastMsg.textContent = articleData[currentLang].toastCopySuccess;
            domElements.toastMsg.classList.add('active');
            
            setTimeout(() => {
                domElements.toastMsg.classList.remove('active');
            }, 3000);
        }

                </div>

        }

        function executePrint(mode) {
            closePrintModal();
            printContainer.innerHTML = ''; // Clear old buffer

            // Inject requested languages into the print DOM
            if (mode === 'en' || mode === 'both') {
                printContainer.innerHTML += buildPrintLayout('en');

            setTimeout(() => {
                window.print();
            }, 300);
