<html lang="en" dir="ltr">
<head>
    <!-- 
      =======================================================================
      ISTIACK'S JULY CORNER - BILINGUAL ARTICLE TEMPLATE
      Architecture: Mobile-First, Vanilla JS, Pure CSS, Semantic HTML5
      Features: 
        - Zero-reload Bilingual Switch (English / Bangla)
        - Strict Font Mapping via @font-face
        - Advanced Print Modal (Eng/Ban/Both)
        - Share link with Toast Notification
        - SVGs for all iconography (No Emojis)
      =======================================================================
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="July 1, 2024: The Genesis of the July Uprising - Anti-quota movement in Bangladesh.">
    <meta name="author" content="Istiack's July Corner">
    <meta name="theme-color" content="#ffffff">
    
    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="July 1, 2024: The Genesis of the July Uprising">
    <meta property="og:description" content="On July 1, 2024, the anti-quota movement in Bangladesh resumed as a wave of peaceful protests.">
    <meta property="og:image" content="./t.png">
    <meta property="og:url" content="https://istiack.ami.bd/july-corner/01-july/">
    <meta property="og:type" content="article">

    <title>1 July, 2024</title>

    <style>
        /* * ======================================================================
         * 1. FONT DEFINITIONS (Strict Asset Management)
         * Root Folder Access: /E1.ttf, /E2.ttf, /B1.ttf, /B2.ttf
         * ======================================================================
         */
        @font-face {
            font-family: 'EnglishMain';
            src: url('/E1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'EnglishHeader';
            src: url('/E2.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaHeader';
            src: url('/B1.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BanglaMain';
            src: url('/B2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* * ======================================================================
         * 2. CSS VARIABLES & THEMING
         * Pure Article Aesthetic: Minimalist, High Readability
         * ======================================================================
         */
        :root {
            /* Colors */
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --text-muted: #555555;
            --border-color: #e5e5e5;
            --brand-color: #000000;
            --hover-color: #f4f4f4;
            --overlay-color: rgba(0, 0, 0, 0.7);
            
            /* Typography Variables */
            --font-en-main: 'EnglishMain', system-ui, -apple-system, sans-serif;
            --font-en-header: 'EnglishHeader', system-ui, -apple-system, sans-serif;
            --font-bn-main: 'BanglaMain', sans-serif;
            --font-bn-header: 'BanglaHeader', sans-serif;
            
            /* Spacing & Layout */
            --header-height: 70px;
            --max-content-width: 720px;
            --page-padding-mobile: 1rem;
            --page-padding-desktop: 2rem;
            
            /* Transitions */
            --trans-speed: 0.3s;
            --trans-ease: ease-in-out;
        }

        /* * ======================================================================
         * 3. CSS RESET & BASE STYLES
         * ======================================================================
         */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Strict font inheritance ensures every letter is controlled */
            font-family: inherit; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-top: var(--header-height);
        }

        /* Language-Specific Font Application via Body Classes */
        body.lang-en {
            font-family: var(--font-en-main);
            font-size: 18px;
        }
        body.lang-en h1, 
        body.lang-en h2, 
        body.lang-en h3, 
        body.lang-en .header-title,
        body.lang-en .force-header-font {
            font-family: var(--font-en-header);
        }

        body.lang-bn {
            font-family: var(--font-bn-main);
            font-size: 20px; /* Bangla usually needs slightly larger text for legibility */
        }
        body.lang-bn h1, 
        body.lang-bn h2, 
        body.lang-bn h3, 
        body.lang-bn .header-title,
        body.lang-bn .force-header-font {
            font-family: var(--font-bn-header);
        }

        /* Strict Language Switcher Font Overrides (Independent of Body) */
        .ui-text-en { font-family: var(--font-en-main) !important; }
        .ui-text-bn { font-family: var(--font-bn-main) !important; }
        .ui-text-en-bold { font-family: var(--font-en-header) !important; }
        .ui-text-bn-bold { font-family: var(--font-bn-header) !important; }

        img, svg, video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Remove figure captions universally as requested */
        figure caption, figcaption {
            display: none !important;
        }

        a {
            color: var(--brand-color);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
            transition: color var(--trans-speed) var(--trans-ease);
        }

        a:hover {
            color: var(--text-muted);
        }

        button {
            background: none;
            border: none;
            cursor: pointer;
            color: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* * ======================================================================
         * 4. LAYOUT COMPONENTS
         * ======================================================================
         */

        /* Header (Fixed) */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--page-padding-mobile);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            /* Filter applied to make logo black and white as requested */
            filter: grayscale(100%);
        }

        .header-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--brand-color);
            text-decoration: none;
            margin: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Language Toggle Button */
        .lang-toggle-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.9rem;
            transition: background var(--trans-speed);
        }
        
        .lang-toggle-btn:hover {
            background-color: var(--hover-color);
        }

        /* Mobile Menu Toggle (Hamburger) */
        .menu-toggle-btn {
            display: none;
            padding: 8px;
        }

        /* Main Content Container */
        .main-content {
            max-width: var(--max-content-width);
            margin: 0 auto;
            padding: 2rem var(--page-padding-mobile);
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        /* Hero Image */
        .hero-section {
            margin-bottom: 1.5rem;
        }
        
        .hero-img {
            width: 100%;
            height: auto;
            border-radius: 4px; /* Slight rounding for elegance */
        }

        /* Action Bar (Share, Download/Print) */
        .action-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .action-btn {
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: color var(--trans-speed);
        }

        .action-btn:hover {
            color: var(--brand-color);
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Article Typography */
        .article-title {
            font-size: clamp(2rem, 5vw, 2.8rem);
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .article-meta {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .article-body p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            line-height: 1.7;
        }

        .article-body h3 {
            font-size: 1.5rem;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
        }

        .article-body ul {
            margin-bottom: 1.5rem;
            padding-left: 1.5rem;
        }

        .article-body li {
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .article-body .resources-list {
            list-style-type: none;
            padding: 0;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-top: 2rem;
        }

        .article-body .resources-list li {
            margin-bottom: 1rem;
            font-size: 0.95rem;
            word-break: break-all;
        }

        /* * ======================================================================
         * 5. UI COMPONENTS (Modal & Toast)
         * ======================================================================
         */

        /* Custom Print Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--overlay-color);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--trans-speed) var(--trans-ease);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: var(--bg-color);
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform var(--trans-speed) var(--trans-ease);
            text-align: center;
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .modal-header {
            margin-bottom: 1.5rem;
        }
        
        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .modal-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .modal-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            transition: all 0.2s;
            justify-content: center;
        }

        .modal-btn:hover {
            background: var(--brand-color);
            color: var(--bg-color);
            border-color: var(--brand-color);
        }

        .modal-btn.cancel-btn {
            margin-top: 10px;
            background: transparent;
            color: var(--text-muted);
            border-color: transparent;
        }
        
        .modal-btn.cancel-btn:hover {
            text-decoration: underline;
            background: transparent;
            color: var(--text-color);
        }

        /* Toast Notification (For Share Link) */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--brand-color);
            color: var(--bg-color);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .toast svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Hidden Buffer for "Print Both" Feature */
        #print-buffer {
            display: none;
        }

        /* * ======================================================================
         * 6. RESPONSIVE DESIGN (Media Queries)
         * ======================================================================
         */
        @media (max-width: 768px) {
            :root {
                --header-height: 60px;
            }
            .header-title {
                font-size: 0.95rem;
            }
            .lang-toggle-btn span.hide-on-mobile {
                display: none;
            }
            .lang-toggle-btn {
                padding: 6px 10px;
            }
            /* Hamburger implementation if needed for extra links */
            .menu-toggle-btn {
                display: flex;
            }
        }

        /* * ======================================================================
         * 7. ADVANCED PRINT STYLESHEET (@media print)
         * Requirements: 
         * - Proper font rendering on paper
         * - Black/White optimization
         * - Maintain article format exactly
         * - Hide UI/Interactive elements
         * - Include all pics, remove videos
         * ======================================================================
         */
        @media print {
            /* Basic Print Resets */
            @page {
                margin: 2cm;
                size: A4 portrait;
            }

            body {
                background: #fff !important;
                color: #000 !important;
                padding-top: 0 !important;
                font-size: 12pt !important;
            }

            /* Hide all interactive & UI elements */
            .site-header, 
            .action-bar, 
            .modal-overlay, 
            .toast,
            button,
            .no-print {
                display: none !important;
            }

            /* Ensure main content takes full width without margins */
            .main-content {
                max-width: 100% !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            /* Ensure Typography scales nicely and maintains font faces */
            .article-title {
                font-size: 24pt !important;
                color: #000 !important;
                page-break-after: avoid;
            }

            .article-meta {
                font-size: 11pt !important;
                color: #333 !important;
                margin-bottom: 20px !important;
            }

            h3 {
                font-size: 16pt !important;
                page-break-after: avoid;
                margin-top: 1.5em !important;
            }

            p, li {
                font-size: 12pt !important;
                line-height: 1.5 !important;
                color: #000 !important;
                orphans: 3; /* Prevent single lines at bottom */
                widows: 3;  /* Prevent single lines at top */
            }

            /* Links styling for paper */
            a {
                text-decoration: none !important;
                color: #000 !important;
            }

            /* Handling Media in Print */
            img {
                display: block !important;
                max-width: 100% !important;
                page-break-inside: avoid;
                filter: grayscale(100%) !important; /* Force b/w for optimal printing */
            }

            video, iframe, canvas, audio {
                display: none !important;
            }

            /* * Specific state handling for "Print Both" feature.
             * When the body has .printing-both class, we hide the main <main> 
             * tag and show the #print-buffer which contains the concatenated content.
             */
            body.printing-both .main-content {
                display: none !important;
            }
            body.printing-both #print-buffer {
                display: block !important;
            }

            /* Ensure page breaks inside the buffer work */
            .page-break {
                page-break-before: always;
                break-before: page;
            }
        }
    </style>
</head>

    <!--

    -->
    <script>
        /**
         * The Application Object containing Data, State, and Logic
         * Structured to be clean, modular, and performant.
         */
        const app = {
            // Configuration Constraints
            shareUrl: "https://istiack.ami.bd/july-corner/01-july/",
            
            // State
            currentLang: 'en', // default language
            
            // DOM Elements Cache

                mainContent: document.getElementById('mainArticle')

            /**

             * Contains all bilingual text for UI and Article Content.
             * Easy to update and expand.
             */
            content: {
                en: {
                    ui: {
                        toggleBtnText: "বাংলায় পড়ুন", // Text to show to switch TO bangla
                        toggleBtnClass: "ui-text-bn-bold",
                        share: "Share",
                        print: "Print",
                        toastCopied: "Link copied to clipboard!",
                        printModalTitle: "Print Options",
                        printModalDesc: "Which version would you like to print?",
                        cancel: "Cancel"
                    },
                    article: {
                        title: "July 1, 2024: The Genesis of the July Uprising",
                        date: "July 1, 2024",
                        intro: "On July 1, 2024, the anti-quota movement in Bangladesh resumed as a wave of peaceful protests. This day marked the beginning of the student-led demonstrations that would later escalate into the broader \"July Uprising.\"",
                        section1Title: "Key Events of July 1, 2024",
                        events: [

            /**
             * Generates the HTML string for the article based on language data
             * @param {Object} data - The article data object (en or bn)
             * @returns {String} HTML string
             */
            generateArticleHTML(data) {
                // Building HTML structurally
                let html = `
                    <h1 class="article-title">${data.title}</h1>
                    <div class="article-meta">${data.date}</div>
                    
                    <div class="article-body">
                        <p>${data.intro}</p>
                        
                        <h3>${data.section1Title}</h3>
                        <ul>
                `;

                // Add list items for events
                data.events.forEach(event => {
                    html += `<li><strong>${event.subtitle}:</strong> ${event.text}</li>`;
                });

                html += `
                        </ul>
                        
                        <h3>${data.section2Title}</h3>
                        <p>${data.resourcesIntro}</p>
                        
                        <ul class="resources-list">
                `;

                // Add list items for resources (rendering raw links as requested)
                data.resources.forEach(res => {
                    // Extracting the URL to make it clickable while keeping the raw text
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    const linkedRes = res.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
                    html += `<li>${linkedRes}</li>`;
                });

                html += `
                        </ul>
                    </div>
                `;

                return html;
            },

            /**
             * Renders the current language state to the DOM
             */
            render() {
                const data = this.content[this.currentLang];
                
                // 1. Update Body Classes for Font Hierarchy
                this.dom.body.className = `lang-${this.currentLang}`;

                // 2. Update UI Texts
                this.dom.langToggleText.textContent = data.ui.toggleBtnText;
                this.dom.langToggleText.className = data.ui.toggleBtnClass; // Forces the alternate language font on the button
                
                this.dom.uiShareText.textContent = data.ui.share;
                this.dom.uiPrintText.textContent = data.ui.print;
                this.dom.toastText.textContent = data.ui.toastCopied;
                
                this.dom.modalTitle.textContent = data.ui.printModalTitle;
                this.dom.modalDesc.textContent = data.ui.printModalDesc;
                this.dom.btnCancel.textContent = data.ui.cancel;

                // 3. Render Main Article Content
                // Fading effect for smooth transition
                this.dom.articleContainer.style.opacity = 0;
                
                setTimeout(() => {
                    this.dom.articleContainer.innerHTML = this.generateArticleHTML(data.article);
                    this.dom.articleContainer.style.opacity = 1;
                }, 150); // Small delay to allow fade out before injecting new DOM
            },

            /**
             * Toggles between English and Bangla
             */
            toggleLanguage() {
                this.currentLang = this.currentLang === 'en' ? 'bn' : 'en';
                this.render();
            },

            /**
             * Shares the article link via Clipboard API
             * Strict constraint: only copy the base folder URL, not index.html
             */
            async shareLink() {
                try {
                    await navigator.clipboard.writeText(this.shareUrl);
                    this.showToast();
                } catch (err) {
                    // Fallback for older browsers
                    const tempInput = document.createElement("input");
                    tempInput.value = this.shareUrl;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand("copy");
                    document.body.removeChild(tempInput);
                    this.showToast();
                }
            },

            /**
             * Displays the toast notification temporarily
             */
            showToast() {
                this.dom.toast.classList.add('show');
                setTimeout(() => {
                    this.dom.toast.classList.remove('show');
                }, 3000);
            },

            /**
             * Print logic triggers
             */
            openPrintModal() {
                this.dom.modal.classList.add('active');
            },

            closePrintModal() {
                this.dom.modal.classList.remove('active');
            },

            /**
             * Executes the printing based on user selection in the modal
             * @param {String} mode - 'en', 'bn', or 'both'
             */
            executePrint(mode) {
                this.closePrintModal();

                // Small delay to allow modal to close visually before browser print dialog freezes UI
                setTimeout(() => {
                    if (mode === 'en' || mode === 'bn') {
                        // User wants single language.
                        const previousLang = this.currentLang;
                        
                        // Switch language momentarily if needed
                        if (this.currentLang !== mode) {
                            this.currentLang = mode;
                            this.render();
                            // Wait for render to complete
                            setTimeout(() => {
                                window.print();
                                // Restore original language
                                this.currentLang = previousLang;
                                this.render();
                            }, 300);
                        } else {
                            window.print();
                        }
                    } 
                    else if (mode === 'both') {
                        // Advanced: Print Both Languages back-to-back
                        this.setupPrintBoth();
                        
                        // Wait for DOM to register changes
                        setTimeout(() => {
                            window.print();
                            // Cleanup after print dialog closes
                            this.cleanupPrintBoth();
                        }, 100);
                    }
                }, 300);
            },

            /**
             * Prepares the DOM for printing both English and Bangla sequentially
             */
            setupPrintBoth() {
                const enHtml = this.generateArticleHTML(this.content['en'].article);
                const bnHtml = this.generateArticleHTML(this.content['bn'].article);
                
                // Construct the buffer with a page break between the two versions
                // We wrap each in a div with the respective language class to enforce font rules
                this.dom.printBuffer.innerHTML = `
                    <div class="lang-en" style="font-family: var(--font-en-main);">
                        ${enHtml}
                    </div>
                    <div class="page-break"></div>
                    <div class="lang-bn" style="font-family: var(--font-bn-main);">
                        ${bnHtml}
                    </div>
                `;
                
                // Apply a body class that toggles visibility for print media query
                this.dom.body.classList.add('printing-both');
            },

            /**
             * Restores the DOM after printing both languages
             */
            cleanupPrintBoth() {
                this.dom.body.classList.remove('printing-both');
                this.dom.printBuffer.innerHTML = ''; // Free memory
            },

            /**
             * Initialize the application
             */
            init() {
                this.render();
            }
        };

        // Bootstrapping the Application
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });

    </script>
