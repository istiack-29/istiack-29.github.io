    <style>
        /* ==========================================================================
           1. CSS VARIABLES & THEME DEFINITIONS
           ========================================================================== */
        :root {
            /* Color Palette - Minimalist / Pure Article */
            --bg-color: #ffffff;
            --text-main: #111111;
            --text-muted: #444444;
            --border-color: #e5e5e5;
            --btn-bg: #f5f5f5;
            --btn-hover: #e0e0e0;
            --overlay-bg: rgba(0, 0, 0, 0.6);
            --modal-bg: #ffffff;
            --black: #000000;
            --white: #ffffff;
            
            /* Layout */
            --header-height: 70px;
            --content-max-width: 720px;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }

        /* ==========================================================================
           2. STRICT ASSET MANAGEMENT: TYPOGRAPHY (ROOT FOLDER)
           ========================================================================== */
        @font-face {
            font-family: 'EnMain';
            src: url('/E1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'EnHead';
            src: url('/E2.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'BnHead';
            src: url('/B1.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'BnMain';
            src: url('/B2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ==========================================================================
           3. RESET & BASE STYLES
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            padding-top: var(--header-height);
        }

        /* STRICT FONT ENFORCEMENT 
           Every single letter is controlled by these classes dynamically toggled via JS.
           !important is used to guarantee no browser overrides.
        */
        body.lang-en, body.lang-en * { font-family: 'EnMain', sans-serif !important; }
        body.lang-en h1, body.lang-en h2, body.lang-en h3, body.lang-en h4, body.lang-en h5, body.lang-en h6, body.lang-en .header-title, body.lang-en strong, body.lang-en b {
            font-family: 'EnHead', sans-serif !important;
        }

        body.lang-bn, body.lang-bn * { font-family: 'BnMain', sans-serif !important; }
        body.lang-bn h1, body.lang-bn h2, body.lang-bn h3, body.lang-bn h4, body.lang-bn h5, body.lang-bn h6, body.lang-bn .header-title, body.lang-bn strong, body.lang-bn b {
            font-family: 'BnHead', sans-serif !important;
        }

        /* Lists */
        ul, ol { padding-left: 1.5rem; margin-bottom: var(--spacing-md); }
        li { margin-bottom: 0.5rem; }

        /* Media */
        img, video, iframe {
            max-width: 100%;
            height: auto;
            display: block;
            margin: var(--spacing-lg) 0;
            border-radius: 4px;
        }
        
        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
        }

        /* ==========================================================================
           4. LAYOUT & COMPONENTS
           ========================================================================== */
        
        /* HEADER (Fixed) */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center; /* Center content, absolute positioning for sides */
            padding: 0 var(--spacing-md);
        }

        .header-logo {
            position: absolute;
            left: var(--spacing-md);
            height: 40px;
            width: auto;
            /* Rule: Make it black and white first */
            filter: grayscale(100%);
            margin: 0; /* Reset global img margin */
        }

        .header-title {
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            text-align: center;
            text-transform: uppercase;
        }

        .header-actions {
            position: absolute;
            right: var(--spacing-md);
            display: flex;
            gap: 10px;
        }

        /* BUTTONS */
        .btn {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-decoration: none;
        }
        
        .btn:hover { background-color: var(--btn-hover); }
        .btn:active { transform: scale(0.98); }

        .btn-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* MOBILE MENU HAMBURGER */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            color: var(--text-main);
        }

        .menu-toggle svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* ARTICLE CONTAINER */
        .article-container {
            max-width: var(--content-max-width);
            margin: 0 auto;
            padding: var(--spacing-lg) var(--spacing-md);
        }

        .hero-image {
            width: 100%;
            margin-top: 0;
            margin-bottom: var(--spacing-md);
            border-radius: 0;
        }

        /* ACTION BAR (Under Hero) */
        .action-bar {
            display: flex;
            justify-content: flex-start;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
        }

        /* CONTENT TYPOGRAPHY */
        .article-content h1 { font-size: 2.2rem; margin: var(--spacing-xl) 0 var(--spacing-md) 0; line-height: 1.3; }
        .article-content h2 { font-size: 1.8rem; margin: var(--spacing-xl) 0 var(--spacing-md) 0; line-height: 1.3; }
        .article-content h3 { font-size: 1.4rem; margin: var(--spacing-lg) 0 var(--spacing-sm) 0; line-height: 1.3; }
        .article-content p { margin-bottom: var(--spacing-md); font-size: 1.1rem; }
        .article-content .source-link { color: var(--text-muted); word-break: break-all; }
        .article-content hr { border: 0; border-top: 1px solid var(--border-color); margin: var(--spacing-xl) 0; }

        /* ==========================================================================
           5. MODALS & TOAST NOTIFICATIONS
           ========================================================================== */
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--text-main);
            color: var(--white);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 2000;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Print Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--overlay-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--modal-bg);
            padding: var(--spacing-xl);
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            margin-bottom: var(--spacing-lg);
            font-size: 1.3rem;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .modal-actions .btn {
            justify-content: center;
            padding: 12px;
            font-size: 1rem;
        }

        .btn-cancel {
            background-color: transparent;
            border: none;
            text-decoration: underline;
            margin-top: 10px;
        }
        .btn-cancel:hover { background-color: transparent; color: var(--text-muted); }

        /* ==========================================================================
           6. RESPONSIVE DESIGN (MOBILE-FIRST ADAPTATIONS)
           ========================================================================== */
        @media (max-width: 768px) {
            .header-logo {
                position: relative;
                left: 0;
            }
            .header-title {
                display: none; /* Hide newspaper name on mobile to save space, rely on logo */
            }
            .site-header {
                justify-content: space-between;
            }
            .header-actions {
                position: relative;
                right: 0;
                display: none; /* Hidden on mobile by default, shown via menu */
                flex-direction: column;
                position: absolute;
                top: var(--header-height);
                left: 0;
                width: 100%;
                background: var(--bg-color);
                padding: var(--spacing-md);
                border-bottom: 1px solid var(--border-color);
                box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            }
            .header-actions.menu-open {
                display: flex;
            }
            .menu-toggle {
                display: block;
            }
            .article-content h1 { font-size: 1.8rem; }
            .article-content h2 { font-size: 1.5rem; }
            .article-content p { font-size: 1rem; }
        }

        /* ==========================================================================
           7. ADVANCED PRINT CSS
           ========================================================================== */
        /* Container used exclusively for building the print document */
        #print-render-zone { display: none; }
        
        @media print {
            /* Hide UI elements */
            .site-header, 
            .action-bar,
            .toast,
            .modal-overlay {
                display: none !important;
            }

            /* Reset body */
            body {
                padding-top: 0 !important;
                background: #fff !important;
                color: #000 !important;
                font-size: 12pt !important;
            }

            /* Main container */
            .article-container {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* Hide Videos for Print */
            video, iframe {
                display: none !important;
            }

            /* Ensure Images print well */
            img {
                max-width: 100% !important;
                page-break-inside: avoid;
            }

            /* Typography optimized for ink */
            h1, h2, h3, p, li, .source-link {
                color: #000 !important;
                page-break-inside: avoid;
            }
            
            h1 { font-size: 24pt !important; margin-bottom: 12pt !important; }
            h2 { font-size: 18pt !important; margin-top: 20pt !important; margin-bottom: 10pt !important; }
            h3 { font-size: 14pt !important; margin-top: 15pt !important; margin-bottom: 8pt !important; }
            p { font-size: 12pt !important; line-height: 1.5 !important; margin-bottom: 10pt !important; }

            /* Ensure links are printed clearly as text */
            .source-link {
                text-decoration: none !important;
                word-wrap: break-word !important;
            }

            /* Logic for custom print modes (En, Bn, Both) handled by JS dynamically swapping DOM */
            
            /* Page breaks for 'Both' languages mode */
            .print-page-break {
                page-break-before: always;
                border-top: 2px dashed #000;
                margin-top: 40pt;
                padding-top: 40pt;
            }
        }
    </style>
</head>

        const uiNewspaperName = document.getElementById('ui-newspaper-name');
        const langToggleBtn = document.getElementById('lang-toggle-btn');
        const uiLangText = document.getElementById('ui-lang-text');
        const uiShareText = document.getElementById('ui-share-text');
        const uiPrintText = document.getElementById('ui-print-text');
        
        const uiModalTitle = document.getElementById('ui-modal-title');
        const btnPrintEn = document.getElementById('print-opt-en');
        const btnPrintBn = document.getElementById('print-opt-bn');

        const btnPrintCancel = document.getElementById('print-opt-cancel');
        
        const toastMsg = document.getElementById('toast-msg');

        // --- CORE FUNCTIONS ---

        /**
         * Builds the HTML string for the content blocks based on language
         */
        function generateHTML(blocksData) {
            let html = '';
            blocksData.forEach(block => {
                switch(block.type) {
                    case 'paragraph':
                        // Simple URL text conversion is already handled in the JSON structure
                        html += `<p>${block.content}</p>`;
                        break;
                    case 'heading':
                        html += `<h${block.level}>${block.content}</h${block.level}>`;
                        break;
                    case 'list':
                        html += `<ul>`;
                        block.items.forEach(item => { html += `<li>${item}</li>`; });
                        html += `</ul>`;
                        break;
                    case 'image':
                        // No captions allowed per instructions
                        html += `<img src="${block.src}" onerror="this.style.display='none'">`;
                        break;
                    case 'video-embed':
                        html += `<iframe src="${block.src}" allowfullscreen></iframe>`;
                        break;
                    case 'video-local':
                        html += `<video src="${block.src}" controls preload="metadata"></video>`;
                        break;
                    case 'divider':
                        html += `<hr>`;
                        break;
                }
            });
            return html;
        }

        /**
         * Renders the page in the target language
         */
        function setLanguage(lang) {
            currentLang = lang;
            const data = articleData[lang];

            // 1. Update Body Font Class (Strict Rule Application)
            bodyEl.className = ''; 
            bodyEl.classList.add(`lang-${lang}`);

            // 2. Update Static UI Elements
            uiNewspaperName.textContent = data.ui.newspaperName;
            
            // Toggle Button Text: If currently EN, show Bangla toggle text, else English
            uiLangText.textContent = lang === 'en' ? articleData.bn.ui.langToggle : articleData.en.ui.langToggle;
            
            uiShareText.textContent = data.ui.share;
            uiPrintText.textContent = data.ui.print;
            uiModalTitle.textContent = data.ui.modalTitle;
            btnPrintEn.textContent = data.ui.printEn;
            btnPrintBn.textContent = data.ui.printBn;
            btnPrintBoth.textContent = data.ui.printBoth;
            btnPrintCancel.textContent = data.ui.cancel;
            toastMsg.textContent = data.ui.copiedToast;

            // 3. Render Dynamic Content
            dynContentArea.innerHTML = generateHTML(data.blocks);
        }

        // --- EVENT LISTENERS ---

        // Language Toggle
        langToggleBtn.addEventListener('click', () => {
            const nextLang = currentLang === 'en' ? 'bn' : 'en';
            setLanguage(nextLang);
        });

        // Mobile Menu Toggle
        const menuToggleBtn = document.getElementById('menu-toggle-btn');
        const headerActionsMenu = document.getElementById('header-actions-menu');
        menuToggleBtn.addEventListener('click', () => {
            headerActionsMenu.classList.toggle('menu-open');
        });

        // Share Action (Strict: copy exact URL)
        const shareBtn = document.getElementById('share-btn');
        shareBtn.addEventListener('click', async () => {
            const strictUrl = "https://istiack.ami.bd/july-corner/14-july/";
            try {
                // Use clipboard API
                await navigator.clipboard.writeText(strictUrl);
                showToast();
            } catch (err) {
                // Fallback for older browsers
                const tempInput = document.createElement('input');
                tempInput.value = strictUrl;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showToast();
            }
        });

        function showToast() {
            toastMsg.classList.add('show');
            setTimeout(() => {
                toastMsg.classList.remove('show');
            }, 3000);
        }

        // --- PRINT PIPELINE ---
        const printTriggerBtn = document.getElementById('print-trigger-btn');
        const printModal = document.getElementById('print-modal');
        const printRenderZone = document.getElementById('print-render-zone');
        const mainUiContainer = document.getElementById('main-ui-container');

        printTriggerBtn.addEventListener('click', () => {
            printModal.classList.add('active');
        });

        btnPrintCancel.addEventListener('click', () => {
            printModal.classList.remove('active');
        });

        function executePrint(mode) {
            // Close modal
            printModal.classList.remove('active');
            
            // Clear print zone
            printRenderZone.innerHTML = '';

            // Build print content
            let printContent = '';

            if (mode === 'en' || mode === 'both') {
                printContent += `<div class="article-container lang-en">`;
                printContent += `<h1>${articleData.en.ui.newspaperName}</h1>`;
                printContent += `<img src="./t.png" style="width:100%; margin-bottom: 20px;">`;
                printContent += generateHTML(articleData.en.blocks);
                printContent += `</div>`;
            }

            if (mode === 'both') {
                printContent += `<div class="print-page-break"></div>`;
            }

            if (mode === 'bn' || mode === 'both') {
                printContent += `<div class="article-container lang-bn">`;
                printContent += `<h1>${articleData.bn.ui.newspaperName}</h1>`;
                if(mode === 'bn') { 
                    // Only render hero image again if it's strictly Bangla mode, 
                    // if both, we already have it at the top.
                    printContent += `<img src="./t.png" style="width:100%; margin-bottom: 20px;">`;
                }
                printContent += generateHTML(articleData.bn.blocks);
                printContent += `</div>`;
            }

            // Inject to print zone
            printRenderZone.innerHTML = printContent;

            // Swap visibility for printing using CSS classes instead of inline styles
            // Note: Our @media print CSS already hides main-ui-container, site-header, etc.
            // We just need to make the print render zone visible during print.
            
            // Add a temporary style block specifically for this print instance
            const tempPrintStyle = document.createElement('style');
            tempPrintStyle.id = 'temp-print-style';
            tempPrintStyle.innerHTML = `
                @media print {
                    #main-ui-container { display: none !important; }
                    #print-render-zone { display: block !important; }
                }
            `;
            document.head.appendChild(tempPrintStyle);

            // Trigger browser print
            setTimeout(() => {
                window.print();
                
                // Cleanup after print dialog closes
                setTimeout(() => {
                    printRenderZone.innerHTML = '';
                    const styleToRemove = document.getElementById('temp-print-style');
                    if (styleToRemove) styleToRemove.remove();
                }, 500);
            }, 100);
        }

        btnPrintEn.addEventListener('click', () => executePrint('en'));
        btnPrintBn.addEventListener('click', () => executePrint('bn'));
        btnPrintBoth.addEventListener('click', () => executePrint('both'));

        // Initialize app in default language
        setLanguage(currentLang);

    </script>
</body>
</html>
